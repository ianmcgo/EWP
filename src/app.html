<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Epic Warpath Army Builder</title>
<meta name="description" content="A fast, offline-friendly army list builder for Epic Warpath with company slot tracking, validation, printing and sharing.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1216;--panel:#171b21;--panel2:#1d222a;--line:#2a313b;--line2:#353e4a;
  --text:#e6e9ee;--muted:#9aa3af;--dim:#6b7380;
  --accent:#e0a63a;--ok:#5cbf7a;--warn:#e0a63a;--bad:#e2604f;
  --fac:#e0a63a;
  --hq:#d9b44a;--troop:#6aa5e0;--spec:#b07fe0;--sup:#e0804f;--trans:#5cbfa8;--super:#e05f7c;
  --radius:10px;
  --head:"Barlow Condensed",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--fac)}
.app{display:grid;grid-template-rows:auto auto 1fr auto;min-height:100vh}
header.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#0b0e12;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-family:var(--head);font-weight:700;font-size:20px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.brand span{color:var(--fac)}
.listname{flex:1 1 200px;min-width:140px;background:transparent;border:1px solid transparent;border-radius:6px;padding:6px 8px;font-family:var(--head);font-size:20px;font-weight:600}
.listname:hover{border-color:var(--line)}
.listname:focus{outline:none;border-color:var(--fac);background:var(--panel)}
.tbtn{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:7px 12px;font-weight:600;font-size:14px;white-space:nowrap}
.tbtn:hover{border-color:var(--fac)}
.tbtn.primary{background:var(--fac);color:#111;border-color:var(--fac)}
.bar{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:20}
.field{display:flex;align-items:center;gap:6px}
.field label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
select,.num{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:6px 8px}
.num{width:84px}
.pts{flex:1 1 260px;min-width:220px}
.ptsline{display:flex;justify-content:space-between;font-family:var(--head);font-size:18px;font-weight:600}
.ptsline .left{color:var(--muted);font-size:15px}
.meter{height:8px;background:var(--panel2);border-radius:6px;overflow:hidden;margin-top:4px;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--ok);transition:width .25s}
.meter.over i{background:var(--bad)}
.status{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px;padding:6px 10px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2)}
.status.ok{color:var(--ok)}.status.bad{color:var(--bad)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(330px,1fr);gap:16px;padding:16px;align-items:start}
@media (min-width:1360px){main{grid-template-columns:minmax(0,1.2fr) minmax(340px,1fr) minmax(300px,.85fr)}}
.col{min-width:0}
.tabs{display:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.ph{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ph h2{margin:0;font-family:var(--head);font-size:19px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;flex:1}
.issues{margin:0 0 14px;padding:10px 14px;border-radius:var(--radius);border:1px solid rgba(226,96,79,.4);background:rgba(226,96,79,.08)}
.issues h3{margin:0 0 6px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--bad)}
.issues ul{margin:0;padding-left:18px}
.issues li{margin:2px 0}
.company{margin-bottom:14px}
.company.active{border-color:var(--fac);box-shadow:0 0 0 1px var(--fac) inset}
.ch{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.ch h3{margin:0;font-family:var(--head);font-size:18px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;flex:1}
.ch .cpts{font-family:var(--head);font-weight:600;color:var(--muted)}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:20px;background:var(--fac);color:#111}
.ibtn{background:transparent;border:1px solid transparent;border-radius:6px;padding:4px 7px;color:var(--muted);font-size:14px;line-height:1}
.ibtn:hover{border-color:var(--line2);color:var(--text)}
.ibtn.danger:hover{color:var(--bad);border-color:var(--bad)}
.slots{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel2)}
.slot{display:flex;align-items:center;gap:6px;font-size:13px;padding:4px 8px;border-radius:7px;border:1px solid var(--line2);background:var(--panel)}
.slot b{font-family:var(--head);font-size:15px}
.slot .sw{width:8px;height:8px;border-radius:2px}
.slot.need{border-color:var(--bad);color:#ffd6cf}
.slot.full{opacity:.75}
.slot.over{border-color:var(--bad);background:rgba(226,96,79,.15)}
.cbody{padding:6px 0}
.empty{padding:16px;color:var(--muted);font-size:14px}
.empty b{color:var(--text)}
.grp{padding:6px 12px 2px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:6px}
.grp .sw{width:8px;height:8px;border-radius:2px}
.row{display:flex;align-items:center;gap:8px;padding:7px 12px;border-top:1px solid transparent}
.row:hover{background:var(--panel2)}
.row .nm{flex:1;min-width:0;cursor:pointer}
.row .nm b{font-weight:600}
.row .sub,.prow .sub{display:block;font-size:12px;color:var(--muted)}
.row .p{font-family:var(--head);font-weight:600;font-size:17px;min-width:44px;text-align:right}
.u-badge{font-size:10px;font-weight:700;border:1px solid var(--muted);color:var(--muted);border-radius:4px;padding:0 4px;margin-left:4px;vertical-align:1px}
.ct{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-top:3px;cursor:pointer;width:max-content}
.ct input{accent-color:var(--fac)}
.addc{display:flex;gap:8px;flex-wrap:wrap;padding:0 0 4px}
.picker .ph{position:sticky;top:0}
.pick-tools{display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:140px;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:7px 10px}
.target{font-size:13px;color:var(--muted)}
.target b{color:var(--fac)}
.prow{display:flex;align-items:center;gap:8px;padding:7px 12px}
.prow:hover{background:var(--panel2)}
.prow .nm{flex:1;min-width:0;cursor:pointer}
.prow .why{display:block;font-size:12px;color:var(--warn)}
.prow.off .nm b{color:var(--muted)}
.add{width:34px;height:34px;border-radius:8px;border:1px solid var(--fac);background:transparent;color:var(--fac);font-size:20px;font-weight:700;line-height:1;flex:none}
.add:hover{background:var(--fac);color:#111}
.add:disabled{border-color:var(--line2);color:var(--dim);cursor:not-allowed;background:transparent}
.card{margin:4px 12px 10px;border:1px solid var(--line2);border-radius:8px;background:#12161b;overflow:hidden}
.card .chd{display:flex;gap:8px;align-items:baseline;padding:8px 10px;background:var(--panel2);flex-wrap:wrap}
.card .chd b{font-family:var(--head);font-size:17px;letter-spacing:.03em}
.card .chd span{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(8,1fr);text-align:center;border-bottom:1px solid var(--line)}
.stats div{padding:5px 2px;border-right:1px solid var(--line)}
.stats div:last-child{border-right:0}
.stats small{display:block;font-size:10px;color:var(--dim);font-weight:700;letter-spacing:.06em}
.stats strong{font-family:var(--head);font-size:16px}
.kws{display:flex;flex-wrap:wrap;gap:5px;padding:8px 10px;border-bottom:1px solid var(--line)}
.kw{font-size:12px;border:1px solid var(--line2);border-radius:5px;padding:1px 7px;background:var(--panel);cursor:help;font-style:italic}
.kw:hover{border-color:var(--fac)}
.kw.none{cursor:default;font-style:normal;color:var(--dim)}
table.wp{width:100%;border-collapse:collapse;font-size:13px}
table.wp th{font-size:10px;color:var(--dim);text-align:left;padding:5px 8px;letter-spacing:.06em;font-weight:700;text-transform:uppercase}
table.wp td{padding:5px 8px;border-top:1px solid var(--line);vertical-align:top}
table.wp td.c{text-align:center;white-space:nowrap}
table.wp tr.g td{color:var(--muted);font-style:italic;padding-bottom:0}
.mode{font-size:10px;color:var(--fac);font-weight:700;margin-left:4px}
.rules{padding:6px 10px 10px;font-size:13px}
.rules p{margin:6px 0}
.note{margin:8px 10px;padding:7px 9px;border-left:3px solid var(--warn);background:rgba(224,166,58,.08);font-size:12.5px;color:#f0dcb4}
.pop{position:fixed;z-index:100;max-width:340px;background:#20262f;border:1px solid var(--line2);border-radius:8px;padding:10px 12px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.pop b{display:block;font-family:var(--head);font-size:16px;margin-bottom:4px;color:var(--fac)}
.side-sec{padding:12px 14px;border-bottom:1px solid var(--line)}
.side-sec:last-child{border-bottom:0}
.side-sec h3{margin:0 0 8px;font-family:var(--head);font-size:16px;letter-spacing:.05em;text-transform:uppercase}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kv div{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center}
.kv small{display:block;font-size:10px;color:var(--dim);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.kv strong{font-family:var(--head);font-size:22px}
.dice{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.die{display:flex;align-items:center;gap:5px;font-size:13px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 8px}
.die i{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid rgba(255,255,255,.3)}
.die i.Black{background:#111}.die i.Orange{background:#e07a1f}.die i.Green{background:#3fa34d}
.strat{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.strat:first-of-type{border-top:0}
.strat .sd{flex:1;font-size:13px}
.strat .sd b{font-size:14px}
.strat .sd span{display:block;color:var(--muted);font-size:12.5px}
.strat input[type=checkbox]{accent-color:var(--fac);width:18px;height:18px;margin-top:2px}
.strat select{padding:4px 6px;font-size:13px}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:24px;height:24px;border-radius:5px;border:1px solid var(--line2);background:var(--panel2);line-height:1}
.order{border-top:1px solid var(--line);padding:8px 0;font-size:13px}
.order:first-of-type{border-top:0}
.order b{font-size:14px}
.order .cost{float:right;font-family:var(--head);font-weight:700;color:var(--fac)}
.order .when{color:var(--muted);font-style:italic;margin:2px 0}
details.gl summary{cursor:pointer;font-weight:600;padding:5px 0}
details.gl p{margin:2px 0 8px;font-size:13px;color:#cfd4db}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:12px;width:min(640px,100%);overflow:hidden}
.modal .ph{background:var(--panel2)}
.mbody{padding:14px}
.lrow{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--panel2)}
.lrow.cur{border-color:var(--fac)}
.lrow .nm{flex:1;cursor:pointer;min-width:0}
.lrow .nm small{display:block;color:var(--muted)}
textarea.out{width:100%;min-height:260px;background:#0d1014;border:1px solid var(--line2);border-radius:8px;padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.facgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.facbtn{padding:14px 10px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);text-align:left}
.facbtn:hover{border-color:var(--c)}
.facbtn b{display:block;font-family:var(--head);font-size:19px;color:var(--c);letter-spacing:.03em}
.facbtn small{color:var(--muted)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#20262f;border:1px solid var(--fac);padding:9px 16px;border-radius:8px;z-index:120;font-weight:600}
.thumb{width:44px;height:44px;border-radius:7px;object-fit:cover;background:#0d1014;border:1px solid var(--line);flex:none;cursor:pointer}
.thumb.none{display:inline-block;background:repeating-linear-gradient(45deg,#14181d,#14181d 4px,#181d23 4px,#181d23 8px)}
.uimg{background:#0d1014;border-bottom:1px solid var(--line);display:flex;justify-content:center}
.uimg{position:relative}
.imgnote{position:absolute;left:8px;bottom:8px;font-size:11px;font-weight:600;background:rgba(0,0,0,.7);color:#e6e9ee;padding:2px 7px;border-radius:5px}
.uimg img{max-width:100%;max-height:260px;object-fit:contain;display:block}
.e-badge{font-size:9.5px;font-weight:700;letter-spacing:.05em;border:1px solid var(--warn);color:var(--warn);border-radius:4px;padding:0 4px;margin-left:5px;vertical-align:1px;font-style:normal}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--panel);border-left:1px solid var(--line2);z-index:95;display:flex;flex-direction:column;box-shadow:-20px 0 40px rgba(0,0,0,.5);transform:translateX(105%);transition:transform .22s}
.drawer.open{transform:none}
.drawer .ph{background:var(--panel2)}
.dbody{overflow:auto;flex:1;padding-bottom:30px}
.dsec{padding:12px 14px;border-bottom:1px solid var(--line)}
.dsec h3{margin:0 0 8px;font-family:var(--head);font-size:17px;letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.drow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.qn{min-width:34px;height:32px;border-radius:7px;border:1px solid var(--line2);background:var(--panel2);font-weight:700}
.qn.on{border-color:var(--fac);color:var(--fac)}
.rollbtn{background:var(--fac);color:#111;border:0;border-radius:8px;padding:9px 16px;font-family:var(--head);font-size:17px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tray{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.d8{width:36px;height:36px;display:grid;place-items:center;font-family:var(--head);font-weight:700;font-size:19px;border-radius:7px;background:var(--panel2);border:1px solid var(--line2);color:var(--dim);animation:pop .25s}
.d8.hit{color:#111;background:var(--ok);border-color:var(--ok)}
.d8.ex{background:var(--fac);border-color:var(--fac);color:#111;box-shadow:0 0 0 2px rgba(255,255,255,.25) inset}
.d8.bonus{outline:2px dashed var(--fac);outline-offset:1px}
@keyframes pop{from{transform:scale(.6) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
.res{margin-top:10px;font-family:var(--head);font-size:20px;font-weight:700}
.res small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:400}
.cd{width:46px;height:46px;border-radius:9px;display:grid;place-items:center;cursor:pointer;animation:pop .25s;position:relative;border:2px solid rgba(255,255,255,.15)}
.cd.Black{background:#121212}.cd.Orange{background:#e8641e}.cd.Green{background:#7ccf3a}
.cd svg{width:34px;height:34px}
.cd.Black svg{fill:#e8e8e8}.cd.Orange svg,.cd.Green svg{fill:#141414}
.cd.spent{opacity:.28}
.cd .tri{display:flex;align-items:center}
.cd .tri svg{width:24px;height:24px}
.cd .tri svg+svg{margin-left:-6px}
.cd.rr::after{content:"↻";position:absolute;top:-7px;right:-7px;background:var(--fac);color:#111;border-radius:50%;width:17px;height:17px;font-size:12px;display:grid;place-items:center;font-weight:700}
.cpbox{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.cpbox .big{font-family:var(--head);font-size:30px;font-weight:700;color:var(--fac);line-height:1}
.tdie{width:72px;height:72px;border-radius:12px;background:var(--panel2);border:1px solid var(--line2);color:var(--text);display:grid;place-items:center;font-family:var(--head);font-size:26px;font-weight:700;position:relative;flex:none;transform:rotate(var(--rot));animation:tspin .55s cubic-bezier(.2,.8,.3,1)}
.tdie.hit{background:var(--ok);border-color:var(--ok);color:#111;font-size:17px;line-height:1;text-align:center;letter-spacing:.04em;transform:none;animation:pop .3s}
.tbox{width:100px;height:100px;display:grid;place-items:center;flex:none}
.tdie i{position:absolute;top:3px;left:50%;transform:translateX(-50%);font-style:normal;font-size:14px;color:var(--fac);line-height:1}
@keyframes tspin{from{transform:rotate(calc(var(--rot) - var(--spin))) scale(.6);opacity:0}to{transform:rotate(var(--rot));opacity:1}}
.faces{display:grid;grid-template-columns:auto repeat(6,1fr);gap:4px;align-items:center;font-size:12px;margin-top:6px}
.faces select{padding:2px;font-size:12px}
.roll3d{position:fixed;inset:0;z-index:300;display:none;background:#1d2a14}
.roll3d.open{display:block}
.roll3d canvas{width:100%;height:100%;display:block}
.roll3d::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.6))}
.r3-banner{position:absolute;top:22px;left:0;right:0;text-align:center;font-family:var(--head);font-size:28px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fac);text-shadow:0 2px 12px rgba(0,0,0,.8);opacity:0;z-index:2;pointer-events:none}
.r3-banner.on{animation:bann 1.8s ease forwards}
@keyframes bann{0%{opacity:0;transform:translateY(-12px) scale(.96)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:.85}}
.r3-hint{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:var(--muted);font-size:13px;z-index:2;pointer-events:none}
.r3-hint.top{bottom:auto;top:72px;color:#fff;font-size:15px;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.9)}
.r3-bar{position:absolute;left:50%;bottom:22px;transform:translate(-50%,30px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:18px;background:rgba(23,27,33,.94);border:1px solid var(--line2);border-radius:14px;padding:12px 14px 12px 20px;z-index:3;transition:.3s;max-width:calc(100% - 32px);box-shadow:0 10px 40px rgba(0,0,0,.6)}
.r3-bar.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.r3-sum{font-family:var(--head);font-size:26px;font-weight:700;line-height:1.1}
.r3-sum b{color:var(--fac)}
.r3-sum small{display:block;font-family:var(--body);font-size:13px;font-weight:400;color:var(--muted)}
.r3-ok{font-size:20px;padding:11px 26px;flex:none}
.r3-again{flex:none;padding:11px 16px;font-size:15px}
@media (max-width:600px){.r3-bar{left:12px;right:12px;transform:translateY(30px);max-width:none;gap:10px;padding:10px 10px 10px 14px}.r3-bar.on{transform:none}.r3-bar{flex-wrap:wrap}.r3-sum{font-size:22px;flex:1 1 100%;min-width:0;text-align:center}.r3-sum small{font-size:12px}.r3-ok{font-size:17px;padding:10px 14px;flex:1}.r3-again{padding:10px;font-size:14px;flex:1}.r3-banner{font-size:21px;padding:0 12px}}
.rlinks{display:flex;gap:8px;flex-wrap:wrap}
.rlinks a{text-decoration:none;color:var(--text)}
.reader{position:fixed;inset:0;z-index:97;background:var(--bg);display:none;flex-direction:column}
.reader.open{display:flex}
body.noscroll{overflow:hidden}
.rd-top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#0b0e12;border-bottom:1px solid var(--line)}
.rd-title{font-family:var(--head);font-size:20px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
#rdChSel{display:none;max-width:44%}
.rd-top .search{flex:1;min-width:0}
.rd-top .ibtn{font-size:18px}
.rd-body{flex:1;display:grid;grid-template-columns:250px minmax(0,1fr);min-height:0}
.rd-nav{overflow:auto;border-right:1px solid var(--line);padding:8px;background:var(--panel)}
.rn{display:flex;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:7px;padding:7px 9px;color:var(--muted);font-size:14px}
.rn span{color:var(--dim);min-width:18px;text-align:right}
.rn:hover{background:var(--panel2);color:var(--text)}
.rn[aria-current]{background:var(--panel2);color:var(--fac);font-weight:600}
.rd-main{overflow:auto;padding:18px 28px 60px;line-height:1.55;max-width:none}
.rd-main>*{max-width:820px;margin-left:auto;margin-right:auto}
.rd-main h2{font-family:var(--head);font-size:30px;letter-spacing:.03em;margin:0 0 6px}
.rchead small{color:var(--fac);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:12px}
.rtocs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 18px}
.rt{font-size:13px;border:1px solid var(--line2);background:var(--panel2);border-radius:20px;padding:4px 11px}
.rt:hover{border-color:var(--fac)}
.rs{scroll-margin-top:10px;border-radius:8px;padding:2px 0}
.rs.flash{animation:flash 1.6s}
@keyframes flash{0%,40%{background:rgba(224,166,58,.14)}100%{background:transparent}}
.rs h3{font-family:var(--head);font-size:22px;margin:22px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line2);display:flex;align-items:baseline;gap:8px}
.rs h4{font-family:var(--head);font-size:18px;margin:16px 0 4px;display:flex;align-items:baseline;gap:8px;color:#f1e3c4}
.rm{color:var(--fac);font-size:.8em}
.rp{margin-left:auto;font-family:var(--body);font-size:11px;color:var(--dim);font-weight:500}
.rbody p{margin:6px 0}
.rbody h5{font-size:15px;margin:12px 0 4px;color:var(--fac)}
.rbody img{display:block;max-width:100%;height:auto;margin:12px auto;border-radius:8px;background:#fff}
.rbody table{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px}
.rbody td,.rbody th{border:1px solid var(--line2);padding:6px 8px;vertical-align:top}
.rbody th{background:var(--panel2)}
.rbody tr td:first-child{white-space:nowrap;font-weight:600}
.rbody ul,.rbody ol{padding-left:22px}
.rpager{display:flex;justify-content:space-between;gap:10px;margin-top:30px!important}
.rtoc{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:14px}
.rtc{display:grid;grid-template-columns:auto 1fr;gap:0 10px;text-align:left;border:1px solid var(--line2);background:var(--panel2);border-radius:10px;padding:12px}
.rtc span{grid-row:span 2;font-family:var(--head);font-size:24px;color:var(--fac);font-weight:700}
.rtc b{font-family:var(--head);font-size:17px}
.rtc small{color:var(--muted)}
.rtc:hover{border-color:var(--fac)}
.rtc.ext,.rn.ext{text-decoration:none;color:inherit}
.rtc.ext{border-style:dashed}
.rn.ext{color:var(--fac)}
.rhit{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:9px 12px;margin:0 auto 8px}
.rhit small{display:block;color:var(--fac);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.rhit b{display:block;font-family:var(--head);font-size:17px}
.rhit span{color:var(--muted);font-size:13px}
.rhit mark{background:rgba(224,166,58,.35);color:var(--text);border-radius:3px}
.rhit:hover{border-color:var(--fac)}
@media (max-width:900px){.rd-body{grid-template-columns:1fr}.rd-nav{display:none}#rdChSel{display:block}.rd-main{padding:12px 16px 50px}.rd-title{display:none}.rd-top{flex-wrap:wrap}.rd-top .search{order:3;flex:1 1 100%}#rdChSel{flex:1;max-width:none}.rd-main h2{font-size:25px}}
.dmenu{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.scard{display:flex;flex-direction:column;gap:8px}
.sp{border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:10px 12px}
.sp p{margin:6px 0 0;font-size:14px;line-height:1.45}
.sp .sx{color:#f0dcb4;border-left:3px solid var(--fac);padding-left:8px}
.sgame{margin-top:8px}
.sgame .tbtn{margin-top:8px}
.sph{display:flex;align-items:center;gap:9px}
.sph b{font-family:var(--head);font-size:18px;letter-spacing:.04em;text-transform:uppercase;flex:1}
.sn{width:24px;height:24px;border-radius:50%;background:var(--fac);color:#111;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.sroll{font-family:var(--head);font-weight:700;font-size:22px;min-width:44px;text-align:center;border:1px solid var(--line2);border-radius:8px;padding:0 6px;background:var(--panel);line-height:1.15}
.sroll small{display:block;font-family:var(--body);font-size:10px;color:var(--dim);font-weight:600}
.sres{display:inline-block;margin-left:6px;font-weight:700;color:var(--muted)}
.sres.ok{color:var(--ok)}
.lscn{cursor:pointer}
.dbig{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:132px;border-radius:14px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);padding:12px 6px}
.dbig:hover,.dbig:focus-visible{border-color:var(--fac);color:var(--fac)}
.dbig:active{transform:scale(.97)}
.dbig svg{width:52px;height:52px}
.dbig b{font-family:var(--head);font-size:22px;letter-spacing:.04em;text-transform:uppercase;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.dbig small{font-size:12px;color:var(--muted)}
.dback{display:flex;align-items:center;gap:10px;padding-top:10px;padding-bottom:10px}
.dback .ibtn{font-size:15px;font-weight:600;color:var(--text);border-color:var(--line2);padding:6px 10px}
.rollbtn.wide,.tbtn.wide{width:100%;padding:14px;font-size:19px}
.tbtn.wide{font-size:15px}
.dlog h3{display:flex;align-items:center}
.le{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;background:var(--panel2)}
.le.new{border-color:var(--fac)}
.lh{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.lh span{color:var(--dim)}
.lr{display:flex;align-items:center;gap:10px}
.lchips{display:flex;flex-wrap:wrap;gap:4px;flex:1}
.lt{font-family:var(--head);font-weight:700;font-size:18px;white-space:nowrap;color:var(--fac)}
.lc{min-width:24px;height:24px;padding:0 4px;display:grid;place-items:center;border-radius:5px;background:var(--panel);border:1px solid var(--line2);font-family:var(--head);font-weight:700;font-size:14px;color:var(--dim)}
.lc.hit{background:var(--ok);border-color:var(--ok);color:#111}
.lc.ex{box-shadow:0 0 0 2px var(--fac) inset}
.lc.bonus{outline:1.5px dashed var(--fac);outline-offset:1px}
.lc.wide{padding:0 8px;font-size:13px}
.lc.cmd{color:#111}.lc.cmd.Black{background:#151515;color:#eee;border-color:#444}.lc.cmd.Orange{background:#e8641e;border-color:#e8641e}.lc.cmd.Green{background:#7ccf3a;border-color:#7ccf3a}
.lc.cmd.rr{box-shadow:0 0 0 2px var(--fac)}
.lc.tap{cursor:pointer;transform:scale(1.08)}
.lc.tg{gap:3px;grid-auto-flow:column;color:var(--text);padding:0 6px}
.lc.tg i{font-style:normal;font-size:10px;color:var(--fac);display:inline-block}
@media (max-width:1100px){.dmenu{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.dmenu{gap:8px}.dbig{min-height:130px;padding:12px 2px}.dbig b{font-size:18px;letter-spacing:.02em}.dbig small{font-size:11px}}
.popt{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px;background:var(--panel2);cursor:pointer}
.popt.ind{margin-left:26px;background:transparent;padding:6px 10px;margin-bottom:5px}
.psub[hidden]{display:none}
.pstyle{margin:0 0 7px 26px;padding:8px 10px;border:1px dashed var(--line2);border-radius:9px;display:flex;flex-direction:column;gap:5px;font-size:14px}
.pstyle b{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pstyle label{display:flex;align-items:center;gap:8px;cursor:pointer}
.pstyle input{accent-color:var(--fac);width:16px;height:16px}
.pstyle small{color:var(--muted)}
.tc.pf{background:#fff;padding:.06in}
.tc.pf .tc-in{background:#fff;box-shadow:none;border:1px solid #c8c8c8;border-radius:.1in}
.tc.pf .tc-top{background:none;color:#151515;border-bottom:1.5px solid var(--fc)}
.tc.pf .tc-pts{background:#fff;color:#151515;border:1.5px solid var(--fc)}
.tc.pf .tc-sub{background:none;color:#555;border-bottom:1px solid #e6e6e6}
.tc.pf .tc-art{border-bottom:1px solid #e6e6e6}
.tc.pf .tc-stats{background:none;color:#151515;border-bottom:1px solid #e6e6e6}
.tc.pf .tc-stats div{border-right:1px solid #efefef}
.tc.pf .tc-stats small{color:#777}
.tc.pf .tc-w th{border-bottom:1px solid #dcdcdc;color:#666}
.tc.pf .tc-w td{border-bottom:1px solid #f1f1f1}
.tc.pf .tc-foot{background:none;color:#888;border-top:1px solid #e6e6e6}
.tc.pf.cmd .tc-when{background:#f5f5f5}
.tc.bw,.tc.cmd.t.bw,.tc.cmd.b.bw{--fc:#6b6b6b!important}
.tc.bw img{filter:grayscale(1)}
.tc.bw .tc-pts,.tc.pf .tc-pts{background:#fff;color:#111}
.tc.bw .tc-pts{border-color:#111}
.tc.bw .tc-more{color:#555}
.popt input{accent-color:var(--fac);width:18px;height:18px;margin-top:2px;flex:none}
.popt small{display:block;color:var(--muted);font-size:12.5px}
.printonly.measuring{display:block!important;position:absolute;left:-30000px;top:0;width:8.1in;visibility:hidden}
.tc{width:2.5in;height:3.5in;box-sizing:border-box;padding:.085in;background:#1b1f25;position:relative;overflow:hidden;font-family:var(--body);color:#1a1a1a;--fs:6.6pt;-webkit-print-color-adjust:exact;print-color-adjust:exact;break-inside:avoid}
.tc-in{height:100%;display:flex;flex-direction:column;border-radius:.09in;background:#f3efe6;overflow:hidden;box-shadow:0 0 0 .025in var(--fc) inset}
.tc-top{display:flex;align-items:center;gap:.04in;background:linear-gradient(90deg,#23282f,#363c45);color:#fff;padding:.035in .05in .03in .08in;border-bottom:.025in solid var(--fc)}
.tc-in{position:relative}
.tc-name{flex:1;font-family:var(--head);font-weight:700;font-size:12.5pt;line-height:1.02;letter-spacing:.02em;text-transform:uppercase}
.tc-pts{flex:none;display:flex;align-items:baseline;gap:.02in;background:var(--fc);color:#111;border-radius:.07in;padding:.015in .06in .01in;font-family:var(--head);font-weight:700;font-size:13pt;line-height:1;border:.015in solid #fff;white-space:nowrap}
.tc-pts small{display:inline;font-size:6.5pt;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.tc-sub{font-size:7.5pt;font-weight:600;color:#333;padding:.025in .09in;background:#e6e0d2;border-bottom:1px solid #cfc6b3;text-align:center}
.tc-art{height:.95in;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:.02in solid var(--fc);flex:none}
.tc-art.short{height:.55in}
.tc-art img{width:100%;height:100%;object-fit:cover;object-position:center}
.tc-art.none span{font-family:var(--head);color:#9aa0a8;font-size:12pt;letter-spacing:.15em;text-transform:uppercase;opacity:.8}
.tc-stats{display:grid;grid-template-columns:repeat(7,1fr);background:#2a2f37;color:#fff;text-align:center;flex:none}
.tc-stats div{padding:.015in 0;border-right:1px solid #444b55}
.tc-stats div:last-child{border-right:0}
.tc-stats small{display:block;font-size:5.8pt;font-weight:700;color:#bfc6cf;letter-spacing:.05em}
.tc-stats b{font-family:var(--head);font-size:11pt;line-height:1.05}
.tc-body{flex:1;min-height:0;overflow:hidden;padding:.04in .07in;font-size:var(--fs);line-height:1.22}
.tc-kw{font-style:italic;text-align:center;font-weight:600;color:#3b3b3b;margin-bottom:.03in}
.tc-w{width:100%;border-collapse:collapse;font-size:var(--fs)}
.tc-w th{font-size:calc(var(--fs) * .82);text-transform:uppercase;letter-spacing:.04em;color:#555;border-bottom:1px solid #b9b09c;text-align:center;padding:0 .015in}
.tc-w th:first-child,.tc-w td:first-child{text-align:left}
.tc-w td{border-bottom:1px solid #ddd5c4;padding:.012in .015in;text-align:center;vertical-align:top}
.tc-w td:last-child{font-style:italic}
.tc-rule{margin:.03in 0 0}
.tc-note{margin:.03in 0 0;font-size:calc(var(--fs) * .85);color:#666;font-style:italic;text-align:center}
.tc-more{font-style:italic;color:#7a5a12}
.tc-cont{font-family:var(--head);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:calc(var(--fs) * 1.1);text-align:center;margin-bottom:.03in}
.tc-foot{flex:none;display:flex;justify-content:space-between;background:#23282f;color:#cfd4db;font-size:6.5pt;padding:.02in .09in;letter-spacing:.06em;text-transform:uppercase;border-top:.02in solid var(--fc)}
.tc.cmd .tc-body{display:flex;flex-direction:column;gap:.05in;padding:.07in .09in;font-size:calc(var(--fs) * 1.1)}
.tc.cmd .tc-when{background:#e6e0d2;border-left:.03in solid var(--fc);padding:.04in .06in;border-radius:.03in}
.tc.cmd .tc-when b{display:block;font-family:var(--head);font-size:8.5pt;letter-spacing:.08em;text-transform:uppercase;color:#555}
.tc.cmd .tc-eff{line-height:1.3}

.tc.cmd.t{--fc:#9aa7b4!important}
.tc.cmd.b{--fc:#c9a227!important}
.tc.cmd .tc-top{padding:.05in .05in .045in .09in}
.tc.cmd .tc-name{font-size:14pt}
.tc.cmd .tc-sub{font-size:7.5pt}
.qr{font-size:7.9pt;line-height:1.28;color:#111}
.qr-head{text-align:center;font-family:var(--head);font-size:15pt;letter-spacing:.05em;text-transform:uppercase;border-bottom:2px solid #111;padding-bottom:3px;margin-bottom:6px}
.qr-head b{font-size:17pt}
.qr-head span{display:block;font-family:var(--body);font-size:7pt;letter-spacing:0;text-transform:none;color:#555}
.qr-cols{columns:3;column-gap:.18in}
.qr section{break-inside:avoid;border:1px solid #bbb;border-radius:4px;padding:3px 6px 4px;margin:0 0 5px}
.qr h4{margin:0 0 2px;font-family:var(--head);font-size:9.5pt;letter-spacing:.06em;text-transform:uppercase;text-align:center;background:#222;color:#fff;border-radius:3px;padding:1px 0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.qr p{margin:2px 0}
.qr ol,.qr ul{margin:2px 0;padding-left:14px}
.qr li{margin:1px 0}
.qr table{width:100%;border-collapse:collapse;margin:2px 0}
.qr td{border-top:1px solid #ddd;padding:1px 3px;vertical-align:top}
.qr td:first-child{font-weight:700;white-space:nowrap;text-align:center;width:1%}
.qr-foot{text-align:center;color:#777;font-size:6.5pt;margin-top:4px}
footer{padding:16px;text-align:center;color:var(--dim);font-size:13px;border-top:1px solid var(--line)}
footer a{color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted)}
.printonly{display:none}
@media (max-width:900px){
  main{grid-template-columns:1fr;padding:12px}
  .app{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
  .tabs{padding-bottom:env(safe-area-inset-bottom)}
  .tabs{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:50;background:#0b0e12;border-top:1px solid var(--line)}
  .tabs button{flex:1;padding:12px 4px;background:transparent;border:0;font-family:var(--head);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .tabs button.on{color:var(--fac);box-shadow:0 -2px 0 var(--fac) inset}
  .col[data-tab]{display:none}
  .col[data-tab].on{display:block}
  .bar{padding:8px 12px;gap:10px;position:static}
  #btnRules,#btnDice{display:none}
  header.top{gap:6px}
  header.top .brand{flex:1 1 100%}
  .listname{flex:1 1 0;min-width:0;font-size:18px;padding:5px 4px;text-overflow:ellipsis}
  header.top .tbtn{flex:none;padding:6px 9px;font-size:13px}
  header.top .tbtn .my{display:none}
}
@media (max-width:370px){
  header.top{padding:8px 8px;gap:5px}
  header.top .tbtn{padding:6px 7px;font-size:12px}
  header.top .tbtn .my{display:none}
  .listname{font-size:16px}
  .toast{bottom:74px}
  .tabs small{display:block;font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:0;color:var(--muted)}
  header.top{padding:8px 12px}
  .brand{font-size:16px}
  .stats{grid-template-columns:repeat(4,1fr)}
  .stats div:nth-child(4){border-right:0}
  .stats div:nth-child(-n+4){border-bottom:1px solid var(--line)}
  .kv{grid-template-columns:repeat(2,1fr)}
}
@media print{
  @page{margin:.2in}
  html,body{height:auto!important;min-height:0!important;overflow:visible!important}
  .app{display:block!important;min-height:0!important;height:auto!important;padding:0!important;margin:0!important}
  body>*:not(.app){display:none!important}
  .printonly{width:auto!important;position:static!important}
  .pr-sec{break-after:auto}
  .qr{width:7.9in;max-width:100%;margin:0 auto;break-inside:avoid;page-break-inside:avoid}
  .qr-cols{column-fill:balance}
  .pr-sec+.pr-sec{break-before:page}
  .tc-page{display:grid;grid-template-columns:repeat(3,2.5in);grid-auto-rows:3.5in;justify-content:center;align-content:start;break-after:page}
  .tc-page:last-child{break-after:auto}
  html,body{background:#fff!important;color:#111;font-size:10px;line-height:1.3}
  .app>*:not(.printonly){display:none!important}
  .printonly{display:block!important}
  .pr{font-family:var(--body);-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pr *{box-sizing:border-box}
  .pr-head{text-align:center;padding-bottom:6px;border-bottom:2px solid #111;margin-bottom:8px}
  .pr-head h1{font-family:var(--head);font-size:24px;letter-spacing:.04em;text-transform:uppercase;margin:0;line-height:1.05}
  .pr-head .fac{font-family:var(--head);font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:#555;margin:1px 0 6px}
  .pr-strip{display:flex;justify-content:center;gap:0;margin:0 auto;width:max-content;border:1px solid #bbb;border-radius:6px;overflow:hidden}
  .pr-strip div{padding:3px 12px;text-align:center;border-right:1px solid #bbb}
  .pr-strip div:last-child{border-right:0}
  .pr-strip small{display:block;font-size:7.5px;letter-spacing:.08em;text-transform:uppercase;color:#666;font-weight:700}
  .pr-strip b{font-family:var(--head);font-size:15px}
  .pr-warn{text-align:center;color:#b3261e;font-weight:700;margin:5px 0 0}
  .pr h2{font-family:var(--head);font-size:14px;letter-spacing:.1em;text-transform:uppercase;text-align:center;margin:10px 0 5px;display:flex;align-items:center;gap:8px}
  .pr h2::before,.pr h2::after{content:"";flex:1;border-top:1px solid #999}
  .pr h3{font-family:var(--head);font-size:12px;letter-spacing:.08em;text-transform:uppercase;text-align:center;margin:6px 0 4px;color:#444}
  .pr table{border-collapse:collapse;width:100%}
  .pr th,.pr td{border:1px solid #c8c8c8;padding:1.5px 4px;text-align:center;vertical-align:middle}
  .pr th{background:#ececec;font-size:7.5px;letter-spacing:.06em;text-transform:uppercase;color:#333}
  .pr-roster{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px;align-items:start}
  .pr-roster table{break-inside:avoid}
  .pr-roster caption{font-family:var(--head);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding-bottom:2px}
  .pr-roster td.n{text-align:left}
  .pr-roster tr.tot td{font-weight:700;background:#f4f4f4}
  .pr-units{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .pu{break-inside:avoid;border:1px solid #999;border-radius:5px;overflow:hidden}
  .pu .t{display:flex;align-items:baseline;justify-content:center;gap:6px;background:#222;color:#fff;padding:3px 6px;text-align:center}
  .pu .t b{font-family:var(--head);font-size:13px;letter-spacing:.03em}
  .pu .t span{font-size:9px;color:#ccc}
  .pu .t em{font-style:normal;font-family:var(--head);font-weight:700;font-size:13px;margin-left:auto}
  .pu .t .x{background:#fff;color:#111;border-radius:3px;padding:0 4px;font-family:var(--head);font-weight:700;font-size:11px}
  .pu table{border:0}
  .pu th,.pu td{border-left:0;border-right:1px solid #ddd}
  .pu th:last-child,.pu td:last-child{border-right:0}
  .pu .kw{display:block;text-align:center;font-style:italic;padding:2px 6px;border:0;border-bottom:1px solid #ddd;background:none;font-size:9.5px;cursor:default}
  .pu td.w{text-align:left}
  .pu .ct{font-size:9px;text-align:center;padding:1px;background:#f4f4f4;border-bottom:1px solid #ddd;color:#333;width:auto;display:block;margin:0}
  .pu .sr{padding:2px 6px 3px;font-size:9px;text-align:left}
  .pu .sr p{margin:1px 0}
  .pr-rules{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
  .pr-box{border:1px solid #bbb;border-radius:5px;padding:4px 8px;break-inside:avoid}
  .pr-box .bt{font-family:var(--head);font-weight:700;font-size:12px;text-align:center;letter-spacing:.04em}
  .pr-box p{margin:2px 0;text-align:left}
  .pr-orders td{text-align:left;font-size:9px}
  .pr-orders td.c{text-align:center;font-family:var(--head);font-weight:700;font-size:12px;white-space:nowrap}
  .pr-orders td.nm{font-weight:700;text-align:center}
  .pr-kw{columns:3;column-gap:12px;font-size:8.8px}
  .pr-kw div{break-inside:avoid;margin:0 0 3px}
  .pr-foot{text-align:center;color:#888;font-size:8px;margin-top:8px}
}
</style>
</head>
<body>

    <a href="https://www.manticgames.com/wp-content/uploads/2025/07/MGEWM101-Epic-Warpath-Rulebook-EN.pdf" target="_blank" rel="noopener">Rulebook PDF</a> · <a href="https://www.manticgames.com/epic-warpath/getting-started/latest-faq-errata/" target="_blank" rel="noopener">FAQ &amp; Errata</a> · <a href="https://companion.manticgames.com/epic-warpath-rules/" target="_blank" rel="noopener">Free online rules</a><br>
    Unofficial fan tool. Epic Warpath and all related content © Mantic Games. Data from the Epic Warpath Rulebook (1st Edition).

  </div>

    <div class="dbody" id="diceBody"></div>
  </aside>

<script>
const DATA = __DATA__;
const RULES_URL = "https://www.manticgames.com/wp-content/uploads/2025/07/MGEWM101-Epic-Warpath-Rulebook-EN.pdf";
const COMPANION_URL = "https://companion.manticgames.com/epic-warpath-rules/";
const ERRATA_URL = "https://www.manticgames.com/epic-warpath/getting-started/latest-faq-errata/";
const FAC_COLORS = {"asterians":"#7fd3e6","enforcers":"#5b9be6","forge-fathers":"#e0913f","gcps":"#9cbc5e","marauders":"#d6ad3c","nameless":"#bb7ddb","plague":"#8fcc48","veer-myn":"#df6a58"};
const CATS = ["HQ","Troop","Specialist","Support","Transport","Super-Heavy"];
const CAT_LABEL = {"HQ":"HQ","Troop":"Troops","Specialist":"Specialists","Support":"Support","Transport":"Transports","Super-Heavy":"Super-Heavy"};
const CAT_VAR = {"HQ":"--hq","Troop":"--troop","Specialist":"--spec","Support":"--sup","Transport":"--trans","Super-Heavy":"--super"};
const NO_TRANSPORT = ["Walker","Vehicle","Super-heavy","Bike"];
const LS_KEY = "ewp_builder_lists_v1";
const LS_CUR = "ewp_builder_current_v1";
const FAC = Object.fromEntries(DATA.factions.map(f => [f.id, f]));
const UNIT = {};
DATA.factions.forEach(f => f.units.forEach(u => { UNIT[f.id + ":" + u.id] = u; }));

let lists = [];
let cur = null;
let activeCompany = 0;
let openCards = new Set();
let pickerQuery = "";
let tab = "list";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uidGen = () => Math.random().toString(36).slice(2, 10);

function store(get, key, val) {
  try {
    if (get) return localStorage.getItem(key);
    localStorage.setItem(key, val);
  } catch (e) { return null; }
}

function newList(fid) {
  return {id: uidGen(), name: (FAC[fid] ? FAC[fid].n : "New") + " Army", faction: fid, limit: 2000,
    companies: [{id: uidGen(), units: []}], strat: {quick: 0, hold: 0, bombard: 0, intel: 0, recon: {Black: 0, Orange: 0, Green: 0}}, updated: Date.now()};
}

function load() {
  try { lists = JSON.parse(store(true, LS_KEY) || "[]"); } catch (e) { lists = []; }
  const hash = location.hash.startsWith("#l=") ? location.hash.slice(3) : null;
  if (hash) {
    const imp = decodeShare(hash);
    if (imp) {
      lists.unshift(imp);
      cur = imp;
      history.replaceState(null, "", location.pathname + location.search);
      save();
      toast("Shared list imported");
      return;
    }
  }
  const cid = store(true, LS_CUR);
  cur = lists.find(l => l.id === cid) || lists[0] || null;
}

function save() {
  if (cur) {
    cur.updated = Date.now();
    if (!lists.includes(cur)) lists.unshift(cur);
    store(false, LS_CUR, cur.id);
  }
  store(false, LS_KEY, JSON.stringify(lists));
}

const fac = () => FAC[cur.faction];
const unitOf = e => UNIT[cur.faction + ":" + e.key];
const isCommand = u => u.t === "Command";
const baseType = u => isCommand(u) ? (u.st || "") : u.t;
const isSuper = u => u.c === "Super-Heavy" || /super/i.test(baseType(u));

function roles(u) {
  const r = [];
  if (isCommand(u)) r.push("HQ");
  if (isSuper(u)) { r.push("Support"); r.push("Super-Heavy"); }
  else if (!isCommand(u)) r.push(u.c);
  return r;
}

function transportEligible(u) {
  if (u.c === "Transport") return false;
  return !NO_TRANSPORT.some(t => baseType(u).toLowerCase() === t.toLowerCase());
}

function counts(units) {
  const c = {HQ: 0, Troop: 0, Specialist: 0, Support: 0, "Super-Heavy": 0, Transport: 0, elig: 0};
  units.forEach(e => {
    const u = typeof e === "string" ? UNIT[cur.faction + ":" + e] : unitOf(e);
    if (!u) return;
    roles(u).forEach(r => c[r]++);
    if (transportEligible(u)) c.elig++;
  });
  return c;
}

function caps(c) {
  return {HQ: 1, Troop: 4, Specialist: c.Troop, Support: Math.floor((c.Troop + c.Specialist) / 2), "Super-Heavy": 1, Transport: c.elig};
}

function uniqueTaken(key) {
  return cur.companies.some(co => co.units.some(e => e.key === key));
}

function whyNot(u, co) {
  if (u.u && uniqueTaken(u.id)) return "Unique [U] – already in your army";
  const before = counts(co.units);
  const after = counts(co.units.concat([{key: u.id}]));
  const cp = caps(after);
  const r = roles(u);
  if (r.includes("HQ") && after.HQ > 1) return "This company already has its HQ";
  if (r.includes("Troop") && after.Troop > 4) return "Max 4 Troops per company";
  if (r.includes("Specialist") && after.Specialist > cp.Specialist) return "Needs another Troop (1 Specialist per Troop)";
  if (r.includes("Super-Heavy") && after["Super-Heavy"] > 1) return "Only 1 Super-heavy per company";
  if (r.includes("Support") && after.Support > cp.Support) {
    const need = after.Support * 2 - (before.Troop + before.Specialist);
    return "Needs " + need + " more Troop/Specialist" + (need > 1 ? "s" : "") + " (1 Support per 2)";
  }
  if (r.includes("Transport") && after.Transport > cp.Transport) return "Needs an Infantry/Heavy Infantry unit to carry";
  return "";
}

function unitPts(e) {
  const u = unitOf(e);
  if (!u) return 0;
  return (u.p || 0) + (e.ct && u.ct ? u.ct.p : 0);
}

function stratPts() {
  const s = cur.strat;
  let p = 0;
  DATA.stratagems.forEach(st => {
    if (st.p && s[st.id]) p += st.p;
    if (st.tiers && s.intel) { const t = st.tiers.find(t => t[0] === s.intel); if (t) p += t[1]; }
    if (st.dice) st.dice.forEach(([c, v]) => { p += (s.recon[c] || 0) * v; });
  });
  return p;
}

const companyPts = co => co.units.reduce((a, e) => a + unitPts(e), 0);
const totalPts = () => cur.companies.reduce((a, co) => a + companyPts(co), 0) + stratPts();

function issues() {
  const out = [];
  const tp = totalPts();
  if (tp > cur.limit) out.push("Over the points limit by " + (tp - cur.limit) + " pts.");
  const uniq = {};
  cur.companies.forEach((co, i) => {
    const n = "Company " + (i + 1);
    const c = counts(co.units);
    const cp = caps(c);
    if (!co.units.length) { out.push(n + " is empty – add 1 HQ and 2 Troops, or remove it."); return; }
    if (c.HQ < 1) out.push(n + " needs an HQ unit.");
    if (c.HQ > 1) out.push(n + " has " + c.HQ + " HQ units (max 1).");
    if (c.Troop < 2) out.push(n + " needs at least 2 Troop units (has " + c.Troop + ").");
    if (c.Troop > 4) out.push(n + " has " + c.Troop + " Troop units (max 4).");
    if (c.Specialist > cp.Specialist) out.push(n + " has more Specialists (" + c.Specialist + ") than Troops (" + c.Troop + ").");
    if (c.Support > cp.Support) out.push(n + " has " + c.Support + " Support slots used but only " + cp.Support + " unlocked (1 per 2 Troops/Specialists).");
    if (c["Super-Heavy"] > 1) out.push(n + " has more than 1 Super-heavy unit.");
    if (c.Transport > cp.Transport) out.push(n + " has more Transports (" + c.Transport + ") than units that can ride in them (" + cp.Transport + ").");
    co.units.forEach(e => { const u = unitOf(e); if (u && u.u) uniq[u.n] = (uniq[u.n] || 0) + 1; });
  });
  Object.entries(uniq).forEach(([n, k]) => { if (k > 1) out.push(n + " is Unique [U] but taken " + k + " times."); });
  return out;
}

function tacticianDice(u) {
  const k = u.k.find(k => k.startsWith("Tactician"));
  if (!k) return [];
  const m = k.match(/\((.*)\)/);
  return m ? m[1].split(",").map(s => s.trim()).filter(Boolean) : [];
}

function totals() {
  let units = 0, us = 0, bases = 0;
  const dice = {Black: 0, Orange: 0, Green: 0};
  cur.companies.forEach(co => co.units.forEach(e => {
    const u = unitOf(e);
    if (!u) return;
    units++;
    us += parseInt(u.us) || 0;
    bases += u.b || 0;
    tacticianDice(u).forEach(d => { if (d in dice) dice[d]++; });
    if (e.ct) units++;
  }));
  Object.keys(cur.strat.recon).forEach(c => {});
  return {units, us, bases, dice};
}

function setFacColor() {
  document.documentElement.style.setProperty("--fac", FAC_COLORS[cur.faction] || "#e0a63a");
}

function render() {
  setFacColor();
  $("#listName").value = cur.name;
  renderBar();
  renderList();
  renderPicker();
  renderInfo();
  document.querySelectorAll(".col[data-tab]").forEach(c => c.classList.toggle("on", c.dataset.tab === tab));
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === tab));
  document.querySelector('#tabs [data-t="list"]').innerHTML = `Army<small>${totalPts()} / ${cur.limit}</small>`;
}

function renderBar() {
  const tp = totalPts();
  const iss = issues();
  const pct = Math.min(100, cur.limit ? tp / cur.limit * 100 : 0);
  const left = cur.limit - tp;
  const opts = DATA.factions.map(f => `<option value="${f.id}" ${f.id === cur.faction ? "selected" : ""}>${esc(f.n)}</option>`).join("");
  const presets = [1000, 1500, 2000, 2500, 3000];
  $("#bar").innerHTML = `
    <div class="field"><label for="selFac">Faction</label><select id="selFac">${opts}</select></div>
    <div class="field"><label for="selLimit">Points</label>
      <select id="selLimit">${presets.map(p => `<option ${p === cur.limit ? "selected" : ""}>${p}</option>`).join("")}<option value="custom" ${presets.includes(cur.limit) ? "" : "selected"}>Custom…</option></select>
      ${presets.includes(cur.limit) ? "" : `<input class="num" id="numLimit" type="number" min="0" step="50" value="${cur.limit}">`}
    </div>
    <div class="pts">
      <div class="ptsline"><span>${tp} / ${cur.limit} pts</span><span class="left">${left >= 0 ? left + " to spend" : (-left) + " over"}</span></div>
      <div class="meter ${tp > cur.limit ? "over" : ""}"><i style="width:${pct}%"></i></div>
    </div>
    <div class="status ${iss.length ? "bad" : "ok"}"><span class="dot"></span>${iss.length ? iss.length + " issue" + (iss.length > 1 ? "s" : "") : "Valid list"}</div>`;
  $("#selFac").onchange = e => changeFaction(e.target.value);
  $("#selLimit").onchange = e => {
    if (e.target.value === "custom") { cur.limit = cur.limit + 1 === 0 ? 0 : cur.limit; renderBarCustom(); return; }
    cur.limit = parseInt(e.target.value); save(); render();
  };
  const nl = $("#numLimit");
  if (nl) nl.onchange = e => { cur.limit = Math.max(0, parseInt(e.target.value) || 0); save(); render(); };
}

function renderBarCustom() {
  const sel = $("#selLimit");
  if (!$("#numLimit")) {
    sel.insertAdjacentHTML("afterend", `<input class="num" id="numLimit" type="number" min="0" step="50" value="${cur.limit}">`);
    const nl = $("#numLimit");
    nl.focus();
    nl.onchange = e => { cur.limit = Math.max(0, parseInt(e.target.value) || 0); save(); render(); };
  }
}

function changeFaction(fid) {
  const has = cur.companies.some(c => c.units.length);
  if (has && !confirm("Switching faction will clear the units in this list. Continue?")) { renderBar(); return; }
  const oldName = FAC[cur.faction].n + " Army";
  cur.faction = fid;
  cur.companies = [{id: uidGen(), units: []}];
  if (cur.name === oldName) cur.name = FAC[fid].n + " Army";
  activeCompany = 0;
  openCards.clear();
  save(); render();
}

function slotChips(co) {
  const c = counts(co.units);
  const cp = caps(c);
  const chip = (cat, n, max, min) => {
    let cls = "";
    if (n > max) cls = "over";
    else if (min && n < min) cls = "need";
    else if (n === max && max > 0) cls = "full";
    return `<span class="slot ${cls}" title="${esc(CAT_LABEL[cat])}"><i class="sw" style="background:var(${CAT_VAR[cat]})"></i>${CAT_LABEL[cat]} <b>${n}/${max}</b>${min && n < min ? ` <small>need ${min}</small>` : ""}</span>`;
  };
  return chip("HQ", c.HQ, 1, 1) + chip("Troop", c.Troop, 4, 2) + chip("Specialist", c.Specialist, cp.Specialist) +
    chip("Support", c.Support, cp.Support) + chip("Super-Heavy", c["Super-Heavy"], 1) + chip("Transport", c.Transport, cp.Transport);
}

function sortKey(u) {
  const r = roles(u);
  if (r.includes("HQ")) return 0;
  if (r.includes("Super-Heavy")) return 4;
  return {"Troop": 1, "Specialist": 2, "Support": 3, "Transport": 5}[u.c] ?? 6;
}

function renderList() {
  const iss = issues();
  let h = "";
  if (iss.length) h += `<div class="issues"><h3>Fix before you play</h3><ul>${iss.map(i => `<li>${esc(i)}</li>`).join("")}</ul></div>`;
  cur.companies.forEach((co, ci) => {
    const units = co.units.map((e, i) => ({e, i, u: unitOf(e)})).filter(x => x.u);
    units.sort((a, b) => sortKey(a.u) - sortKey(b.u) || a.i - b.i);
    h += `<div class="panel company ${ci === activeCompany ? "active" : ""}" data-ci="${ci}">
      <div class="ch" data-act="activate" data-ci="${ci}">
        <h3>Company ${ci + 1}</h3>${ci === activeCompany ? `<span class="tag">Adding here</span>` : ""}
        <span class="cpts">${companyPts(co)} pts</span>
        ${cur.companies.length > 1 ? `<button class="ibtn danger" data-act="delco" data-ci="${ci}" title="Remove company">✕</button>` : ""}
      </div>
      <div class="slots">${slotChips(co)}</div>
      <div class="cbody">`;
    if (!units.length) {
      h += `<div class="empty">Every company needs <b>1 HQ</b> and <b>2 Troops</b>. Each Troop unlocks a Specialist, and every 2 Troops/Specialists unlock a Support slot. ${tab === "list" && window.innerWidth <= 900 ? `<br><br><button class="tbtn primary" data-act="goadd">Add units</button>` : "Pick units from the list on the right."}</div>`;
    }
    let lastGrp = null;
    units.forEach(({e, i, u}) => {
      const g = sortKey(u);
      const gname = ["HQ", "Troops", "Specialists", "Support", "Super-Heavy", "Transports", "Other"][g];
      const gvar = ["--hq", "--troop", "--spec", "--sup", "--super", "--trans", "--dim"][g];
      if (g !== lastGrp) { h += `<div class="grp"><i class="sw" style="background:var(${gvar})"></i>${gname}</div>`; lastGrp = g; }
      const ck = "L" + co.id + e.id;
      h += `<div class="row">
        ${thumbHtml(u, ck)}
        <div class="nm" data-act="toggle" data-ck="${ck}"><b>${esc(u.n)}</b>${u.u ? `<span class="u-badge">U</span>` : ""}${u.e ? `<span class="e-badge" title="Changed by FAQ &amp; Errata v1.2">ERRATA</span>` : ""}
          <span class="sub">${esc(typeLabel(u))} · ${u.b} base${u.b > 1 ? "s" : ""}${e.ct && u.ct ? " · with " + esc(u.ct.name) : ""}</span>
          ${u.ct ? `<label class="ct" onclick="event.stopPropagation()"><input type="checkbox" data-act="ct" data-ci="${ci}" data-i="${i}" ${e.ct ? "checked" : ""}> Command Transport: ${esc(u.ct.name)} (+${u.ct.p})</label>` : ""}
        </div>
        <span class="p">${unitPts(e)}</span>
        <button class="ibtn" data-act="dup" data-ci="${ci}" data-i="${i}" title="Add another">⧉</button>
        ${cur.companies.length > 1 ? `<select class="ibtn" data-act="move" data-ci="${ci}" data-i="${i}" title="Move to company" style="width:auto">${cur.companies.map((_, k) => `<option value="${k}" ${k === ci ? "selected" : ""}>C${k + 1}</option>`).join("")}</select>` : ""}
        <button class="ibtn danger" data-act="del" data-ci="${ci}" data-i="${i}" title="Remove">✕</button>
      </div>`;
      if (openCards.has(ck)) h += unitCard(u);
    });
    h += `</div></div>`;
  });
  h += `<div class="addc"><button class="tbtn" data-act="addco">+ Add Company</button>${cur.companies.some(c => c.units.length) ? `<button class="tbtn" data-act="clear">Clear list</button>` : ""}</div>`;
  $("#colList").innerHTML = h;
}

function thumbHtml(u, ck) {
  if (!u.img) return `<span class="thumb none" data-act="toggle" data-ck="${ck}"></span>`;
  const small = u.img.replace(/-(944x944|500x500)(\.\w+)$/, "-150x150$2");
  return `<img class="thumb" src="${esc(small)}" data-full="${esc(u.img)}" alt="" loading="lazy" data-act="toggle" data-ck="${ck}" onerror="if(this.dataset.full&&this.src!==this.dataset.full){this.src=this.dataset.full}else{this.style.visibility='hidden'}">`;
}

function typeLabel(u) {
  return isCommand(u) ? "Command (" + (u.st || "") + ")" : u.t;
}

function unitCard(u) {
  const s = u.s;
  let h = `<div class="card">${u.img ? `<div class="uimg"><img src="${esc(u.img)}" alt="${esc(u.n)} miniatures" loading="lazy" onerror="this.parentNode.remove()">${u.imgNote ? `<span class="imgnote">${esc(u.imgNote)}</span>` : ""}</div>` : ""}<div class="chd"><b>${esc(u.n)} (${u.b})</b><span>${esc(typeLabel(u))}</span><span style="margin-left:auto">${u.p} pts</span></div>
    <div class="stats">${[["SP", s[0]], ["SH", s[1]], ["AS", s[2]], ["AR", s[3]], ["SV", s[4]], ["HT", u.ht], ["US", u.us], ["Bases", u.b]].map(([k, v]) => `<div><small>${k}</small><strong>${esc(v || "-")}</strong></div>`).join("")}</div>
    <div class="kws">${u.k.length ? u.k.map(k => kwChip(k)).join("") : `<span class="kw none">No keywords</span>`}</div>
    <table class="wp"><tr><th>Weapon</th><th>Range</th><th>ADice</th><th>Keywords</th></tr>`;
  let lastG = null;
  u.w.forEach(([g, n, r, a, k, ch]) => {
    if (g && g !== lastG) h += `<tr class="g"><td colspan="4">${esc(g)}</td></tr>`;
    lastG = g;
    h += `<tr><td>${g ? "• " : ""}${esc(n)}${ch ? `<span class="mode" title="Firing mode: choose one each time the unit fires">MODE</span>` : ""}</td><td class="c">${esc(r === "A" ? "Assault" : r + '"')}</td><td class="c">${esc(a)}</td><td>${k ? k.split(/,\s*(?![^()]*\))/).map(x => kwChip(x.trim(), true)).join(" ") : "-"}</td></tr>`;
  });
  h += `</table>`;
  if (u.r) h += `<div class="rules">${u.r.map(([n, t]) => `<p><b>${esc(n)}:</b> ${esc(t)}</p>`).join("")}</div>`;
  if (u.e) h += `<div class="note"><b>FAQ &amp; Errata v1.2:</b> ${u.e.map(esc).join("; ")}.</div>`;
  h += `</div>`;
  return h;
}

function glossFor(k) {
  const base = k.replace(/\s*[\(\[].*$/, "").trim().toLowerCase();
  const alias = {"apc": "apc", "ap1": "armour penetration", "ap2": "armour penetration", "ap3": "armour penetration", "ap4": "armour penetration",
    "orbital deployment": "orbital (or subterranean) deployment", "quick fix": "quick-fix", "indirect only": "indirect (only)"};
  let key = alias[base] || base;
  if (/^indirect\s*\(only\)/i.test(k)) key = "indirect (only)";
  return DATA.glossary.find(([n]) => n.toLowerCase().replace(/\s*[\(\[].*$/, "") === key.replace(/\s*[\(\[].*$/, "") && (key !== "indirect (only)" || n.toLowerCase().startsWith("indirect (only)")))
    || DATA.glossary.find(([n]) => n.toLowerCase().startsWith(key));
}

function kwChip(k, inline) {
  const g = glossFor(k);
  return `<span class="kw" ${g ? `data-kw="${esc(k)}"` : ""} ${inline ? 'style="padding:0 5px"' : ""}>${esc(k)}</span>`;
}

function usedGlossary() {
  const set = new Map();
  cur.companies.forEach(co => co.units.forEach(e => {
    const u = unitOf(e);
    if (!u) return;
    const all = [...u.k];
    u.w.forEach(w => w[4] && w[4].split(/,\s*(?![^()]*\))/).forEach(x => all.push(x.trim())));
    all.forEach(k => { const g = glossFor(k); if (g) set.set(g[0], g); });
  }));
  return [...set.values()].sort((a, b) => a[0].localeCompare(b[0]));
}

function addUnit(key) {
  const co = cur.companies[activeCompany];
  const u = UNIT[cur.faction + ":" + key];
  if (!u || whyNot(u, co)) return;
  co.units.push({id: uidGen(), key, ct: 0});
  save(); render();
  toast("Added " + u.n + " (" + u.p + " pts)");
}

document.addEventListener("click", e => {
  const kw = e.target.closest("[data-kw]");
  if (kw) { showPop(kw); e.stopPropagation(); return; }
  hidePop();
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const a = t.dataset.act;
  const ci = +t.dataset.ci, i = +t.dataset.i;
  if (a === "add") addUnit(t.dataset.key);
  else if (a === "toggle") { const k = t.dataset.ck; openCards.has(k) ? openCards.delete(k) : openCards.add(k); render(); }
  else if (a === "activate") { if (e.target.closest("button")) return; activeCompany = ci; render(); }
  else if (a === "delco") {
    if (cur.companies[ci].units.length && !confirm("Remove Company " + (ci + 1) + " and its units?")) return;
    cur.companies.splice(ci, 1); activeCompany = Math.min(activeCompany, cur.companies.length - 1); save(); render();
  }
  else if (a === "addco") { cur.companies.push({id: uidGen(), units: []}); activeCompany = cur.companies.length - 1; save(); render(); }
  else if (a === "clear") { if (confirm("Remove every unit from this list?")) { cur.companies = [{id: uidGen(), units: []}]; activeCompany = 0; save(); render(); } }
  else if (a === "del") { cur.companies[ci].units.splice(i, 1); save(); render(); }
  else if (a === "dup") {
    const e2 = cur.companies[ci].units[i];
    const u = unitOf(e2);
    const why = whyNot(u, cur.companies[ci]);
    if (why) { toast("Can't add another: " + why); return; }
    cur.companies[ci].units.push({id: uidGen(), key: e2.key, ct: e2.ct}); save(); render();
  }
  else if (a === "goadd") { tab = "add"; render(); window.scrollTo(0, 0); }
  else if (a === "recon") { const c = t.dataset.c; cur.strat.recon[c] = Math.max(0, (cur.strat.recon[c] || 0) + +t.dataset.d); save(); render(); }
});

document.addEventListener("change", e => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const a = t.dataset.act;
  if (a === "ct") { cur.companies[+t.dataset.ci].units[+t.dataset.i].ct = t.checked ? 1 : 0; save(); render(); }
  else if (a === "move") {
    const from = +t.dataset.ci, to = +t.value;
    const [x] = cur.companies[from].units.splice(+t.dataset.i, 1);
    cur.companies[to].units.push(x); save(); render();
  }
  else if (a === "strat") { cur.strat[t.dataset.id] = t.checked ? 1 : 0; save(); render(); }
  else if (a === "intel") { cur.strat.intel = +t.value; save(); render(); }
});

let popEl = null;
function showPop(el) {
  hidePop();
  const g = glossFor(el.dataset.kw);
  if (!g) return;
  popEl = document.createElement("div");
  popEl.className = "pop";
  popEl.innerHTML = `<b>${esc(g[0])}</b>${esc(g[1])}`;
  document.body.appendChild(popEl);
  const r = el.getBoundingClientRect();
  const w = Math.min(340, window.innerWidth - 24);
  popEl.style.width = w + "px";
  let left = Math.min(Math.max(12, r.left), window.innerWidth - w - 12);
  let top = r.bottom + 6;
  if (top + popEl.offsetHeight > window.innerHeight - 10) top = Math.max(10, r.top - popEl.offsetHeight - 6);
  popEl.style.left = left + "px";
  popEl.style.top = top + "px";
}
function hidePop() { if (popEl) { popEl.remove(); popEl = null; } }
window.addEventListener("scroll", hidePop, {passive: true});

function toast(msg) {
  document.querySelectorAll(".toast").forEach(x => x.remove());
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1800);
}

  o.addEventListener("click", e => { if (e.target === o || e.target.closest("[data-close]")) o.remove(); });
  document.body.appendChild(o);
  if (after) after(o);
  return o;
}

    o.querySelectorAll("[data-open]").forEach(b => b.onclick = () => { cur = lists.find(l => l.id === b.dataset.open); activeCompany = 0; openCards.clear(); save(); render(); o.remove(); });
    o.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => { const src = lists.find(l => l.id === b.dataset.copy); const c = JSON.parse(JSON.stringify(src)); c.id = uidGen(); c.name += " (copy)"; lists.unshift(c); save(); refresh(); });
    o.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => {

      save(); render(); refresh();
    });
    o.querySelector("[data-import]").onclick = () => {
      const inp = document.createElement("input");
      inp.type = "file"; inp.accept = ".json,application/json";

          try {

          } catch (err) { alert("That file isn't a valid army list."); }
        };
        fr.readAsText(inp.files[0]);
      };
      inp.click();
    };
  };
  const refresh = () => { o.querySelector(".mbody").innerHTML = body(); wire(); };
  wire();
}

function listPts(l) {
  const keep = cur;
  cur = l;
  const p = totalPts();
  cur = keep;
  return p;
}

function sanitize(l) {
  if (!l || !FAC[l.faction] || !Array.isArray(l.companies)) return null;
  const n = newList(l.faction);
  n.name = String(l.name || n.name).slice(0, 80);
  n.limit = Math.max(0, parseInt(l.limit) || 2000);
  n.companies = l.companies.map(c => ({id: uidGen(), units: (c.units || []).filter(e => UNIT[l.faction + ":" + e.key]).map(e => ({id: uidGen(), key: e.key, ct: e.ct ? 1 : 0}))}));
  if (!n.companies.length) n.companies = [{id: uidGen(), units: []}];
  if (l.strat) {
    n.strat.quick = l.strat.quick ? 1 : 0; n.strat.hold = l.strat.hold ? 1 : 0; n.strat.bombard = l.strat.bombard ? 1 : 0;
    n.strat.intel = [0, 1, 2, 3].includes(+l.strat.intel) ? +l.strat.intel : 0;
    ["Black", "Orange", "Green"].forEach(c => n.strat.recon[c] = Math.max(0, parseInt(l.strat.recon && l.strat.recon[c]) || 0));
  }
  return n;
}

function textExport() {
  const f = fac();
  const t = totals();
  const L = [];
  L.push(cur.name);
  L.push(f.n + " · " + totalPts() + " / " + cur.limit + " pts · Nerve " + f.nerve + " · " + t.units + " units · US " + t.us);
  const iss = issues();
  if (iss.length) L.push("INVALID: " + iss.join(" "));
  cur.companies.forEach((co, ci) => {
    L.push("");
    L.push("== Company " + (ci + 1) + " (" + companyPts(co) + " pts) ==");
    co.units.map(e => ({e, u: unitOf(e)})).filter(x => x.u).sort((a, b) => sortKey(a.u) - sortKey(b.u)).forEach(({e, u}) => {
      L.push("- " + u.n + " (" + u.b + ") [" + u.c + "] " + u.p + " pts" + (e.ct && u.ct ? " + " + u.ct.name + " Command Transport (" + u.ct.p + ")" : ""));
    });
  });
  const s = cur.strat;
  const st = [];
  if (s.quick) st.push("Quick Thinking (5)");
  if (s.hold) st.push("Take and Hold (20)");
  if (s.bombard) st.push("Bombardment Fire (30)");
  if (s.intel) st.push("Covert Intel x" + s.intel);
  const rc = Object.entries(s.recon).filter(([, n]) => n).map(([c, n]) => n + " " + c);
  if (rc.length) st.push("Advanced Recon: " + rc.join(", "));
  if (st.length) { L.push(""); L.push("Stratagems: " + st.join(", ") + " (" + stratPts() + " pts)"); }
  const dz = Object.entries(t.dice).filter(([, n]) => n).map(([c, n]) => n + " " + c);
  if (dz.length) L.push("Tactician dice: " + dz.join(", "));
  return L.join("\n");
}

function openExport() {
  const txt = textExport();

    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="tbtn primary" data-copytxt>Copy text</button><button class="tbtn" data-json>Download .json</button><button class="tbtn" data-print>Print / PDF</button></div>`, o => {

function copy(txt, msg) {
  const done = () => toast(msg);
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, () => fallbackCopy(txt, done));
  else fallbackCopy(txt, done);
}
function fallbackCopy(txt, done) {
  const ta = document.createElement("textarea");
  ta.value = txt; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch (e) {}
  ta.remove();
}

function encodeShare(l) {
  const o = {f: l.faction, n: l.name, l: l.limit, c: l.companies.map(c => c.units.map(e => e.ct ? [e.key, 1] : e.key)), s: l.strat};
  const bytes = new TextEncoder().encode(JSON.stringify(o));
  let bin = "";
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function decodeShare(s) {
  try {
    const bin = atob(s.replace(/-/g, "+").replace(/_/g, "/"));
    const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    const o = JSON.parse(new TextDecoder().decode(bytes));
    return sanitize({faction: o.f, name: o.n, limit: o.l, companies: (o.c || []).map(c => ({units: c.map(x => Array.isArray(x) ? {key: x[0], ct: x[1]} : {key: x})})), strat: o.s});
  } catch (e) { return null; }
}

function openShare() {
  const url = location.origin + location.pathname + "#l=" + encodeShare(cur);

function cardFrame(inner, cls) { return `<div class="tc ${cls || ""} ${cardMode}" style="--fc:${FAC_COLORS[cur.faction] || "#e0a63a"}"><div class="tc-in">${inner}</div></div>`; }

function unitCardHtml(u, e, n, part) {
  const f = fac();
  const head = `<div class="tc-top"><span class="tc-name">${esc(u.n)}</span><span class="tc-pts">${unitPts(e)}<small>pts</small></span></div>
    <div class="tc-sub">${esc(typeLabel(u))} · ${u.b} base${u.b > 1 ? "s" : ""} · ${esc(roles(u).includes("HQ") ? "HQ" : u.c)}${u.u ? " · Unique" : ""}${n > 1 ? ` · ×${n}` : ""}</div>`;
  if (part === 2) {
    return cardFrame(head + `<div class="tc-body"><div class="tc-cont">Special Rules (continued)</div>${(u.r || []).map(([rn, x]) => `<p class="tc-rule"><b>${esc(rn)}:</b> ${esc(x)}</p>`).join("")}</div><div class="tc-foot"><span>${esc(f.n)}</span><span>2/2</span></div>`, "unit");

  const ct = e.ct && u.ct ? `<p class="tc-rule"><b>Command Transport:</b> ${esc(u.ct.name)} (+${u.ct.p} pts)</p>` : "";

  return cardFrame(head + art + stats + `<div class="tc-body">${kw}${wt}${ct}${rules}${u.w.some(w => w[5]) ? `<p class="tc-note">* firing mode – pick one each time it fires</p>` : ""}</div><div class="tc-foot"><span>${esc(f.n)}</span><span>Nerve ${esc(f.nerve)}${part === 1 ? " · 1/2" : ""}</span></div>`, "unit");

function orderCardHtml(kind, o) {
  const f = fac();
  const sub = kind === "s" ? `Strategic Order · ${esc(f.n)}` : kind === "t" ? `Tactical Order · All armies${o.sub ? " · " + esc(o.sub) : ""}` : `Battlefield Stratagem · single use`;
  const note = kind === "s" ? "Must be within Command Radius of a friendly Command Unit. One Strategic Order per activation." : kind === "t" ? "Any friendly Unit In Play." : "";
  return cardFrame(`<div class="tc-top"><span class="tc-name">${esc(o.n)}</span><span class="tc-pts cp">${esc(o.c)}<small>${kind === "b" ? "pts" : "CP"}</small></span></div>

    <div class="tc-foot"><span>${kind === "t" ? "Epic Warpath" : esc(f.n)}</span><span>${kind === "b" ? "Battlefield Stratagem" : kind === "t" ? "Tactical" : "Strategic"}</span></div>`, "cmd " + kind);

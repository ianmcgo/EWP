function stratCards() {
  const st = cur.strat, out = [];
  DATA.stratagems.forEach(x => {
    if (x.p && st[x.id]) out.push({n: x.n, c: String(x.p), e: x.d});
    if (x.tiers && st.intel) { const tr = x.tiers.find(q => q[0] === st.intel); out.push({n: x.n, c: String(tr[1]), e: `${st.intel} intel chance${st.intel > 1 ? "s" : ""}. ` + x.d}); }
    if (x.dice) { const parts = x.dice.filter(([c]) => st.recon[c]); if (parts.length) out.push({n: x.n, c: String(parts.reduce((a, [c, v]) => a + st.recon[c] * v, 0)), e: parts.map(([c]) => st.recon[c] + " " + c).join(", ") + " Command Dice. " + x.d}); }
  });
  return out;
}

function unitCardList(perUnit) {
  const items = [];
  const seen = new Map();
  cur.companies.forEach(co => co.units.forEach(e => {
    const u = unitOf(e);
    if (!u) return;
    if (perUnit) { items.push({u, e, n: 1}); return; }
    const k = u.id + (e.ct ? "+ct" : "");
    if (seen.has(k)) seen.get(k).n++; else { const it = {u, e, n: 1}; seen.set(k, it); items.push(it); }
  }));
  items.sort((a, b) => sortKey(a.u) - sortKey(b.u));
  return items;
}

function pages(cards) {
  let h = "";
  for (let i = 0; i < cards.length; i += 9) h += `<div class="tc-page">${cards.slice(i, i + 9).join("")}</div>`;
  return h;
}

function quickRefHtml() {
  return `<div class="qr"><div class="qr-head"><b>EPIC WARPATH</b> Quick Rules Reference <span>Rules v1.1 + FAQ &amp; Errata v1.2</span></div><div class="qr-cols">
  <section><h4>Round Sequence</h4><ol><li><b>Command Phase</b></li><li><b>Movement Phase</b></li><li><b>Overwatch Phase</b></li><li><b>Combat Phase</b></li><li><b>End Phase</b></li></ol><p>In every Phase, players alternate activating Units. The Initiative player chooses who goes first in each Phase and the order of simultaneous rules.</p></section>
  <section><h4>1. Command Phase</h4><ol><li><b>Roll Command Points:</b> 3 Black + Tactician dice of Units In Play. Re-roll one die per Command Unit In Play. Swords = CP; unspent CP are lost at the end of the Round.</li><li><b>Mandatory Tokens</b> (face up): Engaged Units get a Combat Token. Unengaged Pinned Units get an Advance Token (Pinned and Engaged: none). Unpinned, unengaged Command Units get Sprint + Overwatch.</li><li><b>Hidden Tokens:</b> all other Units (and Reserves arriving) get one token face down. Transported Units share their transport's token.</li><li><b>Initiative:</b> both roll D8. Round 1 re-roll ties; later ties go to the player who didn't have it last Round.</li><li><b>Reveal</b> tokens. Forgotten Units get a Combat Token.</li></ol></section>
  <section><h4>Action Tokens</h4><table><tr><td>Advance</td><td>Move up to the first SP value, then swap for a Combat Token (may shoot in the Combat Phase).</td></tr><tr><td>Sprint</td><td>Move up to the second SP value – the only way to engage in Assault. If it engages: swap for a Combat Token (Combat (-1) if Hindered by terrain/buildings). If not: remove the token.</td></tr><tr><td>Overwatch</td><td>Shoot in the Overwatch Phase, or fire at a Unit that Assaults it. Needed for Indirect Blast fire.</td></tr><tr><td>Combat</td><td>Activate in the Combat Phase to shoot, or to trigger an Assault the Unit is engaged in.</td></tr></table></section>
  <section><h4>Tactical Orders (any Unit)</h4><table><tr><td>1 CP</td><td><b>Keep Going!</b> After a Unit completes its action: activate another Unit. Not on the first activation of a Phase; once before your opponent's next turn.</td></tr><tr><td>1 CP</td><td><b>Fight On!</b> After rolling to hit or damage: re-roll up to 2 failed dice, once per roll per target.</td></tr><tr><td>1+ CP</td><td><b>Courage!</b> End Phase, before Pin rolls: remove 1 Pin marker per CP.</td></tr></table><p>Strategic Orders: Unit must be within Command Radius of a Command Unit; one per activation; declare before rolling.</p></section>
  <section><h4>2. Movement Phase</h4><p>Spend Advance/Sprint tokens. Must Sprint to engage in Assault. After moving, swap the token for a Combat Token as appropriate. Overwatch Units may fire at Units assaulting them.</p><p><b>Coherency:</b> each Base within 1" of another Base of the Unit (unbroken chain) and within 6" of all of them.</p><p><b>Interpenetration:</b> can't come within 1" of enemies unless assaulting them. May move through unengaged friendly Units, ending 1" away.</p></section>
  <section><h4>3. Overwatch Phase – Shooting</h4><ol><li>Nominate a target (Command Units only if the closest viable target, unless Super-heavy). No shooting into or out of Assaults.</li><li>Check range &amp; LOS per Base; In Cover?</li><li>Dice = eligible firing Bases × ADice.</li><li>Roll to hit vs <b>SH</b>.</li><li>Roll to damage vs target <b>AR</b> (+AP).</li><li>Saves (SV), then remove 1 Base per damage.</li></ol><table><tr><td>-1</td><td>Target In Cover</td></tr><tr><td>-2</td><td>Target has Fly (-1 vs Super-heavy)</td></tr><tr><td>-1</td><td>Target is Stealthy</td></tr><tr><td>-1</td><td>Shooter has a Pin marker</td></tr></table></section>
  <section><h4>Blast Weapons</h4><ol><li>Place first template.</li><li>Indirect: roll Targeting Die for scatter.</li><li>Extra templates (Blast n) placed with the Targeting Die.</li><li>To hit: SH, or 5+ Indirect (Indirect ignores cover unless the target is in a building).</li><li>Damage, then remove casualties.</li></ol><p>Targeting Die: 3 On Target faces; 3, 3, 4, 5, 6" scatter in the arrow's direction.</p></section>
  <section><h4>4. Combat Phase – Assault</h4><p>Spend Combat Tokens to shoot or resolve an Assault. All engaged Units fight; Bases in contact and friends within 1" of them attack. All attacks are simultaneous.</p><ol><li>Allocate attacks, roll to hit vs <b>AS</b>, damage vs <b>AR</b>.</li><li>Remove casualties.</li><li>Winner killed most Bases. Loser takes a Nerve test per Base of difference; lose one more Base per fail.</li><li>Tidy up: separate from Vehicles/Super-heavies; still in contact: pile in; otherwise consolidate 3" (winner may pile in). Remove Combat Tokens.</li></ol><table><tr><td>-1</td><td>Combat (-1) token</td></tr><tr><td>-1</td><td>Pin marker</td></tr><tr><td>-1</td><td>Arrived from Reserve this Round</td></tr><tr><td>-1</td><td>Disembarked into Assault this Round</td></tr><tr><td>+1</td><td>Infantry/Heavy Infantry vs APCs (+AP1)</td></tr></table></section>
  <section><h4>Pinning</h4><p>Pinned: -1 to hit (shooting and assault); US 2+ counts as 1. Gain a Pin marker when a Unit:</p><ul><li>loses half or more of its Bases to one shooting attack;</li><li>loses an Assault;</li><li>is hit by a Pinning weapon (even with no casualties);</li><li>survives a destroyed transport.</li></ul></section>
  <section><h4>5. End Phase</h4><ol><li>Trigger End Phase rules (flip Dynamic Objectives).</li><li>Roll to remove Pin markers.</li><li>Check victory conditions / score VPs.</li><li>Remove other markers and tokens.</li></ol></section>
  <section><h4>Dice &amp; Key Keywords</h4><p><b>Exploding 8s</b> (Sustained Attack to hit, Vicious to damage): each natural 8 that succeeds rolls a bonus die.</p><p><b>Heavy Armour:</b> weapons without AP halve their damage dice (round up). <b>APn:</b> +n to damage rolls. <b>Stealthy:</b> -1 to be shot. <b>Unflinching:</b> never Pinned. <b>Resilience (n):</b> n shield tokens that negate damage.</p></section>
  <section><h4>Objectives &amp; Game End</h4><p>Claim: a Base within 3"; highest total US within 3" claims it (ties: nobody). A Unit claims only one Objective. Pinned US 2+ counts as 1. Transported Units and Fliers can't claim. In a building, US counts double.</p><p>Play 5 Rounds; then D8: 5+ plays Round 6. VP tie: highest US In Play wins.</p></section>
  </div><div class="qr-foot">Unofficial summary for quick reference – see the Epic Warpath Rulebook for full rules. Epic Warpath © Mantic Games.</div></div>`;
}

function fitCards(root) {
  root.querySelectorAll(".tc").forEach(card => {
    const nm = card.querySelector(".tc-name");
    if (nm) { let ns = parseFloat(getComputedStyle(nm).fontSize); const lh = () => parseFloat(getComputedStyle(nm).lineHeight) || ns * 1.05; while (nm.scrollHeight > lh() * 2.2 && ns > 8) { ns -= 0.5; nm.style.fontSize = ns + "px"; } }
    const body = card.querySelector(".tc-body");
    if (!body) return;
    const fits = () => body.scrollHeight <= body.clientHeight + 1;
    const tryRange = (hi, lo) => { for (let fs = hi; fs >= lo; fs -= 0.25) { card.style.setProperty("--fs", fs + "pt"); if (fits()) return true; } return false; };
    const art = card.querySelector(".tc-art");
    if (card.classList.contains("cmd")) { if (tryRange(11, 4.75)) return; card.classList.add("overflow"); return; }
    if (tryRange(11, 7)) return;
    if (art) { art.classList.add("short"); if (tryRange(9, 6)) return; art.remove(); }
    if (tryRange(9, 5.5)) return;
    card.classList.add("overflow");
  });
}

function buildPrint(o) {
  cardMode = (o.cardStyle === "pf" ? "pf" : "") + (o.bw ? " bw" : "");
  const parts = [];
  if (o.roster && (o.rHead || o.rRoster || o.rProfiles || o.rRules || o.rOrders || o.rKeywords || o.tactical)) parts.push(`<div class="pr-sec">${rosterHtml(o)}</div>`);
  if (o.units) {
    const cards = [];
    unitCardList(o.perUnit).forEach(({u, e, n}) => cards.push({u, e, n}));
    parts.push(`<div class="pr-sec cards" data-kind="units">${pages(cards.map(({u, e, n}) => unitCardHtml(u, e, n, 0)))}</div>`);
  }
  if (o.cmds) {
    const cards = fac().orders.map(([n, c, w, e]) => orderCardHtml("s", {n, c, w, e}));
    if (o.tactical) TACTICAL.forEach(t => cards.push(orderCardHtml("t", t)));
    stratCards().forEach(sc => cards.push(orderCardHtml("b", sc)));
    parts.push(`<div class="pr-sec cards">${pages(cards)}</div>`);
  }
  if (o.ref) parts.push(`<div class="pr-sec">${quickRefHtml()}</div>`);
  return parts;
}

async function runPrint(o) {
  const area = $("#printArea");
  area.innerHTML = buildPrint(o).join("");
  area.classList.add("measuring");
  fitCards(area);
  if (o.units) {
    const unitSec = area.querySelector('.pr-sec[data-kind="units"]');
    const items = unitCardList(o.perUnit);
    const cards = [...unitSec.querySelectorAll(".tc")];
    if (cards.some(c => c.classList.contains("overflow"))) {
      const html = [];
      items.forEach(({u, e, n}, i) => {
        if (cards[i] && cards[i].classList.contains("overflow") && u.r) { html.push(unitCardHtml(u, e, n, 1)); html.push(unitCardHtml(u, e, n, 2)); }
        else html.push(cards[i] ? cards[i].outerHTML : unitCardHtml(u, e, n, 0));
      });
      unitSec.innerHTML = pages(html);
      fitCards(unitSec);
    }
  }
  area.querySelectorAll(".qr").forEach(q => {
    q.style.width = "7.9in";
    const maxH = 10.15 * 96;
    let fs = 8.4;
    q.style.fontSize = fs + "pt";
    while (q.getBoundingClientRect().height > maxH && fs > 6) { fs -= 0.15; q.style.fontSize = fs + "pt"; }
    q.style.width = "";
  });
  area.classList.remove("measuring");
  const imgs = [...area.querySelectorAll("img")];
  await Promise.race([Promise.all(imgs.map(im => im.complete ? 1 : new Promise(r => { im.onload = im.onerror = r; }))), new Promise(r => setTimeout(r, 4000))]);
  window.print();
}

function rosterHtml(opts) {
  const f = fac();
  const t = totals();

  const iss = issues();
  const entries = co => co.units.map(e => ({e, u: unitOf(e)})).filter(x => x.u).sort((a, b) => sortKey(a.u) - sortKey(b.u));
  let h = `<div class="pr"><!--S:head--><div class="pr-head"><h1>${esc(cur.name)}</h1><div class="fac">${esc(f.n)}</div>

      <div><small>Units</small><b>${t.units}</b></div>
      <div><small>Unit Strength</small><b>${t.us}</b></div>
      <div><small>Army Nerve</small><b>${esc(f.nerve)}</b></div>
      <div><small>Command Dice</small><b>${["Black", "Orange", "Green"].filter(c => pool[c]).map(c => pool[c] + " " + c).join(" · ")}</b></div>
    </div>${iss.length ? `<div class="pr-warn">List not valid: ${esc(iss.join(" "))}</div>` : ""}</div>`;
  h += `<!--S:roster--><h2>Roster</h2><div class="pr-roster">`;
  cur.companies.forEach((co, ci) => {
    h += `<table><caption>Company ${ci + 1}</caption><tr><th>Unit</th><th>Slot</th><th>Bases</th><th>Pts</th></tr>`;
    entries(co).forEach(({e, u}) => {
      h += `<tr><td class="n">${esc(u.n)}${u.u ? " [U]" : ""}${e.ct && u.ct ? `<br><small>+ ${esc(u.ct.name)} (Command Transport)</small>` : ""}</td><td>${esc(roles(u).includes("HQ") ? "HQ" : u.c)}</td><td>${u.b}</td><td>${unitPts(e)}</td></tr>`;
    });
    h += `<tr class="tot"><td class="n" colspan="3">Company total</td><td>${companyPts(co)}</td></tr></table>`;
  });
  const sp = stratPts();
  if (sp) {
    const st = cur.strat, rows = [];
    DATA.stratagems.forEach(x => {
      if (x.p && st[x.id]) rows.push([x.n, x.p]);

  }
  h += `</div>`;
  h += `<!--S:profiles--><h2>Unit Profiles</h2>`;

  });
  h += `</div>`;
  if ([...seen.values()].some(({u}) => u.w.some(w => w[5]))) h += `<div class="pr-foot" style="margin-top:3px">* Firing mode – choose one each time the unit fires.</div>`;
  h += `<!--S:rules--><h2>Army Rules</h2><div class="pr-rules">${f.rules.map(([n, x]) => `<div class="pr-box"><div class="bt">Army Special Rule – ${esc(n)}</div><p>${esc(x)}</p></div>`).join("")}<div class="pr-box"><div class="bt">Command Pool</div><p>Each Round roll ${pool.Black} Black${pool.Orange ? ", " + pool.Orange + " Orange" : ""}${pool.Green ? ", " + pool.Green + " Green" : ""} Command Dice. Re-roll one die per Command Unit In Play. Army Nerve ${esc(f.nerve)}.</p></div></div>`;
  h += `<!--S:orders--><h3>Strategic Orders</h3><table class="pr-orders"><tr><th>Order</th><th>CP</th><th>When</th><th>Effect</th></tr>${f.orders.map(([n, c, w, e]) => `<tr><td class="nm">${esc(n)}</td><td class="c">${esc(c)}</td><td>${esc(w)}</td><td>${esc(e)}</td></tr>`).join("")}</table>`;
  if (opts && opts.tactical) h += `<!--S:tactical--><h3>Tactical Orders (any friendly Unit In Play)</h3><table class="pr-orders"><tr><th>Order</th><th>CP</th><th>When</th><th>Effect</th></tr>${TACTICAL.map(o => `<tr><td class="nm">${esc(o.n)}</td><td class="c">${esc(o.c)}</td><td>${esc(o.w)}</td><td>${esc(o.e)}</td></tr>`).join("")}</table>`;
  h += `<!--S:keywords--><h2>Keywords Used</h2><div class="pr-kw">${usedGlossary().map(([n, x]) => `<div><b>${esc(n)}:</b> ${esc(x)}</div>`).join("")}</div>`;
  h += `<!--S:foot--><div class="pr-foot">Full rules: Epic Warpath Rulebook PDF ${RULES_URL} · Free online rules ${COMPANION_URL}</div>`;
  h += `<div class="pr-foot">Epic Warpath Army Builder · Created by Ian McGonigal · Rules © Mantic Games, FAQ &amp; Errata v1.2 applied</div></div>`;
  const on = {head: opts.rHead, roster: opts.rRoster, profiles: opts.rProfiles, rules: opts.rRules, orders: opts.rOrders, tactical: opts.tactical, keywords: opts.rKeywords, foot: 1};
  const parts = h.split(/<!--S:(\w+)-->/);
  let out = parts[0];
  for (let i = 1; i < parts.length; i += 2) if (on[parts[i]]) out += parts[i + 1];
  if (!on.rules) out = out.replace(/<h3>(Strategic Orders|Tactical Orders[^<]*)<\/h3>/, "<h2>$1</h2>");
  return out;
}

let dice = {n: 6, need: 5, explode: false, last: null, cmd: {Black: 3, Orange: 0, Green: 0}, rolled: [], rerolls: 0, spent: 0, tgt: null, faces: JSON.parse(JSON.stringify(DEFAULT_FACES))};
try { const sd = JSON.parse(store(true, "ewp_dice_v2") || "null"); if (sd) dice = Object.assign(dice, sd, {last: null, rolled: [], tgt: null, explode: false}); } catch (e) {}

const d = n => 1 + Math.floor(crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296 * n);

function openDice() { renderDice(); $("#drawer").classList.add("open"); }

function armyDice() {
  const t = cur ? totals() : {dice: {Black: 0, Orange: 0, Green: 0}};
  const cmdUnits = cur ? cur.companies.reduce((a, co) => a + co.units.filter(e => unitOf(e) && isCommand(unitOf(e))).length, 0) : 0;
  return {Black: 3 + t.dice.Black, Orange: t.dice.Orange, Green: t.dice.Green, cmdUnits};
}

function rollD8() {
  const base = [];
  for (let i = 0; i < dice.n; i++) base.push(d(8));
  const bonus = [];
  if (dice.explode) {
    let pending = base.filter(v => v === 8 && v >= dice.need).length;
    let guard = 0;
    while (pending && guard++ < 200) {
      const r = d(8);
      bonus.push(r);
      pending--;
      if (r === 8) pending++;
    }
  }
  dice.last = {base, bonus, need: dice.need, explode: dice.explode};
}

function rerollFails() {
  if (!dice.last) return [];
  const fresh = [];
  dice.last.base = dice.last.base.map(v => { if (v >= dice.last.need) return v; const r = d(8); fresh.push(r); return r; });
  const bonus = [];
  if (dice.last.explode) {
    let pending = dice.last.base.filter(v => v === 8).length;
    let guard = 0;
    while (pending && guard++ < 200) { const r = d(8); bonus.push(r); pending--; if (r === 8) pending++; }
  }
  dice.last.bonus = bonus;
  return fresh;
}

function cmdRoll(c) { const i = d(6) - 1; return {i, v: dice.faces[c][i]}; }

function rollTgt() {
  const f = d(8), rot = d(179) * (d(2) === 1 ? 1 : -1), spin = (rot >= 0 ? 1 : -1) * (360 + d(180));
  dice.tgt = f <= 3 ? {hit: 1, n: Date.now(), rot: rot} : {hit: 0, dist: [3, 3, 4, 5, 6][f - 4], rot: rot, spin: spin, n: Date.now()};
}

function rollCmd() {
  dice.rolled = [];
  ["Black", "Orange", "Green"].forEach(c => { for (let i = 0; i < (dice.cmd[c] || 0); i++) dice.rolled.push(Object.assign({c, rr: 0}, cmdRoll(c))); });
  dice.rerolls = armyDice().cmdUnits;
}

function rollScenario() {
  const v = [d(8), d(8), d(8), d(8)];
  scn = {v, t: Date.now(), corners: d(2) === 1 ? "top-left & bottom-right" : "top-right & bottom-left", edge: ["North (top)", "East (right)", "South (bottom)", "West (left)"][d(4) - 1], r6: null, recon: null};

}

function scnExtra(i) {

  if (i === 0 && k === 2) return `Random roll: the deployment corners are <b>${scn.corners}</b> (as seen from your side of the table).`;

}

function rollR6() { scn.r6 = d(8); saveScn(); }
function rollRecon() {
  const a = armyDice(), list = [];
  ["Black", "Orange", "Green"].forEach(c => { for (let i = 0; i < a[c]; i++) list.push(Object.assign({c}, cmdRoll(c))); });

let dlog = [];
try { dlog = JSON.parse(store(true, "ewp_dice_log_v1") || "[]"); } catch (e) { dlog = []; }
const saveLog = () => store(false, "ewp_dice_log_v1", JSON.stringify(dlog.slice(0, 60)));
let dview = "menu";

function logEntry(kind) {
  const e = {id: uidGen(), t: Date.now(), kind};
  if (kind === "d8" || kind === "refail") {
    const L = dice.last;
    const hits = L.base.filter(v => v >= L.need).length + L.bonus.filter(v => v >= L.need).length;
    e.title = (kind === "refail" ? "Re-rolled misses · " : "") + L.base.length + "D8 · need " + L.need + "+";
    e.total = hits + " success" + (hits === 1 ? "" : "es");
    e.chips = [...L.base].sort((a, b) => b - a).map(v => ({v, hit: v >= L.need ? 1 : 0})).concat(L.bonus.map(v => ({v, hit: v >= L.need ? 1 : 0, bonus: 1})));
  } else if (kind === "cmd") {
    e.title = "Command Dice";
    fillCmd(e);
    dice.cmdLogId = e.id;
  } else if (kind === "scn") {
    e.title = "Scenario";
    e.chips = scn.v.map(v => ({v, hit: 0}));
    e.total = SCN.map((p, i) => p.n.split(" ")[0][0] + scn.v[i]).join(" ");
    e.scn = 1;
  } else if (kind === "r6") {
    e.title = "Round 6?";
    e.chips = [{v: scn.r6, hit: scn.r6 >= 5 ? 1 : 0}];
    e.total = scn.r6 >= 5 ? "Play Round 6" : "Game ends";
  } else if (kind === "recon") {
    e.title = "Recon Roll";
    e.cmd = scn.recon.dice.map(x => ({c: x.c, v: x.v, rr: 0}));
    e.total = scn.recon.total + " total";
  } else if (kind === "tgt") {
    const T = dice.tgt;
    e.title = "Targeting Die";
    e.total = T.hit ? "On Target" : 'Scatter ' + T.dist + '"';
    e.tgt = T.hit ? {hit: 1} : {dist: T.dist, rot: T.rot};
  }
  dlog.unshift(e);
  dlog = dlog.slice(0, 60);
  saveLog();
}

function fillCmd(e) {
  const cp = dice.rolled.reduce((a, x) => a + x.v, 0);
  e.total = cp + " CP";
  e.cmd = dice.rolled.map(x => ({c: x.c, v: x.v, rr: x.rr ? 1 : 0}));
  e.rerolls = dice.rerolls;
}

function updateCmdLog() {
  const e = dlog.find(x => x.id === dice.cmdLogId);
  if (e) { fillCmd(e); saveLog(); }
}

function rerollCmdDie(i) {
  const x = dice.rolled[i];
  if (!x || !dice.rerolls) return null;
  Object.assign(x, cmdRoll(x.c));
  x.rr = 1;
  dice.rerolls--;
  updateCmdLog();
  return x;
}

function doRoll(kind, arg) {
  if (kind === "d8") { rollD8(); logEntry("d8"); }
  else if (kind === "refail") { const fr = rerollFails(); logEntry("refail"); arg = fr; }
  else if (kind === "cmd") { rollCmd(); logEntry("cmd"); }
  else if (kind === "cmdOne") { if (!rerollCmdDie(arg)) { toast("No re-rolls left"); return; } }
  else if (kind === "tgt") { rollTgt(); logEntry("tgt"); }
  else if (kind === "scn") { rollScenario(); logEntry("scn"); }
  else if (kind === "r6") { if (!scn) return; rollR6(); logEntry("r6"); }
  else if (kind === "recon") { if (!scn) return; rollRecon(); logEntry("recon"); }
  saveDice(); renderDice();
  play3D(kind, arg);
}

function rollAgain(kind) {
  doRoll(kind === "refail" ? "d8" : kind === "cmdOne" ? "cmd" : kind);
}

function noiseBuf(ac, len) {
  const b = ac.createBuffer(1, Math.floor(ac.sampleRate * len), ac.sampleRate);
  const ch = b.getChannelData(0);
  for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / ch.length, 3);
  return b;
}

function playClack(vol, pitch) {
  const ac = sfx();
  if (!ac) return;
  const t = ac.currentTime;
  const src = ac.createBufferSource();
  src.buffer = noiseBuf(ac, 0.06);
  const bp = ac.createBiquadFilter();
  bp.type = "bandpass"; bp.frequency.value = 1800 + pitch * 2600; bp.Q.value = 2.2;
  const g = ac.createGain();
  g.gain.setValueAtTime(Math.min(1, vol) * 0.9, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
  src.connect(bp); bp.connect(g); g.connect(ac.destination);
  src.start(t);
  const o = ac.createOscillator(), og = ac.createGain();
  o.type = "triangle"; o.frequency.value = 650 + pitch * 900;
  og.gain.setValueAtTime(Math.min(1, vol) * 0.12, t);
  og.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
  o.connect(og); og.connect(ac.destination); o.start(t); o.stop(t + 0.06);
}

function playShake() {
  const ac = sfx();

  for (let i = 0; i < 9; i++) setTimeout(() => playClack(0.25 + Math.random() * 0.2, Math.random()), i * 32 + Math.random() * 20);

function playTick(i) {
  const ac = sfx();
  if (!ac) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = "sine"; o.frequency.value = 520 + i * 45;
  g.gain.setValueAtTime(0.09, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + 0.1);
}

function playChime(good) {
  const ac = sfx();
  if (!ac) return;
  const notes = good ? [523.25, 659.25, 783.99, 1046.5] : [392, 349.23];
  notes.forEach((f, i) => {
    const t = ac.currentTime + i * 0.09, o = ac.createOscillator(), g = ac.createGain();
    o.type = "triangle"; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.14, t + 0.02); g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + 0.55);

}

function faceCanvas(bg, fg, draw) {

function drawSwords(x, n) {
  const p = new Path2D(SWORD_PATH);
  const one = (ang, sc) => { x.save(); x.translate(128, 128); x.rotate(ang); x.scale(sc, sc); x.translate(-12, -12); x.fill(p); x.restore(); };
  if (n === 1) one(0, 7);
  else if (n === 2) { one(0, 6.6); one(-Math.PI / 2, 6.6); }
  else if (n >= 3) { one(0, 6); one(-Math.PI / 2, 6); one(-Math.PI / 4, 6.4); }
}

function drawBurst(x, cx, cy, r) {
  x.beginPath();
  for (let i = 0; i < 20; i++) {
    const a = i / 20 * Math.PI * 2 - Math.PI / 2, rr = i % 2 ? r * 0.45 : r;
    x.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
  }
  x.closePath(); x.fill();
}

function octaGeometry() {
  const pos = [], uv = [], faces = [];
  const signs = [];
  [1, -1].forEach(sx => [1, -1].forEach(sy => [1, -1].forEach(sz => signs.push([sx, sy, sz]))));
  signs.forEach(([sx, sy, sz], fi) => {
    const X = [sx, 0, 0], Y = [0, sy, 0], Z = [0, 0, sz];
    const tri = sx * sy * sz > 0 ? [X, Y, Z] : [X, Z, Y];
    const rot = fi % 3;
    const t = [tri[rot], tri[(rot + 1) % 3], tri[(rot + 2) % 3]];
    t.forEach(v => pos.push(...v));
    uv.push(0.5, 0.93, 0.07, 0.12, 0.93, 0.12);
  });
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
  for (let i = 0; i < 8; i++) g.addGroup(i * 3, 3, i);
  g.computeVertexNormals();
  return g;
}

function faceFrames(g) {
  const pos = g.attributes.position, uv = g.attributes.uv, out = [];
  const idx = g.index ? g.index.array : null;
  g.groups.forEach(gr => {
    const ids = [];
    for (let k = gr.start; k < gr.start + gr.count; k++) ids.push(idx ? idx[k] : k);
    const uniq = [...new Set(ids)];
    const P = uniq.map(i => new THREE.Vector3().fromBufferAttribute(pos, i));
    const V = uniq.map(i => uv.getY(i));
    const c = P.reduce((a, p) => a.add(p), new THREE.Vector3()).multiplyScalar(1 / P.length);
    const mv = V.reduce((a, b) => a + b, 0) / V.length;
    const up = new THREE.Vector3();
    P.forEach((p, k) => up.addScaledVector(p.clone().sub(c), V[k] - mv));
    const a = new THREE.Vector3().fromBufferAttribute(pos, ids[0]), b = new THREE.Vector3().fromBufferAttribute(pos, ids[1]), cc = new THREE.Vector3().fromBufferAttribute(pos, ids[2]);
    const n = b.clone().sub(a).cross(cc.clone().sub(a)).normalize();
    up.addScaledVector(n, -up.dot(n)).normalize();
    out[gr.materialIndex] = {n, up};
  });
  return out;
}

function grassMat() {

  x.fillRect(0, 0, N, N);
  const wrap = (fn) => { for (const dx of [-N, 0, N]) for (const dy of [-N, 0, N]) fn(dx, dy); };
  const blob = (cx, cy, r, col) => wrap((dx, dy) => { const g = x.createRadialGradient(cx + dx, cy + dy, 0, cx + dx, cy + dy, r); g.addColorStop(0, col); g.addColorStop(1, "rgba(0,0,0,0)"); x.fillStyle = g; x.fillRect(cx + dx - r, cy + dy - r, r * 2, r * 2); });
  const R = () => Math.random();
  for (let i = 0; i < 70; i++) blob(R() * N, R() * N, 60 + R() * 170, R() < 0.5 ? `rgba(98,128,52,${0.25 + R() * 0.3})` : `rgba(44,66,26,${0.25 + R() * 0.35})`);
  for (let i = 0; i < 14; i++) blob(R() * N, R() * N, 30 + R() * 80, `rgba(120,98,58,${0.18 + R() * 0.25})`);
  for (let i = 0; i < 26; i++) blob(R() * N, R() * N, 20 + R() * 50, `rgba(150,160,70,${0.15 + R() * 0.2})`);
  x.lineCap = "round";
  for (let i = 0; i < 26000; i++) {
    const px = R() * N, py = R() * N, l = 3 + R() * 7, a = -Math.PI / 2 + (R() - 0.5) * 1.2;
    const t = R();
    x.strokeStyle = t < 0.4 ? `rgba(118,150,62,${0.35 + R() * 0.4})` : t < 0.75 ? `rgba(58,84,32,${0.35 + R() * 0.4})` : t < 0.93 ? `rgba(150,170,80,${0.3 + R() * 0.35})` : `rgba(140,120,70,${0.3 + R() * 0.3})`;
    x.lineWidth = 0.8 + R() * 1.2;
    x.beginPath(); x.moveTo(px, py); x.lineTo(px + Math.cos(a) * l, py + Math.sin(a) * l); x.stroke();
  }
  for (let i = 0; i < 40; i++) {
    const cx = R() * N, cy = R() * N;
    for (let k = 0; k < 14; k++) {
      const a = -Math.PI / 2 + (R() - 0.5) * 1.6, l = 6 + R() * 10;
      x.strokeStyle = `rgba(${R() < 0.5 ? "160,170,90" : "70,96,36"},0.7)`;
      x.lineWidth = 1.2;
      x.beginPath(); x.moveTo(cx, cy); x.quadraticCurveTo(cx + Math.cos(a) * l * 0.5 + 2, cy + Math.sin(a) * l * 0.6, cx + Math.cos(a) * l, cy + Math.sin(a) * l); x.stroke();
    }
  }
  for (let i = 0; i < 9; i++) {
    const cx = R() * N, cy = R() * N, r = 2 + R() * 4;
    x.fillStyle = `rgba(${130 + R() * 40},${125 + R() * 30},${110 + R() * 20},0.85)`;
    x.beginPath(); x.ellipse(cx, cy, r * 1.3, r, R() * 3, 0, Math.PI * 2); x.fill();
    x.fillStyle = "rgba(0,0,0,0.25)";
    x.beginPath(); x.ellipse(cx + 1.5, cy + 1.5, r * 1.3, r, 0, 0, Math.PI * 2); x.fill();

}

function restQuat(frame, dirWorld, upWorld) {
  const n = frame.n, u = frame.up, w = n.clone().cross(u);
  const L = new THREE.Matrix4().makeBasis(n, u, w);
  const W = new THREE.Matrix4().makeBasis(dirWorld, upWorld, dirWorld.clone().cross(upWorld));
  const m = W.multiply(L.transpose());
  return new THREE.Quaternion().setFromRotationMatrix(m);
}

function screenUp(dir, angleDeg) {
  const camUp = new THREE.Vector3(0, 1, 0);
  const s = camUp.clone().addScaledVector(dir, -camUp.dot(dir));
  if (s.lengthSq() < 1e-6) s.set(0, 0, -1);
  s.normalize();
  return s.applyAxisAngle(dir, -angleDeg * Math.PI / 180);
}

function makeDie(spec) {

  } else {
    mesh = new THREE.Mesh(R3.geo.box, R3.mats["cmd" + spec.color]);

  mesh.castShadow = true;

  R3.scene.add(mesh);
  return {mesh, frames, rest, ring, spec};
}

function clearDice() {
  R3.dice.forEach(o => { R3.scene.remove(o.mesh); R3.scene.remove(o.ring); o.mesh.children.forEach(c => c.geometry.dispose()); o.ring.geometry.dispose(); });
  R3.dice = [];
}

function tween(dur, fn) {
  return new Promise(res => R3.tweens.push({t0: performance.now(), dur, fn, res}));
}

function loop() {
  const now = performance.now();
  R3.tweens = R3.tweens.filter(tw => {
    let t = R3.skip ? 1 : Math.min(1, (now - tw.t0) / tw.dur);
    tw.fn(t);
    if (t >= 1) { tw.res(); return false; }
    return true;
  });
  if (R3.sim) R3.sim();
  R3.ren.render(R3.scene, R3.cam);
  R3.raf = requestAnimationFrame(loop);
}

const ease = t => 1 - Math.pow(1 - t, 3);
const easeIO = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

function camTo(dist, dur) {
  const from = R3.cam.position.clone(), to = VIEW().multiplyScalar(dist);
  return tween(dur, t => { R3.cam.position.lerpVectors(from, to, easeIO(t)); R3.cam.lookAt(0, 0, 0); });
}


function floorBox(dist) {
  const cam = R3.cam.clone();
  cam.position.copy(VIEW().multiplyScalar(dist));
  cam.lookAt(0, 0, 0);
  cam.updateMatrixWorld(true);
  cam.updateProjectionMatrix();
  const hit = (x, y) => {
    const r = new THREE.Raycaster();
    r.setFromCamera(new THREE.Vector2(x, y), cam);
    const t = -r.ray.origin.y / r.ray.direction.y;
    return r.ray.origin.clone().addScaledVector(r.ray.direction, t);
  };
  const top = window.innerWidth < 600 ? 0.8 : 0.84, bot = window.innerWidth < 600 ? -0.78 : -0.8;
  const tl = hit(-0.94, top), tr = hit(0.94, top), bl = hit(-0.94, bot), br = hit(0.94, bot);
  return {minX: Math.max(tl.x, bl.x), maxX: Math.min(tr.x, br.x), minZ: Math.max(tl.z, tr.z), maxZ: Math.min(bl.z, br.z)};
}

function throwDist(n, s) {
  const need = n * Math.pow(2.5 * s, 2) * 2.2;
  let dist = 21;
  for (let k = 0; k < 40; k++) {
    const b = floorBox(dist);
    if ((b.maxX - b.minX) * (b.maxZ - b.minZ) >= need && (b.maxX - b.minX) > 5 * s) return {dist, box: b};
    dist *= 1.07;
  }
  return {dist, box: floorBox(dist)};
}

function stepSim(sim, dt) {
  const G = 34, B = sim.box, list = sim.list;
  list.forEach(o => {
    const P = o.p, V = o.v;
    V.y -= G * dt;
    P.addScaledVector(V, dt);
    const fh = o.fh;
    if (P.y > sim.ceil) { P.y = sim.ceil; if (V.y > 0) V.y = -V.y * 0.3; }
    if (P.y < fh) {
      P.y = fh;
      if (V.y < -1.6) { if (!sim.silent) playClack(Math.min(1, -V.y / 14), Math.random()); o.w.multiplyScalar(0.8).add(new THREE.Vector3(V.z, 0, -V.x).multiplyScalar(0.35 / o.r)); }
      V.y = V.y < -1.6 ? -V.y * 0.42 : 0;
      V.x *= 0.86; V.z *= 0.86;
    }
    if (P.y <= fh + 0.02) {
      const f = Math.max(0, 1 - 2.6 * dt);
      V.x *= f; V.z *= f;
      o.w.multiplyScalar(Math.max(0, 1 - 3.2 * dt));
      o.w.lerp(new THREE.Vector3(V.z, 0, -V.x).multiplyScalar(1 / o.r), 0.08);
    } else {
      o.w.multiplyScalar(Math.max(0, 1 - 0.3 * dt));
    }
    const wall = (val, lo, hi, axis) => {
      if (val < lo) { P[axis] = lo; if (V[axis] < 0) { if (!sim.silent && V[axis] < -3) playClack(Math.min(0.6, -V[axis] / 20), 0.3); V[axis] = -V[axis] * 0.62; o.w.multiplyScalar(0.9); } }
      else if (val > hi) { P[axis] = hi; if (V[axis] > 0) { if (!sim.silent && V[axis] > 3) playClack(Math.min(0.6, V[axis] / 20), 0.3); V[axis] = -V[axis] * 0.62; o.w.multiplyScalar(0.9); } }
    };
    wall(P.x, B.minX + o.r, B.maxX - o.r, "x");
    wall(P.z, B.minZ + o.r, B.maxZ - o.r, "z");
    const wl = o.w.length();
    if (wl > 1e-4) o.q.premultiply(new THREE.Quaternion().setFromAxisAngle(o.w.clone().multiplyScalar(1 / wl), wl * dt));
  });
  const all = list.concat(sim.statics);
  for (let it = 0; it < 3; it++)
  for (let i = 0; i < list.length; i++) {
    const a = list[i];
    for (let j = i + 1; j < all.length; j++) {
      const b = all[j];
      const d = b.p.clone().sub(a.p), dist = d.length(), min = a.r + b.r;
      if (dist >= min || dist < 1e-6) continue;
      const n = d.multiplyScalar(1 / dist), over = min - dist;
      if (b.stat) { a.p.addScaledVector(n, -over); }
      else { a.p.addScaledVector(n, -over / 2); b.p.addScaledVector(n, over / 2); }
      const bv = b.stat ? new THREE.Vector3() : b.v;
      const vn = bv.clone().sub(a.v).dot(n);
      if (vn < 0 && it === 0) {
        const jimp = -(1 + 0.5) * vn / (b.stat ? 1 : 2);
        a.v.addScaledVector(n, -jimp);
        if (!b.stat) b.v.addScaledVector(n, jimp);
        const kick = new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).multiplyScalar(Math.min(12, -vn * 2));
        a.w.add(kick); if (!b.stat) b.w.sub(kick);
        if (!sim.silent && vn < -2.5) playClack(Math.min(0.8, -vn / 12), 0.6 + Math.random() * 0.4);
      }
    }
  }
  sim.t += dt;
  const moving = list.some(o => o.v.lengthSq() > 0.25 || o.p.y > o.fh + 0.05 || o.w.lengthSq() > 4);
  sim.still = moving ? 0 : sim.still + dt;
  if (sim.still > 0.15 || sim.t > 3.6) sim.done = true;
}

function syncSim(sim) {
  sim.list.forEach(o => { o.mesh.position.copy(o.p); o.mesh.quaternion.copy(o.q); });
}

async function throwWave(specs, label, s) {
  if (label) showBanner(label);
  const statics = R3.dice.map(o => ({p: o.mesh.position.clone(), r: o.r || 1.1 * s, stat: 1}));
  const {dist, box} = throwDist(specs.length + statics.length * 0.6, s);
  await camTo(dist, statics.length ? 450 : 1);
  const W = box.maxX - box.minX;
  const list = specs.map((sp, i) => {
    const o = makeDie(sp);
    o.mesh.scale.setScalar(s);
    o.s = s;
    o.r = (sp.kind === "cmd" ? 1.0 : 0.95) * s;
    o.fh = (sp.kind === "cmd" ? 0.86 : 0.74) * s;
    const perRow = Math.max(1, Math.floor((W - 2 * o.r) / (2.3 * o.r))), row = Math.floor(i / perRow), col = i % perRow, inRow = Math.min(perRow, specs.length - row * perRow);
    const x = box.minX + o.r + (W - 2 * o.r) * ((col + 0.5) / inRow);
    o.p = new THREE.Vector3(x, 1.4 * s + (row % 3) * 2.3 * s, Math.min(box.maxZ - o.r, box.maxZ - o.r - (row >= 3 ? (row - 2) * 2.3 * s : 0)));
    o.v = new THREE.Vector3((Math.random() - 0.5) * 10, 2 + Math.random() * 4, -(11 + Math.random() * 9));
    o.w = new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize().multiplyScalar(10 + Math.random() * 14);
    o.q = new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.random() * 6.3, Math.random() * 6.3, Math.random() * 6.3));
    o.mesh.position.copy(o.p);
    o.mesh.quaternion.copy(o.q);
    R3.dice.push(o);
    return o;
  });
  playShake();
  const sim = {list, statics, box, t: 0, still: 0, done: false, silent: false, ceil: 4.2 + 2 * s};
  await new Promise(res => {
    let last = performance.now(), acc = 0;
    R3.sim = () => {
      if (R3.skip) {
        sim.silent = true;
        let g = 0;
        while (!sim.done && g++ < 1200) stepSim(sim, 1 / 120);
        sim.done = true;
      } else {
        const now = performance.now();
        acc += Math.min(0.05, (now - last) / 1000);
        last = now;
        while (acc >= 1 / 120 && !sim.done) { stepSim(sim, 1 / 120); acc -= 1 / 120; }
      }
      syncSim(sim);
      if (sim.done) { R3.sim = null; res(); }
    };
  });
  await Promise.all(list.map(o => {
    const restAng = o.spec.kind === "tgt" ? o.spec.rot : (Math.random() * 40 - 20);
    const floorUp = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), -restAng * Math.PI / 180);
    const qT = restQuat(o.frames[o.spec.face], new THREE.Vector3(0, 1, 0), floorUp);
    const qF = o.mesh.quaternion.clone(), y0 = o.mesh.position.y, yR = o.rest * s;
    if (!R3.skip) setTimeout(() => playClack(0.35, Math.random()), 200 + Math.random() * 120);
    return tween(380, t => {
      const e = easeIO(t);
      o.mesh.quaternion.copy(qF).slerp(qT, e);
      o.mesh.position.y = y0 + (yR - y0) * e + Math.sin(Math.PI * e) * 0.45 * s;
    });
  }));
}

async function lineUp(s, rowsOf) {
  const dir = VIEW();
  const n = R3.dice.length;
  const aspect = R3.cam.aspect;
  const maxCols = aspect >= 1 ? 10 : 5;
  const sp = 2.35 * s, spY = sp * 1.32;
  let rows = [];
  rowsOf.forEach(group => { for (let i = 0; i < group.length; i += maxCols) rows.push(group.slice(i, i + maxCols)); });
  const cols = Math.max(...rows.map(r => r.length));
  const Wd = cols * sp + 1.2, Hd = rows.length * spY + 1.6;
  const vf = R3.cam.fov * Math.PI / 180, hf = 2 * Math.atan(Math.tan(vf / 2) * aspect);
  const dist = Math.max(23.8 * 0.9, (Wd / 2) / Math.tan(hf / 2) + 2, (Hd / 2) / Math.tan(vf / 2) * 1.1 + 4);
  const camP = camTo(dist, 700);
  const right = new THREE.Vector3(1, 0, 0), down = new THREE.Vector3().crossVectors(dir, right).normalize().negate();
  const moves = [];
  let k = 0;
  rows.forEach((row, ri) => row.forEach((o, ci) => {
    const x = (ci - (row.length - 1) / 2) * sp;
    const y = (ri - (rows.length - 1) / 2) * spY;
    const target = new THREE.Vector3().addScaledVector(right, x).addScaledVector(down, y).add(new THREE.Vector3(0, 1.0 * s, 0));
    target.y = Math.max(target.y, 1.0 * s);
    const ang = o.spec.kind === "tgt" ? o.spec.rot : 0;
    const fdir = o.spec.kind === "cmd" ? dir.clone().add(new THREE.Vector3(0.22, 0.3, 0)).normalize() : dir;
    o.fdir = fdir;
    const qT = restQuat(o.frames[o.spec.face], fdir, screenUp(fdir, ang));
    const from = o.mesh.position.clone(), qF = o.mesh.quaternion.clone();
    const ringT = target.clone(); ringT.y = 0.02;
    const idx = k++;
    moves.push(new Promise(res => setTimeout(res, R3.skip ? 0 : idx * 45)).then(() => {
      if (!R3.skip) playTick(idx % 12);
      return tween(520, t => {
        const e = easeIO(t);
        o.mesh.position.lerpVectors(from, target, e);
        o.mesh.position.y += Math.sin(Math.PI * e) * 1.2 * s;
        o.mesh.quaternion.copy(qF).slerp(qT, e);
        o.ring.position.copy(ringT);
        o.ring.position.y = 0.02;
        o.ring.scale.setScalar(s);
      });
    }));
  }));
  await Promise.all([camP, ...moves]);
}

function showBanner(txt) {
  const b = R3.el.querySelector(".r3-banner");
  b.textContent = txt;
  b.classList.remove("on"); void b.offsetWidth; b.classList.add("on");
}

function lightRings() {
  R3.dice.forEach(o => { if (o.spec.hit) tween(350, t => { o.ring.material.opacity = 0.85 * t; }); else if (o.spec.dim) tween(350, t => { o.mesh.scale.setScalar(o.s * (1 - 0.12 * t)); }); });
}

function cmdSum() {
  const cp = dice.rolled.reduce((a, x) => a + x.v, 0);
  return `<b>${cp}</b> Command Point${cp === 1 ? "" : "s"}<small>${dice.rerolls} re-roll${dice.rerolls === 1 ? "" : "s"} left</small>`;
}

function setHint() {
  const h = R3.el.querySelector(".r3-hint");
  const cmd = R3.kind === "cmd" || R3.kind === "cmdOne";
  if (cmd && dice.rerolls > 0) { h.textContent = `Tap a die to re-roll it (${dice.rerolls} left)`; h.style.display = ""; h.classList.add("top"); }
  else { h.style.display = "none"; h.classList.remove("top"); }
}

function pickReroll(e) {
  if (!(R3.kind === "cmd" || R3.kind === "cmdOne") || R3.rerolling) return;
  const r = R3.ren.domElement.getBoundingClientRect();
  const m = new THREE.Vector2((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  const ray = new THREE.Raycaster();
  ray.setFromCamera(m, R3.cam);
  const hit = ray.intersectObjects(R3.dice.map(o => o.mesh), false)[0];
  if (!hit) return;
  const o = R3.dice.find(q => q.mesh === hit.object);
  if (!o || o.spec.kind !== "cmd") return;
  if (!dice.rerolls) { toast("No re-rolls left"); return; }
  const x = rerollCmdDie(o.spec.idx);
  if (!x) return;
  o.spec.face = x.i; o.spec.v = x.v;
  R3.rerolling = true;
  const from = o.mesh.quaternion.clone(), base = o.mesh.position.clone();
  const qT = restQuat(o.frames[x.i], o.fdir, screenUp(o.fdir, 0));
  const axis = new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize();
  playShake();
  tween(750, t => {
    const e2 = ease(t);
    o.mesh.position.copy(base);
    o.mesh.position.y += Math.sin(Math.PI * Math.min(1, t * 1.15)) * 2.2 * o.s;
    const q = from.clone().slerp(qT, e2);
    o.mesh.quaternion.copy(q).premultiply(new THREE.Quaternion().setFromAxisAngle(axis, 4 * Math.PI * (1 - e2)));
  }).then(() => {
    R3.rerolling = false;
    playClack(0.8, Math.random());
    R3.el.querySelector(".r3-sum").innerHTML = cmdSum();
    R3.el.querySelector(".r3-again").textContent = "↻ Roll Again";
    setHint();
    renderDice();
  });
}

function closeRoll3D() {
  if (!R3.el) return;
  R3.el.classList.remove("open");
  cancelAnimationFrame(R3.raf);
  R3.tweens.forEach(tw => tw.res());
  R3.tweens = [];
  R3.sim = null;
  clearDice();
  R3.busy = false;
  renderDice();
}

function rollSpecs(kind, arg) {
  const d8face = v => R3.geo.d8vals.indexOf(v);
  if (kind === "d8" || kind === "refail") {
    const L = dice.last;
    const base = kind === "d8" ? L.base : arg;
    const mk = v => ({kind: "d8", face: d8face(v), hit: v >= L.need, dim: v < L.need, v});
    const w1 = base.map(mk).sort((a, b) => b.v - a.v);
    const w2 = L.bonus.map(mk).sort((a, b) => b.v - a.v);
    const hits = L.base.filter(v => v >= L.need).length, bh = L.bonus.filter(v => v >= L.need).length;
    const waves = [{label: kind === "refail" ? `Re-rolling ${base.length} miss${base.length === 1 ? "" : "es"}` : `${base.length}D8 · need ${L.need}+`, dice: w1}];
    if (w2.length) waves.push({label: `Exploding 8s! +${w2.length} bonus ${w2.length === 1 ? "die" : "dice"}`, dice: w2});
    return {waves, good: hits + bh > 0, sum: `<b>${hits + bh}</b> success${hits + bh === 1 ? "" : "es"}<small>${hits} from ${L.base.length}D8${L.bonus.length ? ` + ${bh} from ${L.bonus.length} exploding` : ""} · needing ${L.need}+</small>`};
  }
  if (kind === "cmd" || kind === "cmdOne") {
    const idxs = kind === "cmd" ? dice.rolled.map((_, i) => i) : [arg];
    const w = idxs.map(i => { const x = dice.rolled[i]; return {kind: "cmd", color: x.c, face: x.i, v: x.v, hit: false, idx: i}; });
    const one = kind === "cmdOne" ? dice.rolled[arg] : null;
    return {waves: [{label: kind === "cmd" ? "Command Dice" : `Re-rolling a ${one.c} die`, dice: w}], good: true, sum: cmdSum()};
  }
  if (kind === "scn") {
    const w = scn.v.map(v => ({kind: "d8", face: d8face(v), v, hit: false}));
    return {waves: [{label: "Scenario", dice: w}], good: true, nosort: 1, sum: `<b>Scenario rolled</b><small>${SCN.map((p, i) => p.n + " " + scn.v[i]).join(" · ")}</small>`};
  }
  if (kind === "r6") {
    const v = scn.r6;
    return {waves: [{label: "End of Round 5", dice: [{kind: "d8", face: d8face(v), v, hit: v >= 5, dim: v < 5}]}], good: v >= 5, sum: v >= 5 ? `<b>Play Round 6!</b><small>Rolled ${v} (5+ needed)</small>` : `<b>Game ends</b><small>Rolled ${v} – the game ends after Round 5</small>`};
  }
  if (kind === "recon") {
    const w = scn.recon.dice.map(x => ({kind: "cmd", color: x.c, face: x.i, v: x.v, hit: false}));
    return {waves: [{label: "Recon Roll", dice: w}], good: true, sum: `<b>${scn.recon.total}</b> Recon total<small>Compare with your opponent – highest picks Deployment Zone(s); re-roll draws</small>`};
  }
  const T = dice.tgt;
  const opts = TGT_FACES.map((v, i) => [v, i]).filter(([v]) => T.hit ? v === "hit" : v === T.dist);
  const face = opts[Math.floor(Math.random() * opts.length)][1];
  return {waves: [{label: "Targeting Die", dice: [{kind: "tgt", face, rot: T.hit ? 0 : T.rot, hit: !!T.hit}]}], good: !!T.hit, sum: T.hit ? `<b>ON TARGET</b>` : `<b>Scatter ${T.dist}"</b><small>The arrow on the die points ${Math.abs(T.rot)}° ${T.rot >= 0 ? "clockwise" : "counter-clockwise"} from the top of the screen</small>`};
}

async function play3D(kind, arg) {
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!dice.anim3d || reduce || R3.busy) return;
  if (kind === "refail" && (!arg || !arg.length) && !(dice.last && dice.last.bonus.length)) return;
  if (kind === "recon" && (!scn || !scn.recon || !scn.recon.dice.length)) return;
  R3.busy = true;
  R3.kind = kind; R3.arg = arg;
  sfx();
  try { await loadThree(); } catch (e) { R3.busy = false; toast("3D dice need an internet connection – showing results instead"); return; }
  buildAssets();
  refreshCmdMats();
  setupScene();
  R3.resize();
  const spec = rollSpecs(kind, arg);
  const total = spec.waves.reduce((a, w) => a + w.dice.length, 0);
  const s = total > 30 ? 0.62 : total > 16 ? 0.78 : total <= 2 ? 1.7 : total <= 4 ? 1.3 : 1;
  R3.skip = false;
  clearDice();
  R3.el.querySelector(".r3-bar").classList.remove("on");
  R3.el.querySelector(".r3-hint").style.display = "";
  R3.el.querySelector(".r3-hint").classList.remove("top");
  R3.el.querySelector(".r3-hint").textContent = "Tap to skip";
  R3.el.classList.add("open");
  R3.cam.position.copy(VIEW().multiplyScalar(throwDist(total, s).dist));
  R3.cam.lookAt(0, 0, 0);
  cancelAnimationFrame(R3.raf);
  loop();
  const rows = [];
  for (const w of spec.waves) {
    if (rows.length) { R3.skip = false; await new Promise(r => setTimeout(r, 350)); }
    const before = R3.dice.length;
    await throwWave(w.dice, w.label, s);
    if (!R3.skip) await new Promise(r => setTimeout(r, 280));
    rows.push(R3.dice.slice(before));
    await lineUp(s, rows);
  }
  lightRings();
  playChime(spec.good);
  setHint();
  R3.el.querySelector(".r3-sum").innerHTML = spec.sum;
  R3.el.querySelector(".r3-again").textContent = kind === "cmdOne" ? "↻ Roll all again" : kind === "refail" ? "↻ Roll new pool" : "↻ Roll Again";
  R3.el.querySelector(".r3-bar").classList.add("on");
  R3.el.querySelector(".r3-ok").focus();
}

const RULES = __RULES__;
let rd = {ch: -1, q: ""};
const stripTags = h => h.replace(/<[^>]+>/g, " ").replace(/&nbsp;/g, " ").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&#39;|&rsquo;/g, "'").replace(/\s+/g, " ").trim();
const RCH = RULES.c.map(c => {
  if (/^keywords$/i.test(c.t)) {
    const extra = DATA.glossary.map(([n, t]) => ({m: "", t: n, p: "", l: 2, h: `<p>${esc(t.replace(/\s*\[Errata v1\.2\]$/, ""))}${/\[Errata v1\.2\]$/.test(t) ? ` <span class="e-badge">ERRATA</span>` : ""}</p>`}));
    return Object.assign({}, c, {s: [{m: "", t: "Keywords", p: "P46", l: 1, h: "<p>Every keyword in the game. Entries marked ERRATA are updated by FAQ &amp; Errata v1.2.</p>"}].concat(extra)});
  }
  return c;
});
RCH.forEach(c => c.s.forEach(s => { s.x = (s.t + " " + stripTags(s.h)).toLowerCase(); }));

function openRules(ch, si) {
  if (ch !== undefined) { rd.ch = ch; rd.q = ""; }
  renderReader();
  $("#reader").classList.add("open");
  document.body.classList.add("noscroll");

}
function closeRules() { $("#reader").classList.remove("open"); document.body.classList.remove("noscroll"); }

function goSection(si) {
  const el = document.getElementById("rs-" + rd.ch + "-" + si);
  if (!el) return;
  el.scrollIntoView({block: "start"});
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
}

function secHead(s, ci, si) {
  const tag = s.l === 1 ? "h3" : "h4";
  if (!s.t) return "";
  return `<${tag}>${s.m ? `<span class="rm">${esc(s.m)}</span>` : ""}${esc(s.t)}${s.p ? `<span class="rp">${esc(s.p.replace(/^P/, "p."))}</span>` : ""}</${tag}>`;
}

function renderReader() {
  const q = rd.q.trim().toLowerCase();
  const n = RCH.length;
  const ext = [[RULES_URL, "Rulebook PDF"], [ERRATA_URL, "FAQ &amp; Errata PDF"]];
  let nav = `<button class="rn" data-rch="-1" ${!q && rd.ch === -1 ? 'aria-current="true"' : ""}>Contents</button>` + RCH.map((c, i) => `<button class="rn" data-rch="${i}" ${!q && rd.ch === i ? 'aria-current="true"' : ""}><span>${i + 1}</span>${esc(c.t)}</button>`).join("")
    + ext.map(([u, t], k) => `<a class="rn ext" href="${u}" target="_blank" rel="noopener"><span>${n + k + 1}</span>${t} ↗</a>`).join("");
  let main = "";
  if (q) {
    const terms = q.split(/\s+/).filter(Boolean);
    const hits = [];
    RCH.forEach((c, ci) => c.s.forEach((s, si) => { if (terms.every(t => s.x.includes(t))) hits.push({ci, si, s, c}); }));
    main = `<h2>${hits.length} result${hits.length === 1 ? "" : "s"} for “${esc(rd.q)}”</h2>`;
    main += hits.slice(0, 80).map(({ci, si, s, c}) => {
      const txt = stripTags(s.h);
      const i = txt.toLowerCase().indexOf(terms[0]);
      const a = Math.max(0, i - 70), snip = (a ? "…" : "") + txt.slice(a, a + 200) + (txt.length > a + 200 ? "…" : "");
      let hs = esc(snip);
      terms.forEach(t => { hs = hs.replace(new RegExp("(" + t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig"), "<mark>$1</mark>"); });
      return `<button class="rhit" data-go="${ci}:${si}"><small>${esc(c.t)}${s.p ? " · " + esc(s.p.replace(/^P/, "p.")) : ""}</small><b>${esc(s.t || c.t)}</b><span>${hs}</span></button>`;
    }).join("") || `<p class="hint">Nothing found. Try a single word like “pinned” or “assault”.</p>`;
  } else if (rd.ch < 0 || rd.ch >= RCH.length) {
    main = `<h2>${esc(RULES.v || "Epic Warpath Rules")}</h2><p class="hint">From the Mantic Companion online rules, with FAQ &amp; Errata v1.2 keyword changes. Tap a chapter or search above.</p><div class="rtoc">` +
      RCH.map((c, i) => `<button class="rtc" data-rch="${i}"><span>${i + 1}</span><b>${esc(c.t)}</b><small>${c.s.filter(s => s.t && s.l === 1).length || c.s.length} sections</small></button>`).join("") +
      `<a class="rtc ext" href="${RULES_URL}" target="_blank" rel="noopener"><span>${n + 1}</span><b>Rulebook PDF ↗</b><small>Full Epic Warpath rulebook (Mantic)</small></a>` +
      `<a class="rtc ext" href="${ERRATA_URL}" target="_blank" rel="noopener"><span>${n + 2}</span><b>FAQ &amp; Errata PDF ↗</b><small>v1.2 – free download from Mantic's store</small></a>` + `</div>`;
  } else {
    const c = RCH[rd.ch];
    const toc = c.s.map((s, si) => s.t && s.l === 1 ? `<button class="rt" data-go="${rd.ch}:${si}">${esc(s.t)}</button>` : "").join("");
    main = `<div class="rchead"><small>Chapter ${rd.ch + 1}</small><h2>${esc(c.t)}</h2>${toc ? `<div class="rtocs">${toc}</div>` : ""}</div>`;
    main += c.s.map((s, si) => `<section class="rs lvl${s.l}" id="rs-${rd.ch}-${si}">${secHead(s, rd.ch, si)}<div class="rbody">${s.h}</div></section>`).join("");
    main += `<div class="rpager">${rd.ch > 0 ? `<button class="tbtn" data-rch="${rd.ch - 1}">‹ ${esc(RCH[rd.ch - 1].t)}</button>` : "<span></span>"}${rd.ch < RCH.length - 1 ? `<button class="tbtn" data-rch="${rd.ch + 1}">${esc(RCH[rd.ch + 1].t)} ›</button>` : ""}</div>`;
  }
  $("#rdNav").innerHTML = nav;
  $("#rdMain").innerHTML = main;
  $("#rdChSel").innerHTML = `<option value="-1">Contents</option>` + RCH.map((c, i) => `<option value="${i}" ${!q && rd.ch === i ? "selected" : ""}>${i + 1}. ${esc(c.t)}</option>`).join("") + `<option value="pdf">${n + 1}. Rulebook PDF ↗</option><option value="errata">${n + 2}. FAQ &amp; Errata PDF ↗</option>`;
  $("#rdMain").querySelectorAll("img").forEach(im => im.addEventListener("error", () => im.remove()));
}

$("#reader").addEventListener("click", e => {
  const t = e.target.closest("[data-rch],[data-go],[data-rclose]");
  if (!t) return;
  if (t.dataset.rclose !== undefined) { closeRules(); return; }
  if (t.dataset.rch !== undefined) { rd.ch = +t.dataset.rch; rd.q = ""; $("#rdSearch").value = ""; renderReader(); $("#rdMain").scrollTop = 0; return; }
  if (t.dataset.go) { const [ci, si] = t.dataset.go.split(":").map(Number); rd.ch = ci; rd.q = ""; $("#rdSearch").value = ""; renderReader(); setTimeout(() => goSection(si), 20); }
});
$("#rdSearch").addEventListener("input", e => { rd.q = e.target.value; renderReader(); $("#rdMain").scrollTop = 0; });
$("#rdChSel").addEventListener("change", e => { if (e.target.value === "pdf" || e.target.value === "errata") { window.open(e.target.value === "pdf" ? RULES_URL : ERRATA_URL, "_blank", "noopener"); renderReader(); return; } rd.ch = +e.target.value; rd.q = ""; $("#rdSearch").value = ""; renderReader(); $("#rdMain").scrollTop = 0; });
$("#btnRules").onclick = () => openRules();
$("#rdPrint").onclick = () => { closeRules(); runPrint({ref: 1}); };
document.querySelector("#tabs [data-rules]").onclick = () => openRules();

window.addEventListener("keydown", e => { if (R3.el && R3.el.classList.contains("open") && (e.key === "r" || e.key === "R") && R3.el.querySelector(".r3-bar.on")) { e.preventDefault(); R3.el.querySelector(".r3-again").click(); return; } if (R3.el && R3.el.classList.contains("open") && (e.key === "Enter" || e.key === "Escape") && R3.el.querySelector(".r3-bar.on")) { e.preventDefault(); closeRoll3D(); return; } if (R3.el && R3.el.classList.contains("open") && e.key === " ") { R3.skip = true; e.preventDefault(); return; } if (e.key === "Escape" && $("#reader").classList.contains("open")) { closeRules(); return; } if (e.key === "Escape") { hidePop(); document.querySelectorAll(".overlay").forEach(o => o.remove()); } });

load();
if (cur) render(); else { cur = newList("asterians"); render(); start(); }
</script>
</body>
</html>

amic Objectives and then place them following the rules for Objective placement. If the first four objectives placed are Inactive, the fifth one is automatically Active.<\/td> <\/tr> <tr> <td>3-4<\/td> <td>Use three Dynamic Objectives and then place them following the rules for Objective placement. Now place one Static Objective marker in one of each player’s Deployment Zone(s), at least 9” for any other Objective marker, and no closer than 6” to any table edge.<\/td> <\/tr> <tr> <td>5-6<\/td> <td>Place one Static Objective in the exact centre of the table. Each player takes one more Static and one more Dynamic Objective marker. Take it in turns to place them in any order, following the normal rules for Objective Placement.<\/td> <\/tr> <tr> <td>7-8<\/td> <td>Place one Static Objective in the exact centre of the table. Place two more Static Objectives either side of the first, 12” away from it, along a line that runs exactly from the middle of a random table edge to the other side of the table, through the centre (see diagram). Then, each player takes and places one Dynamic Objective marker following the normal rules for Objective placement.<\/td> <\/tr> <\/tbody> <\/table> <p>Objective markers do not block LOS or movement and cannot be moved or removed from their position unless a Scenario rule says otherwise. A marker within a building that is destroyed still stays in the same place in the footprint of the remaining ruin.<\/p>"},{"m":"iii.","t":"Objective Types","p":"P54","l":2,"h":"<p>There are two types of Objective in Epic Warpath: Static Objectives, and Dynamic Objectives.<\/p> <p><strong>Static Objectives:<\/strong> Static Objectives are always available for scoring. They use the following Objective markers.<\/p> <p><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/static_marker.png\"/><\/p> <p><strong>Dynamic Objectives:<\/strong> Dynamic Objectives represent the actions of quickthinking commanders on the ground, taking advantage of situations as they occur in the heat of battle. Dynamic Objectives are not always available for scoring, and are flipped (from “active” to “inactive” or vice versa) in the End Phase of each Round (see page 34).<\/p> <p><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/dynamic_markers.png\"/><\/p> <p><strong>Placing Objectives<\/strong><\/p> <p>When players must place Objectives themselves (not determined by a Scenario Parameter), either a third party can place them, or the players themselves will do so, alternating between them. If there are an odd number of objectives, roll to see which player places the extra one. When initially placing Dynamic Objectives, toss each like a coin to determine its starting state. Objectives placed by players rather than by Scenario rules, must be placed outside any Deployment Zones, and at least 9” from any other Objective markers or table edge, and 6” from any deployment zone. They may be placed in or on any terrain, except for terrain that is Impassable to all Unit types.<\/p>"},{"m":"iv.","t":"3. Scoring","p":"P55","l":2,"h":"<p>This Scenario Parameter explains how the players are going to score Victory Points (VPs) throughout and at the end of the game. The player with the most VPs at the end of the game is the winner! VPs scored at the end of each Round add to the players’ cumulative totals.<\/p> <table> <tbody> <tr> <th>D8 Roll<\/th> <th>Scoring Chart<\/th> <\/tr> <tr> <td>1-2<\/td> <td>Each player scores VPs for any Objectives they currently claim at the end of each Round. In Rounds 1, 2 and 3, Active Dynamic Objectives and Static Objectives score 3 VPs each. From Round 4 onwards, Active Dynamic Objectives and Static Objectives score 5 VPs each. The player with the most VPs at the end of the last Round is the winner.<\/td> <\/tr> <tr> <td>3-4<\/td> <td>Each player scores VPs for any Objectives they currently claim at the end of each Round. Static and Active Dynamic Objectives score 3 VPs each. In addition, the player that currently has the most Pin markers on their Units at the end of a Round makes a single Nerve test with no modifiers against their Army Nerve value. If the test is failed, they loses 1 VP (to a minimum of zero). The player with the most VPs at the end of the last Round is the winner.<\/td> <\/tr> <tr> <td>5-6<\/td> <td>Each player scores VPs for any Objectives they currently claim at the end of each Round. Static and Active Dynamic Objectives score 3 VPs each. In addition, add up the US of each side’s Units wholly within each Deployment Zone at the end of each Round. Pinned units count as US 1 for this as with scoring Objectives (unless already US 0). The player with highest US score in each Deployment Zone scores an additional 3 VPs for each Zone they claim. The player with the most VPs at the end of the last Round is the winner.<\/td> <\/tr> <tr> <td>7-8<\/td> <td>Each player scores VPs for any enemy Units they destroy in a Round. Score 1 VP for each Infantry or Bike Unit, and 2 VPs for each Heavy Infantry, Command, Vehicle or Walker Unit. Super-heavies score 3 VPs. From the end of Round three onwards, as well as scoring for any Units destroyed that Round, players also score 3 VPs for each Static or Active Objective, and 1 VP for each Inactive Objective they claim. The player with the most VPs at the end of the last Round is the winner.<\/td> <\/tr> <\/tbody> <\/table> <p>VPs are scored by achieving some conditions described in the Scenario Parameter, like eliminating some enemy models, for example. The most common and perhaps important way to score points, however, is through claiming Objectives.<\/p> <p>To claim an Objective, a unit must have at least one base within 3” of the Objective marker. In addition, if there are multiple units meeting these criteria the Objective will be claimed by the player with the highest total US of their Units within 3” of the Objective. Neither side can claim in the case of a tied score.<\/p> <p>A unit may only claim a single Objective at a time, even if it is eligible to claim more. Units with a US of 2 or more that have a Pinned marker count as US 1.<\/p> <p>A Unit uses the first number as its US value until it has lost half or more of its Bases, after which it immediately uses the second number. For example, a Unit of 6 Bases with a US of 4/2 uses 4 as its US value until it has lost 3 Bases, at which point it then uses 2 as its value.<\/p> <p>If a Unit has a single value for its US, then it will never degrade, regardless of any damage the Unit suffers. All transported units, and Units with the Fly keyword, may not claim or contest objectives and are always ignored for this purpose.<\/p> <p>Where an Objective marker is on a building, any Unit currently occupying that building (or building section in the case of large buildings), will count its US as double when the Objective is scored. However, the 3” “zone” for claiming the Objective, can be measured from all building edges. In effect, the building (or section) has become the Objective. This doesn’t impact the 9” placement rule when placing the markers initially<\/p> <p><em>For example, Graham and Sam both have units contesting an Objective marker. Sam has two units that have Bases within 3” of the objective. Of his two units, one has US 1 and the other US 2. Graham has a single Unit with US 2 within 3” of the Objective marker. Sam’s combined total is US 3 and therefore claims the Objective, beating Graham’s US 2.<\/em><\/p>"},{"m":"v.","t":"4. Reserves Ratio","p":"P56","l":2,"h":"<p>This Scenario Parameter explains how the two opposing armies enter the fray - whether they start the game on the table or instead begin the game in Reserve (see page 58).<\/p> <table> <tbody> <tr> <th>D8 Roll<\/th> <th>Army Deployment Chart<\/th> <\/tr> <tr> <td>1-2<\/td> <td>Reserves are not allowed (unless a Unit has a rule that says otherwise).<\/td> <\/tr> <tr> <td>3-4<\/td> <td>Up to half of each Player’s Units (rounding up; count whole Units, not Bases!) may be placed in Reserve.<\/td> <\/tr> <tr> <td>5-6<\/td> <td>Each player must deploy at least three Units on the table. Any number of remaining units may then be placed in Reserve.<\/td> <\/tr> <tr> <td>7-8<\/td> <td>Any number of units may be placed in Reserve. Reserves may not enter play until Round 3 at the earliest, unless a Unit has the Orbital/ Subterranean Deployment Keyword, in which case it may arrive from Turn 2 as normal.<\/td> <\/tr> <\/tbody> <\/table>"},{"m":"vi.","t":"5. Recon Roll and Deployment","p":"P57","l":2,"h":"<p>After having determined Scenario Parameters, including placing objectives and marking out deployment zones, players proceed with the Recon Roll.<\/p> <p>Each player rolls a number of Command Dice equal to three Black plus those provided by Command units in their army (gained from the Tactician Keyword) and compare their total scores. Re-roll in the case of a draw. The player with the highest score wins the Recon Roll and chooses which Deployment Zone(s) to take as theirs.<\/p> <p>The opponent gets the opposite Deployment Zone(s)<\/p> <p>The player that won the Recon Roll must now declare which of their units are left in Reserve (if any are allowed). They must also declare which of their Units will begin the game aboard which transports, if any (including those in Reserve). Their opponent then does likewise. The players then proceed to alternate deploying one of their units at a time, starting with the winner of the Recon roll, and following the guidelines below.<\/p> <ul> <li>Units must be placed wholly in their Deployment Zone, in Coherency and in legal positions (e.g. a player cannot deploy a Vehicle Unit into a building).<\/li> <li>Transported units are deployed automatically when their transports are deployed, and this counts as deploying a single unit. Some Units have Transport Capacity even though they are not in the Transport category. These Units can start the game with Units embarked.<\/li> <li>HQ Units (and any transports/embarked Units they have) are always deployed last, and they are all deployed at the same time, counting as deploying a single unit.<\/li> <\/ul>"},{"m":"vii.","t":"6. Begin the game!","p":"P57","l":2,"h":"<p>Once deployment is done (or if the Scenario Parameter does not require deployment at all and all forces start the game in Reserve), you are now ready to begin Round 1 of the game.<\/p>"},{"m":"viii.","t":"Draw?","p":"P57","l":2,"h":"<p>If a game ends and both players have an equal number of VPs, the player with the largest total US from all their Units still In Play is the winner. Remember that Pinned Units will have reduced US. If both players have the same US total, the game is definitely a draw!<\/p>"},{"m":"ix.","t":"Wipe out?","p":"P57","l":2,"h":"<p>Sometimes a lucky (or ruthless!) player will wipe out all their opponent’s Units before the end of the agreed game length (usually Round five). If this happens, the player with Units left immediately gains 10VPs and then completes all their actions for the Round, and then VPs at the end of the Current Round are calculated to determine the actual Winner.<\/p> <p>There’s a small chance that the player that got wiped out could still win if they had got far enough ahead before disaster struck! If a player has no Units In Play at the end of Round 2 or later, they must bring all Units they have in Reserve into play in the next Round, otherwise they all count as being destroyed.<\/p>"},{"m":"d.","t":"Reserves","p":"P58","l":1,"h":"<p>Units placed in Reserve can only move onto the table from Round 2 onwards. The exact Round they enter is up to the player. Any Unit that has not entered the game (is In Play) by the end of Round 4 is considered to be destroyed (and may score VPs for the opponent if applicable!).<\/p>"},{"m":"i.","t":"Arriving from Reserve","p":"P58","l":2,"h":"<p>Units coming in from Reserve during Round 2 can enter the game from any point on a board edge included within the player’s own Deployment Zone(s). Units coming in from Reserve during Round 3 or 4 can enter the game from any point along the entire board edge that includes any part of the player’s Deployment Zone(s). All a player’s Units in Reserve must have arrived by the end of Round 4. Any Unit that has not arrived by then counts as destroyed (and may score VPs for the opponents). Note that not all Scenarios permit the use of Reserves<\/p>"},{"m":"ii.","t":"Moving Units onto the Table","p":"P58","l":2,"h":"<p>When they are ready to enter play, Units in reserve must be given an Advance or Sprint Action Token in the Command Phase. To move onto the table simply activate the Unit and then measure from the edge of the board onto the table as part of their Advance or Sprint action, making sure its Bases end in Coherency as normal. The Unit is now In Play.<\/p> <p>There are some additional restrictions however:<\/p> <ul> <li>A Unit must only enter from a point on a table edge that is at least 9” from any enemy Unit. Units arriving by Orbital Deployment do not have this restriction.<\/li> <li>A Unit coming onto the table in this way may Assault an enemy Unit in the same Round that it arrives, but has an additional -1 to hit modifier in the Assault. This also affects Units arriving by Orbital Deployment.<\/li> <\/ul> <p><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/reserves_1.png\"/><\/p> <p><em>The Red line shows where the Units arriving from Reserve in Round two may enter from.<\/em><\/p> <p><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/reserves_2.png\"/><\/p> <p><em>The Red line shows where the Units arriving from Reserve in Round three or later may enter from.<\/em><\/p> <p><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/reserves_3.png\"/><\/p> <p><em>The Red line shows where the Units arriving from Reserve in Round two may enter from.<\/em><\/p> <p><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/reserves_4.png\"/><\/p> <p><em>The Red line shows where the Units arriving from Reserve in Round three or later may enter from. <\/em><\/p> <p><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/reserves_5.png\"/><\/p> <p><em>The Red line shows where the Units arriving from Reserve in Round two may enter from.<\/em><\/p> <p><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/reserves_6.png\"/><\/p> <p><em>The Red line shows where the Units arriving from Reserve in Round three or later may enter from.<\/em><\/p>"},{"m":"e.","t":"Fog of war","p":"P59","l":1,"h":"<p>Once you and your opponent are familiar with the rules, you may wish to play using the “Fog of War” game mode. Instead of revealing all the Action Tokens at once, each player only flips and reveals Tokens as they activate each unit (or as an Overwatch assault reaction). This means you can keep you opponent guessing as to your plans!<\/p> <p>You can’t look at your opponent’s Tokens, but you can check your own at any time. Any remaining Overwatch Tokens are revealed all together at the end of the Movement Phase. If you are playing in an event or tournament, the event organiser will specify whether the Fog of War rule will be used.<\/p>"},{"m":"i.","t":"Fog of War and Reserves","p":"P59","l":2,"h":"<p>If you are playing the Fog of War game variant, Units in Reserve may be given an Overwatch Token as a “bluff” to fool your opponent, but then will not actually enter play that Round! In the Movement phase, you can choose to activate a Unit in Reserve so that the Unit in Reserve enters the game (unless it’s a bluff), or a Unit already In Play as normal.<\/p>"}]},{"n":15,"t":"Army Lists","s":[{"m":"","t":"","p":"","l":2,"h":"<p>Welcome to the Epic Warpath Army Lists. Whether you are coordinating an elite battle group of Asterians to patrol the Silent Lands, a headstrong company of Forge Fathers to lay claim to the mining rights on a forest moon, or a veteran platoon of Corporation Enforcers to eliminate threats to the GCPS – these lists give you all the information you need to assemble your Epic Warpath army and face your opponent across the warzones of the future.<\/p> <p>Beginning with the rules for how to construct an army for your games, each section then details the Epic Warpath factions in detail, providing the unit and model profiles for each of the available factions. Have fun… and write your own history across the planets and battlefields of the Warpath Universe!<\/p>"},{"m":"a.","t":"Building an Army","p":"P61","l":1,"h":"<p>Before a game of Epic Warpath, each player is allocated a certain number of points to spend on building their army. The number of points available might be dictated by the Scenario description, but is usually agreed with your opponent beforehand. Typical games range from 1500 to 2500 points, but smaller or larger battles are possible, if you wish.<\/p> <p>First, decide which faction you want to be. Then, create an army from your chosen Army List (you cannot mix factions), being careful not to exceed the agreed limit. The limit applies to both players, so in a 1500 point game, both players can spend a maximum of 1500 points on units. You can spend less, but not more. The Army Lists that follow contain information about each faction and the points cost for each unit.<\/p> <p>In the Army Lists, each unit has a profile entry, showing what weapon(s) they come equipped with, along with their points cost and stats. Each Army List is split into four categories:<\/p> <ul> <li><strong>Troops<\/strong>: the fighters that make up the bulk of your army<\/li> <li><strong>Specialists<\/strong>: elite units with special abilities or weaponry<\/li> <li><strong>Support<\/strong>: large vehicles, creatures or gun platforms<\/li> <li><strong>HQ<\/strong>: the generals and commanders of your army<\/li> <\/ul>"},{"m":"b.","t":"Companies","p":"P62","l":1,"h":"<p>An Epic Warpath army consists of any number of Companies. Some unit categories can only be selected in your Company by “unlocking” them with other units you have taken. Each Company has the following structure:<\/p> <ul> <li>You must take at least 1 HQ Unit and 2 Troop Units in your Company. No other Units are required to unlock these Units.<\/li> <li>Your Company may include up to 2 additional Troop Units.<\/li> <li>For every Troop unit in your Company, you may take 1 Specialist Unit.<\/li> <li>For every 2 Troop and/or Specialist units in your Company, you may take 1 Support Unit. Thus 2 Troops, or 2 Specialist, or 1 of each as a pair, will unlock a single Support Unit.<\/li> <li>You can take 1 Transport unit for any Unit in your Company that is not a Walker, Vehicle, Super-heavy or Bike Unit type. Some Command Units may also have a Transport option. Only the Unit the transport was bought for may start the game embarked in it (although they do not have to).<\/li> <\/ul> <p><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/company_structure.png\"/><\/p> <p><em>In other words, taking 1 HQ unit and 2 Troop units allows you to take up to 2 additional Troop units, up to 4 Specialist units, up to 4 Support units, plus a Transport unit for each unit that is not a Walker, Vehicle or Bike.<\/em><\/p>"},{"m":"i.","t":"Unique Units","p":"P63","l":2,"h":"<p>Units marked [U] are unique and cannot be taken more than once in an army<\/p>"},{"m":"ii.","t":"Super-heavy Units","p":"P63","l":2,"h":"<p>These titans of the battlefield can be hugely powerful and influential, but are appropriately rare and expensive. A Super-heavy Unit takes up one Support “slot” and you may only select 1 Super-heavy Unit per Company in your Army. Some Super-heavy units are Command (Super-heavy). These Units take up both an HQ and a Support slot when making a Company.<\/p>"},{"m":"iii.","t":"Command Transports","p":"P63","l":2,"h":"<p>Some entries for Command Units include the option of purchasing a single transport vehicle, called a Command Transport. These vehicles are equipped with the most advanced stealth technology and are trained to make the best use of terrain to remain undetected.<\/p> <p>Command Transports must be deployed at the same time as the Command Unit they have been purchased with, and within 3” of it (the Command Unit may also begin the game already embarked in the transport). While a Command Unit is embarked in a Command Transport, the transport Unit gets both a Sprint and an Overwatch action token. In the Round the Command Unit inside leaves the transport, it keeps any action tokens it has and can use one or both as normal.<\/p> <p>After deployment, the transport vehicle is a separate unit (with US 0) and acts as a normal Unit (with one action token if no Command Unit is onboard) for the rest of the game, with two important exceptions:<\/p> <ul> <li>Command Transports can only transport Command Units (any friendly Command Unit that fits onboard).<\/li> <li>A Command Transport cannot be targeted deliberately unless it is the closest target (even when not transporting a Command Unit).<\/li> <\/ul>"},{"m":"c.","t":"BattlefIeld Stratagems","p":"P64","l":1,"h":"<p>Battlefield Stratagems are available to purchase for any army, when selecting an army. They may represent pieces of tech, or special training, support or orders and are useful to help give armies small but useful boosts. Each Battlefield Stratagem option can only be selected in an army once. All Battlefield Stratagems are single use.<\/p>"},{"m":"i.","t":"5 pts: Quick Thinking","p":"P64","l":2,"h":"<p>Advanced AI, or just alien intuition, helps to predict enemy movements and gain the initiative. Use this Battlefield Stratagem to add +2 to the your result when rolling for Initiative in Round 1 (including when rerolling ties).<\/p>"},{"m":"ii.","t":"20 pts: Take and Hold","p":"P64","l":2,"h":"<p>Your units have orders to hold an Objective at all costs. At the end of a Round, a player with this Battlefield Stratagem may use it on a Dynamic Objective that they claimed and scored for that Round. Roll 1D8. On a 5+, the Objective will start the next Round Active, regardless of its current state.<\/p>"},{"m":"iii.","t":"30 pts: Bombardment Fire","p":"P64","l":2,"h":"<p>This is a one-off strike, called in by a commander, representing a long range or orbital missile attack. From Round 2 of a game onwards, any friendly Command Unit can use its Overwatch Action Token to call in the Bombardment instead of firing any other weapons the Unit has. Pick a point anywhere on the table and resolve an attack with the following profile.<\/p> <p>Range = Unlimited, ADice 1, AP1, Blast(4), Indirect (only), Pinning.<\/p> <p>Note that the Bombardment is always fired Indirect, so roll to see if the initial template scatters, and then place three additional templates following the normal rules.<\/p>"},{"m":"iv.","t":"X pts: Covert Intel","p":"P64","l":2,"h":"<p>Spies and scouts sent out ahead of the main army have captured vital intel that could help swing the battle in the army’s favour. There is no guarantee the intel is useful however – you will not know until your forces are in action. Select one of the following options.<\/p> <ul> <li>Spend 10pts for one intel chance<\/li> <li>Spend 25pts for two intel chances<\/li> <li>Spend 50pts for three intel chance<\/li> <\/ul> <p>Before the Recon roll, any player that has purchased this Battlefield Stratagem for one or more intel chances, now rolls to see if their intel is useful for the battle ahead. For each intel chance a player has purchased, they roll 1D8. For each 5+ they roll, they begin the game with 1VP already scored.<\/p>"},{"m":"v.","t":"X pts: Advanced Reconnaissance","p":"P64","l":2,"h":"<p>The vanguard is sent ahead to map out the terrain and track enemy movements. With the information fed back, armies have a better chance to deploy in the most efficient way.<\/p> <ul> <li>Spend 5pts for one Black Command Die<\/li> <li>Spend 10pts for one Orange Command Die<\/li> <li>Spend 15pts for one Green Command Die<\/li> <\/ul> <p>Each player can purchase as many Command Dice in this way as they wish using this Battlefield Stratagem. They are used one-time only, by adding them to the player’s Recon roll before deployment. In addition, if the player that wins the Recon roll used Advanced Reconnaissance, they add +1 to their roll for Initiative for Round 1.<\/p>"}]}]};
let rd = {ch: -1, q: ""};
const stripTags = h => h.replace(/<[^>]+>/g, " ").replace(/&nbsp;/g, " ").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&#39;|&rsquo;/g, "'").replace(/\s+/g, " ").trim();
const RCH = RULES.c.map(c => {
  if (/^keywords$/i.test(c.t)) {
    const extra = DATA.glossary.map(([n, t]) => ({m: "", t: n, p: "", l: 2, h: `<p>${esc(t.replace(/\s*\[Errata v1\.2\]$/, ""))}${/\[Errata v1\.2\]$/.test(t) ? ` <span class="e-badge">ERRATA</span>` : ""}</p>`}));
    return Object.assign({}, c, {s: [{m: "", t: "Keywords", p: "P46", l: 1, h: "<p>Every keyword in the game. Entries marked ERRATA are updated by FAQ &amp; Errata v1.2.</p>"}].concat(extra)});
  }
  return c;
});
RCH.forEach(c => c.s.forEach(s => { s.x = (s.t + " " + stripTags(s.h)).toLowerCase(); }));

function openRules(ch, si) {
  if (ch !== undefined) { rd.ch = ch; rd.q = ""; }
  renderReader();
  $("#reader").classList.add("open");
  document.body.classList.add("noscroll");
  if (si !== undefined) setTimeout(() => goSection(si), 30);
}
function closeRules() { $("#reader").classList.remove("open"); document.body.classList.remove("noscroll"); }

function goSection(si) {
  const el = document.getElementById("rs-" + rd.ch + "-" + si);
  if (!el) return;
  el.scrollIntoView({block: "start"});
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
}

function secHead(s, ci, si) {
  const tag = s.l === 1 ? "h3" : "h4";
  if (!s.t) return "";
  return `<${tag}>${s.m ? `<span class="rm">${esc(s.m)}</span>` : ""}${esc(s.t)}${s.p ? `<span class="rp">${esc(s.p.replace(/^P/, "p."))}</span>` : ""}</${tag}>`;
}

function renderReader() {
  const q = rd.q.trim().toLowerCase();
  let nav = `<button class="rn ${q ? "" : ""}" data-rch="-1" ${!q && rd.ch === -1 ? 'aria-current="true"' : ""}>Contents</button>` + RCH.map((c, i) => `<button class="rn" data-rch="${i}" ${!q && rd.ch === i ? 'aria-current="true"' : ""}><span>${i + 1}</span>${esc(c.t)}</button>`).join("");
  let main = "";
  if (q) {
    const terms = q.split(/\s+/).filter(Boolean);
    const hits = [];
    RCH.forEach((c, ci) => c.s.forEach((s, si) => { if (terms.every(t => s.x.includes(t))) hits.push({ci, si, s, c}); }));
    main = `<h2>${hits.length} result${hits.length === 1 ? "" : "s"} for “${esc(rd.q)}”</h2>`;
    main += hits.slice(0, 80).map(({ci, si, s, c}) => {
      const txt = stripTags(s.h);
      const i = txt.toLowerCase().indexOf(terms[0]);
      const a = Math.max(0, i - 70), snip = (a ? "…" : "") + txt.slice(a, a + 200) + (txt.length > a + 200 ? "…" : "");
      let hs = esc(snip);
      terms.forEach(t => { hs = hs.replace(new RegExp("(" + t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig"), "<mark>$1</mark>"); });
      return `<button class="rhit" data-go="${ci}:${si}"><small>${esc(c.t)}${s.p ? " · " + esc(s.p.replace(/^P/, "p.")) : ""}</small><b>${esc(s.t || c.t)}</b><span>${hs}</span></button>`;
    }).join("") || `<p class="hint">Nothing found. Try a single word like “pinned” or “assault”.</p>`;
  } else if (rd.ch < 0 || rd.ch >= RCH.length) {
    main = `<h2>${esc(RULES.v || "Epic Warpath Rules")}</h2><p class="hint">From the Mantic Companion online rules, with FAQ &amp; Errata v1.2 keyword changes. Tap a chapter or search above.</p><div class="rtoc">` +
      RCH.map((c, i) => `<button class="rtc" data-rch="${i}"><span>${i + 1}</span><b>${esc(c.t)}</b><small>${c.s.filter(s => s.t && s.l === 1).length || c.s.length} sections</small></button>`).join("") + `</div>`;
  } else {
    const c = RCH[rd.ch];
    const toc = c.s.map((s, si) => s.t && s.l === 1 ? `<button class="rt" data-go="${rd.ch}:${si}">${esc(s.t)}</button>` : "").join("");
    main = `<div class="rchead"><small>Chapter ${rd.ch + 1}</small><h2>${esc(c.t)}</h2>${toc ? `<div class="rtocs">${toc}</div>` : ""}</div>`;
    main += c.s.map((s, si) => `<section class="rs lvl${s.l}" id="rs-${rd.ch}-${si}">${secHead(s, rd.ch, si)}<div class="rbody">${s.h}</div></section>`).join("");
    main += `<div class="rpager">${rd.ch > 0 ? `<button class="tbtn" data-rch="${rd.ch - 1}">‹ ${esc(RCH[rd.ch - 1].t)}</button>` : "<span></span>"}${rd.ch < RCH.length - 1 ? `<button class="tbtn" data-rch="${rd.ch + 1}">${esc(RCH[rd.ch + 1].t)} ›</button>` : ""}</div>`;
  }
  $("#rdNav").innerHTML = nav;
  $("#rdMain").innerHTML = main;
  $("#rdChSel").innerHTML = `<option value="-1">Contents</option>` + RCH.map((c, i) => `<option value="${i}" ${!q && rd.ch === i ? "selected" : ""}>${i + 1}. ${esc(c.t)}</option>`).join("");
  $("#rdMain").querySelectorAll("img").forEach(im => im.addEventListener("error", () => im.remove()));
}

$("#reader").addEventListener("click", e => {
  const t = e.target.closest("[data-rch],[data-go],[data-rclose]");
  if (!t) return;
  if (t.dataset.rclose !== undefined) { closeRules(); return; }
  if (t.dataset.rch !== undefined) { rd.ch = +t.dataset.rch; rd.q = ""; $("#rdSearch").value = ""; renderReader(); $("#rdMain").scrollTop = 0; return; }
  if (t.dataset.go) { const [ci, si] = t.dataset.go.split(":").map(Number); rd.ch = ci; rd.q = ""; $("#rdSearch").value = ""; renderReader(); setTimeout(() => goSection(si), 20); }
});
$("#rdSearch").addEventListener("input", e => { rd.q = e.target.value; renderReader(); $("#rdMain").scrollTop = 0; });
$("#rdChSel").addEventListener("change", e => { rd.ch = +e.target.value; rd.q = ""; $("#rdSearch").value = ""; renderReader(); $("#rdMain").scrollTop = 0; });
$("#btnRules").onclick = () => openRules();
$("#rdPrint").onclick = () => { closeRules(); runPrint({ref: 1}); };
document.querySelector("#tabs [data-rules]").onclick = () => openRules();

window.addEventListener("keydown", e => { if (R3.el && R3.el.classList.contains("open") && (e.key === "r" || e.key === "R") && R3.el.querySelector(".r3-bar.on")) { e.preventDefault(); R3.el.querySelector(".r3-again").click(); return; } if (R3.el && R3.el.classList.contains("open") && (e.key === "Enter" || e.key === "Escape") && R3.el.querySelector(".r3-bar.on")) { e.preventDefault(); closeRoll3D(); return; } if (R3.el && R3.el.classList.contains("open") && e.key === " ") { R3.skip = true; e.preventDefault(); return; } if (e.key === "Escape" && $("#reader").classList.contains("open")) { closeRules(); return; } if (e.key === "Escape") { hidePop(); document.querySelectorAll(".overlay").forEach(o => o.remove()); } });

load();
if (cur) render(); else { cur = newList("asterians"); render(); start(); }
</script>
</body>
</html>

    <div class="side-sec"><h3>Army Special Rule</h3>${f.rules.map(([n, t, er]) => `<p style="margin:0;font-size:13px"><b>${esc(n)}:</b> ${esc(t)}${er ? ` <span class="e-badge" title="${esc(er)}">ERRATA</span>` : ""}</p>`).join("")}</div>
    <div class="side-sec"><h3>Strategic Orders</h3>${f.orders.map(([n, c, w, e, er]) => `<div class="order"><span class="cost">${esc(c)} CP</span><b>${esc(n)}</b>${er ? ` <span class="e-badge">ERRATA</span>` : ""}<div class="when">${esc(w)}</div><div>${esc(e)}</div></div>`).join("")}</div>
    <div class="side-sec"><h3>Keywords in this list</h3>${usedGlossary().map(([n, t]) => `<details class="gl"><summary>${esc(n)}</summary><p>${esc(t)}</p></details>`).join("") || `<span class="hint">Add units to see the keywords you'll need.</span>`}</div>
  </div>`;
  $("#colInfo").innerHTML = h;
}

function usedGlossary() {
  const set = new Map();
  cur.companies.forEach(co => co.units.forEach(e => {
    const u = unitOf(e);
    if (!u) return;
    const all = [...u.k];
    u.w.forEach(w => w[4] && w[4].split(/,\s*(?![^()]*\))/).forEach(x => all.push(x.trim())));
    all.forEach(k => { const g = glossFor(k); if (g) set.set(g[0], g); });
  }));
  return [...set.values()].sort((a, b) => a[0].localeCompare(b[0]));
}

function addUnit(key) {
  const co = cur.companies[activeCompany];
  const u = UNIT[cur.faction + ":" + key];
  if (!u || whyNot(u, co)) return;
  co.units.push({id: uidGen(), key, ct: 0});
  save(); render();
  toast("Added " + u.n + " (" + u.p + " pts)");
}

document.addEventListener("click", e => {
  const kw = e.target.closest("[data-kw]");
  if (kw) { showPop(kw); e.stopPropagation(); return; }
  hidePop();
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const a = t.dataset.act;
  const ci = +t.dataset.ci, i = +t.dataset.i;
  if (a === "add") addUnit(t.dataset.key);
  else if (a === "toggle") { const k = t.dataset.ck; openCards.has(k) ? openCards.delete(k) : openCards.add(k); render(); }
  else if (a === "activate") { if (e.target.closest("button")) return; activeCompany = ci; render(); }
  else if (a === "delco") {
    if (cur.companies[ci].units.length && !confirm("Remove Company " + (ci + 1) + " and its units?")) return;
    cur.companies.splice(ci, 1); activeCompany = Math.min(activeCompany, cur.companies.length - 1); save(); render();
  }
  else if (a === "addco") { cur.companies.push({id: uidGen(), units: []}); activeCompany = cur.companies.length - 1; save(); render(); }
  else if (a === "clear") { if (confirm("Remove every unit from this list?")) { cur.companies = [{id: uidGen(), units: []}]; activeCompany = 0; save(); render(); } }
  else if (a === "del") { cur.companies[ci].units.splice(i, 1); save(); render(); }
  else if (a === "dup") {
    const e2 = cur.companies[ci].units[i];
    const u = unitOf(e2);
    const why = whyNot(u, cur.companies[ci]);
    if (why) { toast("Can't add another: " + why); return; }
    cur.companies[ci].units.push({id: uidGen(), key: e2.key, ct: e2.ct}); save(); render();
  }
  else if (a === "goadd") { tab = "add"; render(); window.scrollTo(0, 0); }
  else if (a === "recon") { const c = t.dataset.c; cur.strat.recon[c] = Math.max(0, (cur.strat.recon[c] || 0) + +t.dataset.d); save(); render(); }
});

document.addEventListener("change", e => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const a = t.dataset.act;
  if (a === "ct") { cur.companies[+t.dataset.ci].units[+t.dataset.i].ct = t.checked ? 1 : 0; save(); render(); }
  else if (a === "move") {
    const from = +t.dataset.ci, to = +t.value;
    const [x] = cur.companies[from].units.splice(+t.dataset.i, 1);
    cur.companies[to].units.push(x); save(); render();
  }
  else if (a === "strat") { cur.strat[t.dataset.id] = t.checked ? 1 : 0; save(); render(); }
  else if (a === "intel") { cur.strat.intel = +t.value; save(); render(); }
});

let popEl = null;
function showPop(el) {
  hidePop();
  const g = glossFor(el.dataset.kw);
  if (!g) return;
  popEl = document.createElement("div");
  popEl.className = "pop";
  popEl.innerHTML = `<b>${esc(g[0])}</b>${esc(g[1])}`;
  document.body.appendChild(popEl);
  const r = el.getBoundingClientRect();
  const w = Math.min(340, window.innerWidth - 24);
  popEl.style.width = w + "px";
  let left = Math.min(Math.max(12, r.left), window.innerWidth - w - 12);
  let top = r.bottom + 6;
  if (top + popEl.offsetHeight > window.innerHeight - 10) top = Math.max(10, r.top - popEl.offsetHeight - 6);
  popEl.style.left = left + "px";
  popEl.style.top = top + "px";
}
function hidePop() { if (popEl) { popEl.remove(); popEl = null; } }
window.addEventListener("scroll", hidePop, {passive: true});

function toast(msg) {
  document.querySelectorAll(".toast").forEach(x => x.remove());
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1800);
}

function openLists() {
  const body = () => `<button class="tbtn primary" data-new style="margin-bottom:12px">+ New list</button>
    ${lists.map(l => `<div class="lrow ${l === cur ? "cur" : ""}"><div class="nm" data-open="${l.id}"><b>${esc(l.name)}</b><small>${esc(FAC[l.faction] ? FAC[l.faction].n : "?")} · ${listPts(l)} / ${l.limit} pts · ${new Date(l.updated).toLocaleDateString()}</small></div>

  const wire = () => {

    o.querySelectorAll("[data-open]").forEach(b => b.onclick = () => { cur = lists.find(l => l.id === b.dataset.open); activeCompany = 0; openCards.clear(); save(); render(); o.remove(); });
    o.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => { const src = lists.find(l => l.id === b.dataset.copy); const c = JSON.parse(JSON.stringify(src)); c.id = uidGen(); c.name += " (copy)"; lists.unshift(c); save(); refresh(); });
    o.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => {
      const l = lists.find(x => x.id === b.dataset.rm);

      if (l === cur) { cur = lists[0] || null; if (!cur) { o.remove(); store(false, LS_KEY, JSON.stringify(lists)); start(); return; } }
      save(); render(); refresh();
    });
    o.querySelector("[data-import]").onclick = () => {
      const inp = document.createElement("input");
      inp.type = "file"; inp.accept = ".json,application/json";

        const fr = new FileReader();
        fr.onload = () => {
          try {
            const l = sanitize(JSON.parse(fr.result));

            lists.unshift(l); cur = l; activeCompany = 0; save(); render(); o.remove(); toast("List imported");
          } catch (err) { alert("That file isn't a valid army list."); }
        };
        fr.readAsText(inp.files[0]);
      };
      inp.click();
    };
  };
  const refresh = () => { o.querySelector(".mbody").innerHTML = body(); wire(); };
  wire();
}

function listPts(l) {
  const keep = cur;
  cur = l;
  const p = totalPts();
  cur = keep;
  return p;
}

function sanitize(l) {
  if (!l || !FAC[l.faction] || !Array.isArray(l.companies)) return null;
  const n = newList(l.faction);
  n.name = String(l.name || n.name).slice(0, 80);
  n.limit = Math.max(0, parseInt(l.limit) || 2000);
  n.companies = l.companies.map(c => ({id: uidGen(), units: (c.units || []).filter(e => UNIT[l.faction + ":" + e.key]).map(e => ({id: uidGen(), key: e.key, ct: e.ct ? 1 : 0}))}));
  if (!n.companies.length) n.companies = [{id: uidGen(), units: []}];
  if (l.strat) {
    n.strat.quick = l.strat.quick ? 1 : 0; n.strat.hold = l.strat.hold ? 1 : 0; n.strat.bombard = l.strat.bombard ? 1 : 0;
    n.strat.intel = [0, 1, 2, 3].includes(+l.strat.intel) ? +l.strat.intel : 0;
    ["Black", "Orange", "Green"].forEach(c => n.strat.recon[c] = Math.max(0, parseInt(l.strat.recon && l.strat.recon[c]) || 0));
  }
  return n;
}

function textExport() {
  const f = fac();
  const t = totals();
  const L = [];
  L.push(cur.name);
  L.push(f.n + " · " + totalPts() + " / " + cur.limit + " pts · Nerve " + f.nerve + " · " + t.units + " units · US " + t.us);
  const iss = issues();
  if (iss.length) L.push("INVALID: " + iss.join(" "));
  cur.companies.forEach((co, ci) => {
    L.push("");
    L.push("== Company " + (ci + 1) + " (" + companyPts(co) + " pts) ==");
    co.units.map(e => ({e, u: unitOf(e)})).filter(x => x.u).sort((a, b) => sortKey(a.u) - sortKey(b.u)).forEach(({e, u}) => {
      L.push("- " + u.n + " (" + u.b + ") [" + u.c + "] " + u.p + " pts" + (e.ct && u.ct ? " + " + u.ct.name + " Command Transport (" + u.ct.p + ")" : ""));
    });
  });
  const s = cur.strat;
  const st = [];
  if (s.quick) st.push("Quick Thinking (5)");
  if (s.hold) st.push("Take and Hold (20)");
  if (s.bombard) st.push("Bombardment Fire (30)");
  if (s.intel) st.push("Covert Intel x" + s.intel);
  const rc = Object.entries(s.recon).filter(([, n]) => n).map(([c, n]) => n + " " + c);
  if (rc.length) st.push("Advanced Recon: " + rc.join(", "));
  if (st.length) { L.push(""); L.push("Stratagems: " + st.join(", ") + " (" + stratPts() + " pts)"); }
  const dz = Object.entries(t.dice).filter(([, n]) => n).map(([c, n]) => n + " " + c);
  if (dz.length) L.push("Tactician dice: " + dz.join(", "));
  return L.join("\n");
}

function copy(txt, msg) {
  const done = () => toast(msg);
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, () => fallbackCopy(txt, done));
  else fallbackCopy(txt, done);
}
function fallbackCopy(txt, done) {
  const ta = document.createElement("textarea");
  ta.value = txt; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch (e) {}
  ta.remove();
}

function encodeShare(l) {
  const o = {f: l.faction, n: l.name, l: l.limit, c: l.companies.map(c => c.units.map(e => e.ct ? [e.key, 1] : e.key)), s: l.strat};
  const bytes = new TextEncoder().encode(JSON.stringify(o));
  let bin = "";
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function decodeShare(s) {
  try {
    const bin = atob(s.replace(/-/g, "+").replace(/_/g, "/"));
    const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    const o = JSON.parse(new TextDecoder().decode(bytes));
    return sanitize({faction: o.f, name: o.n, limit: o.l, companies: (o.c || []).map(c => ({units: c.map(x => Array.isArray(x) ? {key: x[0], ct: x[1]} : {key: x})})), strat: o.s});
  } catch (e) { return null; }
}

function stratCards() {
  const st = cur.strat, out = [];
  DATA.stratagems.forEach(x => {
    if (x.p && st[x.id]) out.push({n: x.n, c: String(x.p), e: x.d});

    if (x.dice) { const parts = x.dice.filter(([c]) => st.recon[c]); if (parts.length) out.push({n: x.n, c: String(parts.reduce((a, [c, v]) => a + st.recon[c] * v, 0)), e: parts.map(([c]) => st.recon[c] + " " + c).join(", ") + " Command Dice. " + x.d}); }
  });
  return out;
}

function unitCardList(perUnit) {
  const items = [];
  const seen = new Map();
  cur.companies.forEach(co => co.units.forEach(e => {
    const u = unitOf(e);
    if (!u) return;
    if (perUnit) { items.push({u, e, n: 1}); return; }
    const k = u.id + (e.ct ? "+ct" : "");
    if (seen.has(k)) seen.get(k).n++; else { const it = {u, e, n: 1}; seen.set(k, it); items.push(it); }
  }));
  items.sort((a, b) => sortKey(a.u) - sortKey(b.u));
  return items;
}

  <section><h4>1. Command Phase</h4><ol><li><b>Roll Command Points:</b> 3 Black + Tactician dice of Units In Play. Re-roll one die per Command Unit In Play. Swords = CP; unspent CP are lost at the end of the Round.</li><li><b>Mandatory Tokens</b> (face up): Engaged Units get a Combat Token. Unengaged Pinned Units get an Advance Token (Pinned and Engaged: none). Unpinned, unengaged Command Units get Sprint + Overwatch.</li><li><b>Hidden Tokens:</b> all other Units (and Reserves arriving) get one token face down. Transported Units share their transport's token.</li><li><b>Initiative:</b> both roll D8. Round 1 re-roll ties; later ties go to the player who didn't have it last Round.</li><li><b>Reveal</b> tokens. Forgotten Units get a Combat Token.</li></ol></section>

  <section><h4>Tactical Orders (any Unit)</h4><table><tr><td>1 CP</td><td><b>Keep Going!</b> After a Unit completes its action: activate another Unit. Not on the first activation of a Phase; once before your opponent's next turn.</td></tr><tr><td>1 CP</td><td><b>Fight On!</b> After rolling to hit or damage: re-roll up to 2 failed dice, once per roll per target.</td></tr><tr><td>1+ CP</td><td><b>Courage!</b> End Phase, before Pin rolls: remove 1 Pin marker per CP.</td></tr></table><p>Strategic Orders: Unit must be within Command Radius of a Command Unit; one per activation; declare before rolling.</p></section>
  <section><h4>2. Movement Phase</h4><p>Spend Advance/Sprint tokens. Must Sprint to engage in Assault. After moving, swap the token for a Combat Token as appropriate. Overwatch Units may fire at Units assaulting them.</p><p><b>Coherency:</b> each Base within 1" of another Base of the Unit (unbroken chain) and within 6" of all of them.</p><p><b>Interpenetration:</b> can't come within 1" of enemies unless assaulting them. May move through unengaged friendly Units, ending 1" away.</p></section>
  <section><h4>3. Overwatch Phase – Shooting</h4><ol><li>Nominate a target (Command Units only if the closest viable target, unless Super-heavy). No shooting into or out of Assaults.</li><li>Check range &amp; LOS per Base; In Cover?</li><li>Dice = eligible firing Bases × ADice.</li><li>Roll to hit vs <b>SH</b>.</li><li>Roll to damage vs target <b>AR</b> (+AP).</li><li>Saves (SV), then remove 1 Base per damage.</li></ol><table><tr><td>-1</td><td>Target In Cover</td></tr><tr><td>-2</td><td>Target has Fly (-1 vs Super-heavy)</td></tr><tr><td>-1</td><td>Target is Stealthy</td></tr><tr><td>-1</td><td>Shooter has a Pin marker</td></tr></table></section>
  <section><h4>Blast Weapons</h4><ol><li>Place first template.</li><li>Indirect: roll Targeting Die for scatter.</li><li>Extra templates (Blast n) placed with the Targeting Die.</li><li>To hit: SH, or 5+ Indirect (Indirect ignores cover unless the target is in a building).</li><li>Damage, then remove casualties.</li></ol><p>Targeting Die: 3 On Target faces; 3, 3, 4, 5, 6" scatter in the arrow's direction.</p></section>
  <section><h4>4. Combat Phase – Assault</h4><p>Spend Combat Tokens to shoot or resolve an Assault. All engaged Units fight; Bases in contact and friends within 1" of them attack. All attacks are simultaneous.</p><ol><li>Allocate attacks, roll to hit vs <b>AS</b>, damage vs <b>AR</b>.</li><li>Remove casualties.</li><li>Winner killed most Bases. Loser takes a Nerve test per Base of difference; lose one more Base per fail.</li><li>Tidy up: separate from Vehicles/Super-heavies; still in contact: pile in; otherwise consolidate 3" (winner may pile in). Remove Combat Tokens.</li></ol><table><tr><td>-1</td><td>Combat (-1) token</td></tr><tr><td>-1</td><td>Pin marker</td></tr><tr><td>-1</td><td>Arrived from Reserve this Round</td></tr><tr><td>-1</td><td>Disembarked into Assault this Round</td></tr><tr><td>+1</td><td>Infantry/Heavy Infantry vs APCs (+AP1)</td></tr></table></section>
  <section><h4>Pinning</h4><p>Pinned: -1 to hit (shooting and assault); US 2+ counts as 1. Gain a Pin marker when a Unit:</p><ul><li>loses half or more of its Bases to one shooting attack;</li><li>loses an Assault;</li><li>is hit by a Pinning weapon (even with no casualties);</li><li>survives a destroyed transport.</li></ul></section>
  <section><h4>5. End Phase</h4><ol><li>Trigger End Phase rules (flip Dynamic Objectives).</li><li>Roll to remove Pin markers.</li><li>Check victory conditions / score VPs.</li><li>Remove other markers and tokens.</li></ol></section>
  <section><h4>Dice &amp; Key Keywords</h4><p><b>Exploding 8s</b> (Sustained Attack to hit, Vicious to damage): each natural 8 that succeeds rolls a bonus die.</p><p><b>Heavy Armour:</b> weapons without AP halve their damage dice (round up). <b>APn:</b> +n to damage rolls. <b>Stealthy:</b> -1 to be shot. <b>Unflinching:</b> never Pinned. <b>Resilience (n):</b> n shield tokens that negate damage.</p></section>

  </div><div class="qr-foot">Unofficial summary for quick reference – see the Epic Warpath Rulebook for full rules. Epic Warpath © Mantic Games.</div></div>`;
}

function fitCards(root) {
  root.querySelectorAll(".tc").forEach(card => {
    const nm = card.querySelector(".tc-name");
    if (nm) { let ns = parseFloat(getComputedStyle(nm).fontSize); const lh = () => parseFloat(getComputedStyle(nm).lineHeight) || ns * 1.05; while (nm.scrollHeight > lh() * 2.2 && ns > 8) { ns -= 0.5; nm.style.fontSize = ns + "px"; } }
    const body = card.querySelector(".tc-body");
    if (!body) return;
    const fits = () => body.scrollHeight <= body.clientHeight + 1;
    const tryRange = (hi, lo) => { for (let fs = hi; fs >= lo; fs -= 0.25) { card.style.setProperty("--fs", fs + "pt"); if (fits()) return true; } return false; };
    const art = card.querySelector(".tc-art");
    if (card.classList.contains("cmd")) { if (tryRange(11, 4.75)) return; card.classList.add("overflow"); return; }
    if (tryRange(11, 7)) return;
    if (art) { art.classList.add("short"); if (tryRange(9, 6)) return; art.remove(); }
    if (tryRange(9, 5.5)) return;
    card.classList.add("overflow");
  });
}

function buildPrint(o) {
  cardMode = (o.cardStyle === "pf" ? "pf" : "") + (o.bw ? " bw" : "");
  const parts = [];
  if (o.roster && (o.rHead || o.rRoster || o.rProfiles || o.rRules || o.rOrders || o.rKeywords || o.tactical)) parts.push(`<div class="pr-sec">${rosterHtml(o)}</div>`);
  if (o.units) {
    const cards = [];
    unitCardList(o.perUnit).forEach(({u, e, n}) => cards.push({u, e, n}));
    parts.push(`<div class="pr-sec cards" data-kind="units">${pages(cards.map(({u, e, n}) => unitCardHtml(u, e, n, 0)))}</div>`);
  }
  if (o.cmds) {
    const cards = fac().orders.map(([n, c, w, e]) => orderCardHtml("s", {n, c, w, e}));
    if (o.tactical) TACTICAL.forEach(t => cards.push(orderCardHtml("t", t)));
    stratCards().forEach(sc => cards.push(orderCardHtml("b", sc)));
    parts.push(`<div class="pr-sec cards">${pages(cards)}</div>`);
  }
  if (o.ref) parts.push(`<div class="pr-sec">${quickRefHtml()}</div>`);
  return parts;
}

async function runPrint(o) {
  const area = $("#printArea");
  area.innerHTML = buildPrint(o).join("");
  area.classList.add("measuring");
  fitCards(area);
  if (o.units) {
    const unitSec = area.querySelector('.pr-sec[data-kind="units"]');
    const items = unitCardList(o.perUnit);
    const cards = [...unitSec.querySelectorAll(".tc")];
    if (cards.some(c => c.classList.contains("overflow"))) {
      const html = [];
      items.forEach(({u, e, n}, i) => {
        if (cards[i] && cards[i].classList.contains("overflow") && u.r) { html.push(unitCardHtml(u, e, n, 1)); html.push(unitCardHtml(u, e, n, 2)); }
        else html.push(cards[i] ? cards[i].outerHTML : unitCardHtml(u, e, n, 0));
      });
      unitSec.innerHTML = pages(html);
      fitCards(unitSec);
    }
  }
  area.classList.remove("measuring");
  const imgs = [...area.querySelectorAll("img")];
  await Promise.race([Promise.all(imgs.map(im => im.complete ? 1 : new Promise(r => { im.onload = im.onerror = r; }))), new Promise(r => setTimeout(r, 4000))]);
  window.print();
}

  h += `<!--S:keywords--><h2>Keywords Used</h2><div class="pr-kw">${usedGlossary().map(([n, x]) => `<div><b>${esc(n)}:</b> ${esc(x)}</div>`).join("")}</div>`;
  h += `<!--S:foot--><div class="pr-foot">Full rules: Epic Warpath Rulebook PDF ${RULES_URL} · Free online rules ${COMPANION_URL}</div>`;
  h += `<div class="pr-foot">Epic Warpath Army Builder · Created by Ian McGonigal · Rules © Mantic Games, FAQ &amp; Errata v1.2 applied</div></div>`;
  const on = {head: opts.rHead, roster: opts.rRoster, profiles: opts.rProfiles, rules: opts.rRules, orders: opts.rOrders, tactical: opts.tactical, keywords: opts.rKeywords, foot: 1};
  const parts = h.split(/<!--S:(\w+)-->/);
  let out = parts[0];
  for (let i = 1; i < parts.length; i += 2) if (on[parts[i]]) out += parts[i + 1];
  if (!on.rules) out = out.replace(/<h3>(Strategic Orders|Tactical Orders[^<]*)<\/h3>/, "<h2>$1</h2>");
  return out;
}

const DEFAULT_FACES = {Black: [0, 0, 1, 1, 1, 2], Orange: [0, 1, 1, 1, 2, 2], Green: [1, 1, 2, 2, 2, 3]};
let dice = {n: 6, need: 5, explode: false, last: null, cmd: {Black: 3, Orange: 0, Green: 0}, rolled: [], rerolls: 0, spent: 0, tgt: null, faces: JSON.parse(JSON.stringify(DEFAULT_FACES))};
try { const sd = JSON.parse(store(true, "ewp_dice_v2") || "null"); if (sd) dice = Object.assign(dice, sd, {last: null, rolled: [], tgt: null, explode: false}); } catch (e) {}

if (dice.sound === undefined) dice.sound = true;

const d = n => 1 + Math.floor(crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296 * n);

function armyDice() {
  const t = cur ? totals() : {dice: {Black: 0, Orange: 0, Green: 0}};
  const cmdUnits = cur ? cur.companies.reduce((a, co) => a + co.units.filter(e => unitOf(e) && isCommand(unitOf(e))).length, 0) : 0;
  return {Black: 3 + t.dice.Black, Orange: t.dice.Orange, Green: t.dice.Green, cmdUnits};
}

function rollD8() {
  const base = [];
  for (let i = 0; i < dice.n; i++) base.push(d(8));
  const bonus = [];
  if (dice.explode) {
    let pending = base.filter(v => v === 8 && v >= dice.need).length;
    let guard = 0;
    while (pending && guard++ < 200) {
      const r = d(8);
      bonus.push(r);
      pending--;
      if (r === 8) pending++;
    }
  }
  dice.last = {base, bonus, need: dice.need, explode: dice.explode};
}

function rerollFails() {
  if (!dice.last) return [];
  const fresh = [];
  dice.last.base = dice.last.base.map(v => { if (v >= dice.last.need) return v; const r = d(8); fresh.push(r); return r; });
  const bonus = [];
  if (dice.last.explode) {
    let pending = dice.last.base.filter(v => v === 8).length;
    let guard = 0;
    while (pending && guard++ < 200) { const r = d(8); bonus.push(r); pending--; if (r === 8) pending++; }
  }
  dice.last.bonus = bonus;
  return fresh;
}

function cmdRoll(c) { const i = d(6) - 1; return {i, v: dice.faces[c][i]}; }

function rollTgt() {
  const f = d(8), rot = d(179) * (d(2) === 1 ? 1 : -1), spin = (rot >= 0 ? 1 : -1) * (360 + d(180));
  dice.tgt = f <= 3 ? {hit: 1, n: Date.now(), rot: rot} : {hit: 0, dist: [3, 3, 4, 5, 6][f - 4], rot: rot, spin: spin, n: Date.now()};
}

function rollCmd() {
  dice.rolled = [];
  ["Black", "Orange", "Green"].forEach(c => { for (let i = 0; i < (dice.cmd[c] || 0); i++) dice.rolled.push(Object.assign({c, rr: 0}, cmdRoll(c))); });
  dice.rerolls = armyDice().cmdUnits;
}

function rollScenario() {
  const v = [d(8), d(8), d(8), d(8)];
  scn = {v, t: Date.now(), corners: d(2) === 1 ? "top-left & bottom-right" : "top-right & bottom-left", edge: ["North (top)", "East (right)", "South (bottom)", "West (left)"][d(4) - 1], r6: null, recon: null};
  saveScn();
}

function scnExtra(i) {
  const k = Math.ceil(scn.v[i] / 2) - 1;
  if (i === 0 && k === 2) return `Random roll: the deployment corners are <b>${scn.corners}</b> (as seen from your side of the table).`;
  if (i === 1 && k === 3) return `Random roll: the Static Objective line runs from the <b>${scn.edge}</b> table edge through the centre.`;
  return "";
}

function logEntry(kind) {
  const e = {id: uidGen(), t: Date.now(), kind};
  if (kind === "d8" || kind === "refail") {
    const L = dice.last;
    const hits = L.base.filter(v => v >= L.need).length + L.bonus.filter(v => v >= L.need).length;
    e.title = (kind === "refail" ? "Re-rolled misses · " : "") + L.base.length + "D8 · need " + L.need + "+";
    e.total = hits + " success" + (hits === 1 ? "" : "es");
    e.chips = [...L.base].sort((a, b) => b - a).map(v => ({v, hit: v >= L.need ? 1 : 0})).concat(L.bonus.map(v => ({v, hit: v >= L.need ? 1 : 0, bonus: 1})));
  } else if (kind === "cmd") {
    e.title = "Command Dice";
    fillCmd(e);
    dice.cmdLogId = e.id;
  } else if (kind === "scn") {
    e.title = "Scenario";
    e.chips = scn.v.map(v => ({v, hit: 0}));
    e.total = SCN.map((p, i) => p.n.split(" ")[0][0] + scn.v[i]).join(" ");
    e.scn = 1;
  } else if (kind === "r6") {
    e.title = "Round 6?";
    e.chips = [{v: scn.r6, hit: scn.r6 >= 5 ? 1 : 0}];
    e.total = scn.r6 >= 5 ? "Play Round 6" : "Game ends";
  } else if (kind === "recon") {
    e.title = "Recon Roll";
    e.cmd = scn.recon.dice.map(x => ({c: x.c, v: x.v, rr: 0}));
    e.total = scn.recon.total + " total";
  } else if (kind === "tgt") {
    const T = dice.tgt;
    e.title = "Targeting Die";
    e.total = T.hit ? "On Target" : 'Scatter ' + T.dist + '"';
    e.tgt = T.hit ? {hit: 1} : {dist: T.dist, rot: T.rot};
  }
  dlog.unshift(e);
  dlog = dlog.slice(0, 60);
  saveLog();
}

function fillCmd(e) {
  const cp = dice.rolled.reduce((a, x) => a + x.v, 0);
  e.total = cp + " CP";
  e.cmd = dice.rolled.map(x => ({c: x.c, v: x.v, rr: x.rr ? 1 : 0}));
  e.rerolls = dice.rerolls;
}

function updateCmdLog() {
  const e = dlog.find(x => x.id === dice.cmdLogId);
  if (e) { fillCmd(e); saveLog(); }
}

function rerollCmdDie(i) {
  const x = dice.rolled[i];
  if (!x || !dice.rerolls) return null;
  Object.assign(x, cmdRoll(x.c));
  x.rr = 1;
  dice.rerolls--;
  updateCmdLog();
  return x;
}

function doRoll(kind, arg) {
  if (kind === "d8") { rollD8(); logEntry("d8"); }
  else if (kind === "refail") { const fr = rerollFails(); logEntry("refail"); arg = fr; }
  else if (kind === "cmd") { rollCmd(); logEntry("cmd"); }
  else if (kind === "cmdOne") { if (!rerollCmdDie(arg)) { toast("No re-rolls left"); return; } }
  else if (kind === "tgt") { rollTgt(); logEntry("tgt"); }
  else if (kind === "scn") { rollScenario(); logEntry("scn"); }
  else if (kind === "r6") { if (!scn) return; rollR6(); logEntry("r6"); }
  else if (kind === "recon") { if (!scn) return; rollRecon(); logEntry("recon"); }
  saveDice(); renderDice();
  play3D(kind, arg);
}

function rollAgain(kind) {
  doRoll(kind === "refail" ? "d8" : kind === "cmdOne" ? "cmd" : kind);
}

  if (b.dataset.lcr !== undefined) { doRoll("cmdOne", +b.dataset.lcr); return; }
  if (b.dataset.dn) dice.n = +b.dataset.dn;
  else if (b.dataset.dstep) dice.n = Math.max(1, Math.min(60, dice.n + +b.dataset.dstep));
  else if (b.dataset.need) dice.need = +b.dataset.need;
  else if (b.dataset.cstep) { const c = b.dataset.cstep; dice.cmd[c] = Math.max(0, Math.min(20, (dice.cmd[c] || 0) + +b.dataset.d)); }
  else if (b.dataset.roll) {
    const r = b.dataset.roll;
    if (["d8", "refail", "cmd", "tgt", "scn", "r6", "recon"].includes(r)) { doRoll(r); return; }
    if (r === "fromarmy") { const a = armyDice(); dice.cmd = {Black: a.Black, Orange: a.Orange, Green: a.Green}; }

    else if (r === "clearlog") { if (!confirm("Clear the roll log?")) return; dlog = []; dice.cmdLogId = null; saveLog(); }

  saveDice(); renderDice();
});

function loadThree() {
  if (window.THREE) return Promise.resolve(window.THREE);
  if (R3.ready) return R3.ready;
  R3.ready = new Promise((res, rej) => {
    const sc = document.createElement("script");

function sfx() {
  if (!dice.sound) return null;
  try {
    if (!R3.ctx) R3.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (R3.ctx.state === "suspended") R3.ctx.resume();
    return R3.ctx;
  } catch (e) { return null; }
}

function noiseBuf(ac, len) {
  const b = ac.createBuffer(1, Math.floor(ac.sampleRate * len), ac.sampleRate);
  const ch = b.getChannelData(0);
  for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / ch.length, 3);
  return b;
}

function playClack(vol, pitch) {
  const ac = sfx();
  if (!ac) return;
  const t = ac.currentTime;
  const src = ac.createBufferSource();
  src.buffer = noiseBuf(ac, 0.06);
  const bp = ac.createBiquadFilter();
  bp.type = "bandpass"; bp.frequency.value = 1800 + pitch * 2600; bp.Q.value = 2.2;
  const g = ac.createGain();
  g.gain.setValueAtTime(Math.min(1, vol) * 0.9, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
  src.connect(bp); bp.connect(g); g.connect(ac.destination);
  src.start(t);
  const o = ac.createOscillator(), og = ac.createGain();
  o.type = "triangle"; o.frequency.value = 650 + pitch * 900;
  og.gain.setValueAtTime(Math.min(1, vol) * 0.12, t);
  og.gain.exponentialRampToValueAtTime(0.001, t + 0.05);

function octaGeometry() {
  const pos = [], uv = [], faces = [];
  const signs = [];
  [1, -1].forEach(sx => [1, -1].forEach(sy => [1, -1].forEach(sz => signs.push([sx, sy, sz]))));
  signs.forEach(([sx, sy, sz], fi) => {
    const X = [sx, 0, 0], Y = [0, sy, 0], Z = [0, 0, sz];
    const tri = sx * sy * sz > 0 ? [X, Y, Z] : [X, Z, Y];
    const rot = fi % 3;
    const t = [tri[rot], tri[(rot + 1) % 3], tri[(rot + 2) % 3]];
    t.forEach(v => pos.push(...v));
    uv.push(0.5, 0.93, 0.07, 0.12, 0.93, 0.12);
  });
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
  for (let i = 0; i < 8; i++) g.addGroup(i * 3, 3, i);
  g.computeVertexNormals();
  return g;
}

function faceFrames(g) {
  const pos = g.attributes.position, uv = g.attributes.uv, out = [];
  const idx = g.index ? g.index.array : null;
  g.groups.forEach(gr => {
    const ids = [];
    for (let k = gr.start; k < gr.start + gr.count; k++) ids.push(idx ? idx[k] : k);
    const uniq = [...new Set(ids)];
    const P = uniq.map(i => new THREE.Vector3().fromBufferAttribute(pos, i));
    const V = uniq.map(i => uv.getY(i));
    const c = P.reduce((a, p) => a.add(p), new THREE.Vector3()).multiplyScalar(1 / P.length);
    const mv = V.reduce((a, b) => a + b, 0) / V.length;
    const up = new THREE.Vector3();
    P.forEach((p, k) => up.addScaledVector(p.clone().sub(c), V[k] - mv));
    const a = new THREE.Vector3().fromBufferAttribute(pos, ids[0]), b = new THREE.Vector3().fromBufferAttribute(pos, ids[1]), cc = new THREE.Vector3().fromBufferAttribute(pos, ids[2]);
    const n = b.clone().sub(a).cross(cc.clone().sub(a)).normalize();
    up.addScaledVector(n, -up.dot(n)).normalize();
    out[gr.materialIndex] = {n, up};
  });
  return out;
}

const VIEW = () => new THREE.Vector3(0, 22, 9).normalize();

function restQuat(frame, dirWorld, upWorld) {
  const n = frame.n, u = frame.up, w = n.clone().cross(u);
  const L = new THREE.Matrix4().makeBasis(n, u, w);
  const W = new THREE.Matrix4().makeBasis(dirWorld, upWorld, dirWorld.clone().cross(upWorld));
  const m = W.multiply(L.transpose());
  return new THREE.Quaternion().setFromRotationMatrix(m);
}

function screenUp(dir, angleDeg) {
  const camUp = new THREE.Vector3(0, 1, 0);
  const s = camUp.clone().addScaledVector(dir, -camUp.dot(dir));
  if (s.lengthSq() < 1e-6) s.set(0, 0, -1);
  s.normalize();
  return s.applyAxisAngle(dir, -angleDeg * Math.PI / 180);
}

function makeDie(spec) {
  let mesh, frames, rest;
  if (spec.kind === "d8" || spec.kind === "tgt") {
    mesh = new THREE.Mesh(R3.geo.octa, spec.kind === "d8" ? R3.mats.d8 : R3.mats.tgt);
    frames = R3.geo.octaF; rest = 0.577;
  } else {
    mesh = new THREE.Mesh(R3.geo.box, R3.mats["cmd" + spec.color]);
    frames = R3.geo.boxF; rest = 0.725;

  mesh.castShadow = true;
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry, 20), R3.mats.edge);
  mesh.add(edges);

  ring.rotation.x = -Math.PI / 2;
  R3.scene.add(ring);
  R3.scene.add(mesh);
  return {mesh, frames, rest, ring, spec};
}

function clearDice() {

  R3.dice = [];
}

function tween(dur, fn) {
  return new Promise(res => R3.tweens.push({t0: performance.now(), dur, fn, res}));
}

function loop() {
  const now = performance.now();
  R3.tweens = R3.tweens.filter(tw => {
    let t = R3.skip ? 1 : Math.min(1, (now - tw.t0) / tw.dur);
    tw.fn(t);
    if (t >= 1) { tw.res(); return false; }
    return true;
  });
  if (R3.sim) R3.sim();
  R3.ren.render(R3.scene, R3.cam);
  R3.raf = requestAnimationFrame(loop);
}

const ease = t => 1 - Math.pow(1 - t, 3);
const easeIO = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

function camTo(dist, dur) {
  const from = R3.cam.position.clone(), to = VIEW().multiplyScalar(dist);
  return tween(dur, t => { R3.cam.position.lerpVectors(from, to, easeIO(t)); R3.cam.lookAt(0, 0, 0); });
}


function floorBox(dist) {
  const cam = R3.cam.clone();
  cam.position.copy(VIEW().multiplyScalar(dist));
  cam.lookAt(0, 0, 0);
  cam.updateMatrixWorld(true);
  cam.updateProjectionMatrix();
  const hit = (x, y) => {
    const r = new THREE.Raycaster();
    r.setFromCamera(new THREE.Vector2(x, y), cam);
    const t = -r.ray.origin.y / r.ray.direction.y;
    return r.ray.origin.clone().addScaledVector(r.ray.direction, t);
  };
  const top = window.innerWidth < 600 ? 0.8 : 0.84, bot = window.innerWidth < 600 ? -0.78 : -0.8;
  const tl = hit(-0.94, top), tr = hit(0.94, top), bl = hit(-0.94, bot), br = hit(0.94, bot);
  return {minX: Math.max(tl.x, bl.x), maxX: Math.min(tr.x, br.x), minZ: Math.max(tl.z, tr.z), maxZ: Math.min(bl.z, br.z)};
}

function throwDist(n, s) {
  const need = n * Math.pow(2.5 * s, 2) * 2.2;
  let dist = 21;
  for (let k = 0; k < 40; k++) {
    const b = floorBox(dist);
    if ((b.maxX - b.minX) * (b.maxZ - b.minZ) >= need && (b.maxX - b.minX) > 5 * s) return {dist, box: b};
    dist *= 1.07;
  }
  return {dist, box: floorBox(dist)};
}

function stepSim(sim, dt) {
  const G = 34, B = sim.box, list = sim.list;
  list.forEach(o => {
    const P = o.p, V = o.v;
    V.y -= G * dt;
    P.addScaledVector(V, dt);
    const fh = o.fh;
    if (P.y > sim.ceil) { P.y = sim.ceil; if (V.y > 0) V.y = -V.y * 0.3; }
    if (P.y < fh) {
      P.y = fh;
      if (V.y < -1.6) { if (!sim.silent) playClack(Math.min(1, -V.y / 14), Math.random()); o.w.multiplyScalar(0.8).add(new THREE.Vector3(V.z, 0, -V.x).multiplyScalar(0.35 / o.r)); }
      V.y = V.y < -1.6 ? -V.y * 0.42 : 0;
      V.x *= 0.86; V.z *= 0.86;
    }
    if (P.y <= fh + 0.02) {
      const f = Math.max(0, 1 - 2.6 * dt);
      V.x *= f; V.z *= f;
      o.w.multiplyScalar(Math.max(0, 1 - 3.2 * dt));
      o.w.lerp(new THREE.Vector3(V.z, 0, -V.x).multiplyScalar(1 / o.r), 0.08);
    } else {
      o.w.multiplyScalar(Math.max(0, 1 - 0.3 * dt));
    }
    const wall = (val, lo, hi, axis) => {
      if (val < lo) { P[axis] = lo; if (V[axis] < 0) { if (!sim.silent && V[axis] < -3) playClack(Math.min(0.6, -V[axis] / 20), 0.3); V[axis] = -V[axis] * 0.62; o.w.multiplyScalar(0.9); } }
      else if (val > hi) { P[axis] = hi; if (V[axis] > 0) { if (!sim.silent && V[axis] > 3) playClack(Math.min(0.6, V[axis] / 20), 0.3); V[axis] = -V[axis] * 0.62; o.w.multiplyScalar(0.9); } }
    };
    wall(P.x, B.minX + o.r, B.maxX - o.r, "x");
    wall(P.z, B.minZ + o.r, B.maxZ - o.r, "z");
    const wl = o.w.length();
    if (wl > 1e-4) o.q.premultiply(new THREE.Quaternion().setFromAxisAngle(o.w.clone().multiplyScalar(1 / wl), wl * dt));
  });
  const all = list.concat(sim.statics);
  for (let it = 0; it < 3; it++)
  for (let i = 0; i < list.length; i++) {
    const a = list[i];
    for (let j = i + 1; j < all.length; j++) {
      const b = all[j];
      const d = b.p.clone().sub(a.p), dist = d.length(), min = a.r + b.r;
      if (dist >= min || dist < 1e-6) continue;
      const n = d.multiplyScalar(1 / dist), over = min - dist;
      if (b.stat) { a.p.addScaledVector(n, -over); }
      else { a.p.addScaledVector(n, -over / 2); b.p.addScaledVector(n, over / 2); }
      const bv = b.stat ? new THREE.Vector3() : b.v;
      const vn = bv.clone().sub(a.v).dot(n);
      if (vn < 0 && it === 0) {
        const jimp = -(1 + 0.5) * vn / (b.stat ? 1 : 2);
        a.v.addScaledVector(n, -jimp);
        if (!b.stat) b.v.addScaledVector(n, jimp);
        const kick = new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).multiplyScalar(Math.min(12, -vn * 2));
        a.w.add(kick); if (!b.stat) b.w.sub(kick);
        if (!sim.silent && vn < -2.5) playClack(Math.min(0.8, -vn / 12), 0.6 + Math.random() * 0.4);
      }
    }
  }
  sim.t += dt;
  const moving = list.some(o => o.v.lengthSq() > 0.25 || o.p.y > o.fh + 0.05 || o.w.lengthSq() > 4);
  sim.still = moving ? 0 : sim.still + dt;
  if (sim.still > 0.15 || sim.t > 3.6) sim.done = true;
}

function syncSim(sim) {
  sim.list.forEach(o => { o.mesh.position.copy(o.p); o.mesh.quaternion.copy(o.q); });
}

async function throwWave(specs, label, s) {
  if (label) showBanner(label);
  const statics = R3.dice.map(o => ({p: o.mesh.position.clone(), r: o.r || 1.1 * s, stat: 1}));
  const {dist, box} = throwDist(specs.length + statics.length * 0.6, s);
  await camTo(dist, statics.length ? 450 : 1);
  const W = box.maxX - box.minX;
  const list = specs.map((sp, i) => {
    const o = makeDie(sp);
    o.mesh.scale.setScalar(s);
    o.s = s;
    o.r = (sp.kind === "cmd" ? 1.0 : 0.95) * s;
    o.fh = (sp.kind === "cmd" ? 0.86 : 0.74) * s;
    const perRow = Math.max(1, Math.floor((W - 2 * o.r) / (2.3 * o.r))), row = Math.floor(i / perRow), col = i % perRow, inRow = Math.min(perRow, specs.length - row * perRow);
    const x = box.minX + o.r + (W - 2 * o.r) * ((col + 0.5) / inRow);
    o.p = new THREE.Vector3(x, 1.4 * s + (row % 3) * 2.3 * s, Math.min(box.maxZ - o.r, box.maxZ - o.r - (row >= 3 ? (row - 2) * 2.3 * s : 0)));
    o.v = new THREE.Vector3((Math.random() - 0.5) * 10, 2 + Math.random() * 4, -(11 + Math.random() * 9));
    o.w = new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize().multiplyScalar(10 + Math.random() * 14);
    o.q = new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.random() * 6.3, Math.random() * 6.3, Math.random() * 6.3));
    o.mesh.position.copy(o.p);
    o.mesh.quaternion.copy(o.q);
    R3.dice.push(o);
    return o;
  });
  playShake();
  const sim = {list, statics, box, t: 0, still: 0, done: false, silent: false, ceil: 4.2 + 2 * s};
  await new Promise(res => {
    let last = performance.now(), acc = 0;
    R3.sim = () => {
      if (R3.skip) {
        sim.silent = true;
        let g = 0;
        while (!sim.done && g++ < 1200) stepSim(sim, 1 / 120);
        sim.done = true;
      } else {
        const now = performance.now();
        acc += Math.min(0.05, (now - last) / 1000);
        last = now;
        while (acc >= 1 / 120 && !sim.done) { stepSim(sim, 1 / 120); acc -= 1 / 120; }
      }
      syncSim(sim);
      if (sim.done) { R3.sim = null; res(); }
    };
  });
  await Promise.all(list.map(o => {
    const restAng = o.spec.kind === "tgt" ? o.spec.rot : (Math.random() * 40 - 20);
    const floorUp = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), -restAng * Math.PI / 180);
    const qT = restQuat(o.frames[o.spec.face], new THREE.Vector3(0, 1, 0), floorUp);
    const qF = o.mesh.quaternion.clone(), y0 = o.mesh.position.y, yR = o.rest * s;
    if (!R3.skip) setTimeout(() => playClack(0.35, Math.random()), 200 + Math.random() * 120);
    return tween(380, t => {
      const e = easeIO(t);
      o.mesh.quaternion.copy(qF).slerp(qT, e);
      o.mesh.position.y = y0 + (yR - y0) * e + Math.sin(Math.PI * e) * 0.45 * s;
    });
  }));
}

async function lineUp(s, rowsOf) {
  const dir = VIEW();
  const n = R3.dice.length;
  const aspect = R3.cam.aspect;
  const maxCols = aspect >= 1 ? 10 : 5;
  const sp = 2.35 * s, spY = sp * 1.32;
  let rows = [];
  rowsOf.forEach(group => { for (let i = 0; i < group.length; i += maxCols) rows.push(group.slice(i, i + maxCols)); });
  const cols = Math.max(...rows.map(r => r.length));
  const Wd = cols * sp + 1.2, Hd = rows.length * spY + 1.6;
  const vf = R3.cam.fov * Math.PI / 180, hf = 2 * Math.atan(Math.tan(vf / 2) * aspect);
  const dist = Math.max(23.8 * 0.9, (Wd / 2) / Math.tan(hf / 2) + 2, (Hd / 2) / Math.tan(vf / 2) * 1.1 + 4);
  const camP = camTo(dist, 700);
  const right = new THREE.Vector3(1, 0, 0), down = new THREE.Vector3().crossVectors(dir, right).normalize().negate();
  const moves = [];
  let k = 0;
  rows.forEach((row, ri) => row.forEach((o, ci) => {
    const x = (ci - (row.length - 1) / 2) * sp;
    const y = (ri - (rows.length - 1) / 2) * spY;
    const target = new THREE.Vector3().addScaledVector(right, x).addScaledVector(down, y).add(new THREE.Vector3(0, 1.0 * s, 0));
    target.y = Math.max(target.y, 1.0 * s);
    const ang = o.spec.kind === "tgt" ? o.spec.rot : 0;
    const fdir = o.spec.kind === "cmd" ? dir.clone().add(new THREE.Vector3(0.22, 0.3, 0)).normalize() : dir;
    o.fdir = fdir;
    const qT = restQuat(o.frames[o.spec.face], fdir, screenUp(fdir, ang));
    const from = o.mesh.position.clone(), qF = o.mesh.quaternion.clone();
    const ringT = target.clone(); ringT.y = 0.02;
    const idx = k++;
    moves.push(new Promise(res => setTimeout(res, R3.skip ? 0 : idx * 45)).then(() => {
      if (!R3.skip) playTick(idx % 12);
      return tween(520, t => {
        const e = easeIO(t);
        o.mesh.position.lerpVectors(from, target, e);
        o.mesh.position.y += Math.sin(Math.PI * e) * 1.2 * s;
        o.mesh.quaternion.copy(qF).slerp(qT, e);
        o.ring.position.copy(ringT);
        o.ring.position.y = 0.02;
        o.ring.scale.setScalar(s);
      });
    }));
  }));
  await Promise.all([camP, ...moves]);
}

function showBanner(txt) {
  const b = R3.el.querySelector(".r3-banner");
  b.textContent = txt;
  b.classList.remove("on"); void b.offsetWidth; b.classList.add("on");
}

function lightRings() {
  R3.dice.forEach(o => { if (o.spec.hit) tween(350, t => { o.ring.material.opacity = 0.85 * t; }); else if (o.spec.dim) tween(350, t => { o.mesh.scale.setScalar(o.s * (1 - 0.12 * t)); }); });
}

function cmdSum() {
  const cp = dice.rolled.reduce((a, x) => a + x.v, 0);
  return `<b>${cp}</b> Command Point${cp === 1 ? "" : "s"}<small>${dice.rerolls} re-roll${dice.rerolls === 1 ? "" : "s"} left</small>`;
}

function setHint() {
  const h = R3.el.querySelector(".r3-hint");
  const cmd = R3.kind === "cmd" || R3.kind === "cmdOne";
  if (cmd && dice.rerolls > 0) { h.textContent = `Tap a die to re-roll it (${dice.rerolls} left)`; h.style.display = ""; h.classList.add("top"); }
  else { h.style.display = "none"; h.classList.remove("top"); }
}

function pickReroll(e) {
  if (!(R3.kind === "cmd" || R3.kind === "cmdOne") || R3.rerolling) return;
  const r = R3.ren.domElement.getBoundingClientRect();
  const m = new THREE.Vector2((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  const ray = new THREE.Raycaster();
  ray.setFromCamera(m, R3.cam);
  const hit = ray.intersectObjects(R3.dice.map(o => o.mesh), false)[0];
  if (!hit) return;
  const o = R3.dice.find(q => q.mesh === hit.object);
  if (!o || o.spec.kind !== "cmd") return;
  if (!dice.rerolls) { toast("No re-rolls left"); return; }
  const x = rerollCmdDie(o.spec.idx);
  if (!x) return;
  o.spec.face = x.i; o.spec.v = x.v;
  R3.rerolling = true;
  const from = o.mesh.quaternion.clone(), base = o.mesh.position.clone();
  const qT = restQuat(o.frames[x.i], o.fdir, screenUp(o.fdir, 0));
  const axis = new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize();
  playShake();
  tween(750, t => {
    const e2 = ease(t);
    o.mesh.position.copy(base);
    o.mesh.position.y += Math.sin(Math.PI * Math.min(1, t * 1.15)) * 2.2 * o.s;
    const q = from.clone().slerp(qT, e2);
    o.mesh.quaternion.copy(q).premultiply(new THREE.Quaternion().setFromAxisAngle(axis, 4 * Math.PI * (1 - e2)));
  }).then(() => {
    R3.rerolling = false;
    playClack(0.8, Math.random());
    R3.el.querySelector(".r3-sum").innerHTML = cmdSum();
    R3.el.querySelector(".r3-again").textContent = "↻ Roll Again";
    setHint();
    renderDice();
  });
}

function closeRoll3D() {
  if (!R3.el) return;
  R3.el.classList.remove("open");
  cancelAnimationFrame(R3.raf);
  R3.tweens.forEach(tw => tw.res());
  R3.tweens = [];
  R3.sim = null;
  clearDice();
  R3.busy = false;
  renderDice();
}

function rollSpecs(kind, arg) {
  const d8face = v => R3.geo.d8vals.indexOf(v);
  if (kind === "d8" || kind === "refail") {
    const L = dice.last;
    const base = kind === "d8" ? L.base : arg;
    const mk = v => ({kind: "d8", face: d8face(v), hit: v >= L.need, dim: v < L.need, v});
    const w1 = base.map(mk).sort((a, b) => b.v - a.v);
    const w2 = L.bonus.map(mk).sort((a, b) => b.v - a.v);
    const hits = L.base.filter(v => v >= L.need).length, bh = L.bonus.filter(v => v >= L.need).length;
    const waves = [{label: kind === "refail" ? `Re-rolling ${base.length} miss${base.length === 1 ? "" : "es"}` : `${base.length}D8 · need ${L.need}+`, dice: w1}];
    if (w2.length) waves.push({label: `Exploding 8s! +${w2.length} bonus ${w2.length === 1 ? "die" : "dice"}`, dice: w2});
    return {waves, good: hits + bh > 0, sum: `<b>${hits + bh}</b> success${hits + bh === 1 ? "" : "es"}<small>${hits} from ${L.base.length}D8${L.bonus.length ? ` + ${bh} from ${L.bonus.length} exploding` : ""} · needing ${L.need}+</small>`};
  }
  if (kind === "cmd" || kind === "cmdOne") {
    const idxs = kind === "cmd" ? dice.rolled.map((_, i) => i) : [arg];
    const w = idxs.map(i => { const x = dice.rolled[i]; return {kind: "cmd", color: x.c, face: x.i, v: x.v, hit: false, idx: i}; });
    const one = kind === "cmdOne" ? dice.rolled[arg] : null;
    return {waves: [{label: kind === "cmd" ? "Command Dice" : `Re-rolling a ${one.c} die`, dice: w}], good: true, sum: cmdSum()};
  }
  if (kind === "scn") {
    const w = scn.v.map(v => ({kind: "d8", face: d8face(v), v, hit: false}));
    return {waves: [{label: "Scenario", dice: w}], good: true, nosort: 1, sum: `<b>Scenario rolled</b><small>${SCN.map((p, i) => p.n + " " + scn.v[i]).join(" · ")}</small>`};
  }
  if (kind === "r6") {
    const v = scn.r6;
    return {waves: [{label: "End of Round 5", dice: [{kind: "d8", face: d8face(v), v, hit: v >= 5, dim: v < 5}]}], good: v >= 5, sum: v >= 5 ? `<b>Play Round 6!</b><small>Rolled ${v} (5+ needed)</small>` : `<b>Game ends</b><small>Rolled ${v} – the game ends after Round 5</small>`};
  }
  if (kind === "recon") {
    const w = scn.recon.dice.map(x => ({kind: "cmd", color: x.c, face: x.i, v: x.v, hit: false}));
    return {waves: [{label: "Recon Roll", dice: w}], good: true, sum: `<b>${scn.recon.total}</b> Recon total<small>Compare with your opponent – highest picks Deployment Zone(s); re-roll draws</small>`};
  }
  const T = dice.tgt;
  const opts = TGT_FACES.map((v, i) => [v, i]).filter(([v]) => T.hit ? v === "hit" : v === T.dist);
  const face = opts[Math.floor(Math.random() * opts.length)][1];
  return {waves: [{label: "Targeting Die", dice: [{kind: "tgt", face, rot: T.hit ? 0 : T.rot, hit: !!T.hit}]}], good: !!T.hit, sum: T.hit ? `<b>ON TARGET</b>` : `<b>Scatter ${T.dist}"</b><small>The arrow on the die points ${Math.abs(T.rot)}° ${T.rot >= 0 ? "clockwise" : "counter-clockwise"} from the top of the screen</small>`};
}

async function play3D(kind, arg) {
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!dice.anim3d || reduce || R3.busy) return;
  if (kind === "refail" && (!arg || !arg.length) && !(dice.last && dice.last.bonus.length)) return;
  if (kind === "recon" && (!scn || !scn.recon || !scn.recon.dice.length)) return;
  R3.busy = true;
  R3.kind = kind; R3.arg = arg;
  sfx();
  try { await loadThree(); } catch (e) { R3.busy = false; toast("3D dice need an internet connection – showing results instead"); return; }
  buildAssets();
  refreshCmdMats();
  setupScene();
  R3.resize();
  const spec = rollSpecs(kind, arg);
  const total = spec.waves.reduce((a, w) => a + w.dice.length, 0);
  const s = total > 30 ? 0.62 : total > 16 ? 0.78 : total <= 2 ? 1.7 : total <= 4 ? 1.3 : 1;
  R3.skip = false;
  clearDice();
  R3.el.querySelector(".r3-bar").classList.remove("on");
  R3.el.querySelector(".r3-hint").style.display = "";
  R3.el.querySelector(".r3-hint").classList.remove("top");
  R3.el.querySelector(".r3-hint").textContent = "Tap to skip";
  R3.el.classList.add("open");
  R3.cam.position.copy(VIEW().multiplyScalar(throwDist(total, s).dist));
  R3.cam.lookAt(0, 0, 0);
  cancelAnimationFrame(R3.raf);
  loop();
  const rows = [];
  for (const w of spec.waves) {
    if (rows.length) { R3.skip = false; await new Promise(r => setTimeout(r, 350)); }
    const before = R3.dice.length;
    await throwWave(w.dice, w.label, s);
    if (!R3.skip) await new Promise(r => setTimeout(r, 280));
    rows.push(R3.dice.slice(before));
    await lineUp(s, rows);
  }
  lightRings();
  playChime(spec.good);
  setHint();
  R3.el.querySelector(".r3-sum").innerHTML = spec.sum;
  R3.el.querySelector(".r3-again").textContent = kind === "cmdOne" ? "↻ Roll all again" : kind === "refail" ? "↻ Roll new pool" : "↻ Roll Again";
  R3.el.querySelector(".r3-bar").classList.add("on");
  R3.el.querySelector(".r3-ok").focus();
}

const RULES = {"v":"Epic Warpath Rules (version 1.1)","c":[{"n":1,"t":"Getting Started","s":[{"m":"a.","t":"Welcome to Epic Warpath","p":"P3","l":1,"h":"<p>Set in and around the vast Galactic Co-Prosperity Sphere, Epic Warpath is an immersive and exciting game of futuristic battles fought on alien worlds.<\/p> <p>All of this is represented by collections of highly detailed Mantic models and is played out on your tabletop with evocative terrain, special dice and tokens to keep track of the action. A game of Epic Warpath is usually played between two players, each controlling an army of highly trained (or degenerate) warriors and futuristic vehicles, all vying for control of strategic objectives. Games involving more players and/or more armies are possible, but they require additional rules and so will be treated separately in their own expansions or articles.<\/p>"},{"m":"b.","t":"What you need to Play Epic Warpath","p":"P4","l":1,"h":""},{"m":"i.","t":"Armies","p":"P4","l":2,"h":"<p>Each player will need suitable Mantic models to assemble their army. Each army could range from a mix of infantry and vehicles to vast hordes of troops with walker and flier support - there really is no limit!<\/p>"},{"m":"ii.","t":"Game Area","p":"P4","l":2,"h":"<p>Epic Warpath is normally played on a 6’x4’ (72” x 48”) table space. For truly epic games, larger table spaces can be used to accommodate all the models and scenery you are using. Likewise, for smaller games, you can play on a smaller area<\/p>"},{"m":"iii.","t":"8-Sided Dice","p":"P4","l":2,"h":"<p>Epic Warpath uses 8-sided dice (abbreviated to D8) for most rolls in the game. Once rolled, the result is the number showing on the top face – just like on a standard six-sided die.<\/p> <p><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/d8s.webp\"/><\/p> <p>For most rolls in the game, you roll the required number of D8s and then compare the scores to the appropriate models’ or weapons’ statistic (stat). For example a value of 4+ for a Shoot stat means scores of 4 or more are successes. Thus, all dice that equal or exceed the stat value are successes, and all that are less than the target number are failures. If a base has a stat value of “–“ then no dice are rolled and therefore no successes can be achieved.<\/p> <p><em>For example, Paul rolls four D8s to shoot using his Unit’s Shoot value of 6+. He rolls a 3, 5, 6 and 7 scoring 2 successes.<\/em><\/p> <p>Sometimes a D4 or D2 may be required. In such cases, simply roll a D8 and determine the result using the table below:<\/p> <table> <tbody> <tr> <th>D8 Roll<\/th> <th>D4 Result<\/th> <th>D2 Result<\/th> <\/tr> <tr> <td>1-2<\/td> <td>1<\/td> <td>1<\/td> <\/tr> <tr> <td>3-4<\/td> <td>2<\/td> <td>1<\/td> <\/tr> <tr> <td>5-6<\/td> <td>3<\/td> <td>2<\/td> <\/tr> <tr> <td>7-8<\/td> <td>4<\/td> <td>2<\/td> <\/tr> <\/tbody> <\/table>"},{"m":"iv.","t":"Modifiers","p":"P4","l":2,"h":"<p>Some dice rolls are modified by adding to, or subtracting from the number rolled, making a success more or less easy to achieve. In all cases a natural roll (regardless of modifiers) of 1 is always a failure.<\/p> <p>Modifiers are cumulative, so two modifiers that are both -1, result in a total modifier of -2 to the score on the dice for example; and -1, -1 and +1 would result in a final modifier of -1.<\/p> <p><em>Returning to our previous example, if Paul’s roll suffered a -1 modifier, his dice would have scored 2, 4, 5 and 6, resulting in only one success. If the modifier was +1 his results would have been 4, 6, 7 and 8 and three dice would have achieved the 6 or more he required, and so would all be successes.<\/em><\/p> <p>Sometimes a rule will state that there is a maximum modifier that can apply. In such cases, apply all modifiers first and then apply the maximum “cap” to the result.<\/p> <p><strong>Exploding 8s<\/strong><\/p> <p>For some rolls in the game a mechanism called Exploding 8s is used. This means that for each natural result of 8 in the roll (that is also a success), another bonus die can be rolled to see if a further success is achieved. It’s possible to keep rolling 8s and to keep getting bonus dice!<\/p> <p>The rules will state when the Exploding 8! mechanic applies to a roll.<\/p> <p>Bonus dice can be re-rolled just like any other dice if permitted. Finish accumulating and rolling any bonus dice before any re-rolling.<\/p> <p><em>e.g. five dice are rolled with the Sustained Attack keyword, requiring scores of 5 or more to be a success. The results are 2, 4, 5, 6 and 8. Three results are successes and a bonus die is rolled which scores another 8 - another success and so a further bonus die is rolled. This time a 3 is rolled and the sequence stops. Overall, four successes were rolled.<\/em><\/p>"},{"m":"v.","t":"Re-rolls","p":"P4","l":2,"h":"<p>Some Keywords and orders will allow you to re-roll dice to improve your chances of a success, or force your opponent to re-roll successful dice rolls. In all cases, you may only ever re-roll each die once – you cannot re-roll a re-roll, even if the source of the re-roll is different. If both players have rules allowing them to make rerolls to the same roll, the player whose Turn it is, makes their re-rolls first<\/p>"},{"m":"vi.","t":"Rounding up","p":"P4","l":2,"h":"<p>Throughout the game, whenever a number is divided and the result is not a whole number, always round the result up. For example, 3.5 would round up to 4.<\/p>"},{"m":"vii.","t":"Targeting Dice","p":"P5","l":2,"h":"<p>Some weapons or effects are unpredictable. To represent this, Epic Warpath uses a special Targeting Die, which indicates direction using the natural points of the die, distance (3,3,4,5,6), and ‘ON TARGET’ symbols (x3). The Targeting Die is 8-sided and is read just like a normal die, using the face-up side as the result. The point to use for direction is marked with a chevron/arrow.<\/p> <p><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/target_dice.png\"/><\/p>"},{"m":"viii.","t":"Command Dice","p":"P5","l":2,"h":"<p>To play Epic Warpath you will need a set of Command Dice. These 6-sided Command Dice are coloured black, orange or green, which represent the capability of progressively more powerful commanders or units. Each die face is either blank or has a number of energy swords on them. The number of energy swords rolled is the number of Command Points scored for that die.<\/p> <p><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/command_dice.png\"/><\/p>"},{"m":"ix.","t":"Tokens, Counters and Markers","p":"P5","l":2,"h":"<p>There are a number of tokens, counters and markers used in games of Epic Warpath, for tracking things like Unit Actions and Pinning. What these look like and when to use them are described within the rules.<\/p>"},{"m":"x.","t":"Bases and Units","p":"P6","l":2,"h":"<p>Groups of models that are selected within an army and which move and fight together are called Units. All the models within a Unit will be mounted on one or more Bases.<\/p> <p>All models in Epic Warpath, except some vehicles, are mounted on round bases. A Base could represent a single walker or a small squad of infantry models, for example. One or more Bases are formed into Units. Bases in a Unit operate together during the game.<\/p> <p><strong>Vehicles without Bases<\/strong><\/p> <p>If a vehicle is supplied and used without a base, consider the footprint of its hull to be its “Base”. Some people prefer to create their own bases for these vehicles. This is fine, but such scratch-built bases should not be much larger than the vehicle itself. Measure from this base as normal.<\/p> <p><strong>Base Contact<\/strong><\/p> <p>A Base is in base contact with something when it is physically touching it (such as an enemy base, building, Objective etc.). When two Bases are touching, they are in base contact.<\/p> <p><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/company.png\"/><\/p>"},{"m":"xi.","t":"Status Markers","p":"P8","l":2,"h":"<p>Several Keywords and effects in the game may require use of a Status Marker. These are generic tokens in various colours for you to use as you wish.<\/p> <p><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/status_markers.png\"/><\/p>"},{"m":"c.","t":"Unit Profiles","p":"P8","l":1,"h":"<p>All Units in Epic Warpath have a profile of statistics or ‘stats’ which show how effective the Bases in the Unit are at moving, shooting, assaulting and surviving in a combat zone. In addition, the height of the Bases in a Unit, their Keywords and weaponry are all included in the profile.<\/p> <p>Some Units may be so poor at doing something they will be effectively unable to do it at all! Such Units will have a stat value of “-” where appropriate. Here is an example of a Unit profile for Enforcer Jet Bikes, made of 6 Bases.<\/p> <p><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/unit_profile.png\"/><\/p>"},{"m":"i.","t":"A Unit profile details","p":"P8","l":2,"h":"<p><strong>Unit Name<\/strong>: Each Unit is identified by its title.<\/p> <p><strong>Bases<\/strong>: The number of Bases the Unit starts with. This is indicated next to the Unit’s name in brackets. For example (6) means the Unit starts with 6 Bases<\/p> <p><strong>Type<\/strong>: The type of Unit is used for a number of rules in the game. Types include Infantry, Heavy Infantry, Vehicle, Bike, Walker and Super-heavy. Units listed as Command, will also have a type in Brackets. For example Command (Infantry), or Command (Vehicle). For the purposes of the rules, they are both types.<\/p> <p><strong>Speed (SP)<\/strong>: How far a Unit can move in inches, given as two values (n/n – Advance/Sprint). The first number is used to represent the Unit’s basic Advance movement. The second number is used when the Unit Sprints.<\/p> <p><strong>Shoot (SH)<\/strong>: The ability of a Unit to fire ranged weapons accurately. A Unit with a stat value of “-” cannot Shoot.<\/p> <p><strong>Assault (AS)<\/strong>: The skill or strength of a Unit in handto-hand combat. If a Unit has a stat value of “-” it will roll no dice to attack in an Assault.<\/p> <p><strong>Armour (AR)<\/strong>: The armour, or toughness of a model when potentially taking damage.<\/p> <p><strong>Save (SV)<\/strong>: This represents supernatural foresight, plain luck, uncanny reflexes, shielding technology, or any other way to evade damage.<\/p> <p><strong>Height (HT)<\/strong>: The Unit’s Height value. This value is used primarily to determine Line of Sight and Cover.<\/p> <p><strong>Unit Strength (US)<\/strong>: These values represent the ability of the Unit to take and hold an Objective. Units with higher US values will win out if an Objective is contested. Typically, infantry will have better US than bikes or vehicles, representing their ability to bed in and lock down an area. The value is usually expressed as n/n (e.g. 4/2 or 3/1). A Unit uses the first number as its US value until it has lost half or more of its Bases, after which it immediately uses the second number. See page 55 for more on Objective scoring.<\/p> <p><strong>Points (PTS)<\/strong>: The cost to purchase the Unit when building your army. The points cost includes a number of Bases and standard equipment. PTS cost is also used to determine the winner in some Scenarios.<\/p> <p><strong>Weapon Stats<\/strong>: The Ranged and Assault (range A) weaponry of the Bases within the Unit, and their Keywords. Where Attack Dice (ADice) are listed, this is the number of dice that a weapon gets for each Base in the Unit.<\/p> <p><strong>Keywords<\/strong>: Some Units and weapons will have special abilities that allow them certain advantages, or disadvantages, in the game. These Keywords may be for the Unit as a whole or for individual weapons within the Unit. This will be clearly shown in the Unit profile.<\/p> <p><em>For example, in the profile opposite, all the Bases in the Unit have the Anti-Grav Keyword, and their Dominator Rifles have the Sustained Attack Keyword.<\/em><\/p>"},{"m":"ii.","t":"Army Nerve","p":"P9","l":2,"h":"<p>Nerve is a single value that is set for an Army as a whole, instead of an individual Unit. If a Unit has to make a Nerve test for any reason, roll a single D8 and compare the result to the Army Nerve value. If the result equals or beats the Army Nerve value, the test is passed. Otherwise, it is a failure.<\/p>"},{"m":"d.","t":"Armies","p":"P10","l":1,"h":"<p>In a game of Epic Warpath, you and your opponent each take control of an Army of soldiers to play an exciting battle game. Once the battlefield has been set up with terrain and any objectives, your chosen Scenario will tell you how to deploy your Units and how to achieve victory!<\/p> <p><strong>Friendly Elements<\/strong>: If a rule refers to friendly Units/Bases, this means all Units and Bases in your army.<\/p> <p><strong>Enemy Elements<\/strong>: If a rule refers to enemy Units/Bases, this means all Units and Bases in your opponent’s army.<\/p> <p><strong>Neutral Elements<\/strong>: If a Scenario requires the use of third party elements, these are considered neutral and are classed as enemy elements for both players.<\/p>"},{"m":"e.","t":"In Play","p":"P10","l":1,"h":"<p>All Units and Bases are In Play if they are currently placed on the gaming table, including Flying Units, but also includes Units within transports and buildings (even if the actual models are currently placed to one side). Units and Bases that are currently in Reserve (awaiting deployment), or that have been destroyed, are not In Play.<\/p>"},{"m":"f.","t":"Measuring","p":"P10","l":1,"h":"<p>A tape measure marked in inches is required to play Epic Warpath in order to determine how far Bases move or shoot etc. Measurement between Bases, Objectives, and range to targets is always taken as the distance between the closest points on the two elements involved (e.g. base edge to base edge, rather than centre to centre). You can measure to check distances or range at any time.<\/p> <p><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/measuring.png\"/><\/p>"},{"m":"g.","t":"Line of Sight","p":"P11","l":1,"h":"<p>Line of Sight (LOS) is determined by using a top-down view, looking down on the table as if from a drone or satellite. Often whether Bases and Units have LOS to a target is obvious, but the top-down approach makes it clear when there is any doubt.<\/p> <p>All Bases have a 360 degree arc of sight – so they can see all around them.<\/p> <p>All Bases have a 360 degree arc of sight – so they can see all around themTo determine if a Unit has LOS to a target, draw a straight, imaginary line from any part of a Base in the friendly Unit to any Base in the target enemy Unit. Bases from the friendly Unit checking for LOS, or target Unit, and any Bases with the Fly Keyword, do not block LOS. Any Bases, or gaps between Bases, in other intervening Units will block LOS up to that Unit’s height. Players should check for LOS from each Base in a Unit, as only some may be able to see a target (or not all the Bases in an enemy Unit may be visible).<\/p> <p>If a Base checking for LOS can draw an uninterrupted line to all parts of an enemy Base, then LOS is considered to be Clear<\/p> <p>If it’s impossible to draw this imaginary line to any part of an enemy Base, without it being interrupted by terrain or Bases with a Height equal or greater than both target and the Base drawing LOS, then LOS is Blocked.<\/p> <p>LOS from a Base to the enemy is considered Partially Blocked if:<\/p> <ul> <li>The imaginary line can be drawn to some, but not all of the enemy base, because it is obscured by something that blocks LOS.<\/li> <li>The line passes over a Base or terrain feature that is lower than both target and shooter (e.g. firing over an intervening wall or shorter Unit).<\/li> <li>The line passes over a Base or terrain feature that is equal in height to either the target or shooter, and lower than the other.<\/li> <\/ul> <p>An enemy Unit can be seen so long as LOS is either Clear or Partially Blocked. When LOS is Partially Blocked, the enemy Unit is often said to be In Cover.<\/p> <p><strong>The Benefit of Elevation<\/strong><\/p> <p>Units can ignore any intervening terrain elements or Units that are 3 or more Height levels lower than they are.<\/p> <p><em>For example, a Unit in a solid building is Height 5 and so can ignore (see clearly over) intervening elements of Height 2 or less.<\/em><\/p> <p><strong>Large Targets<\/strong><\/p> <p>Conversely, targets that themselves are 3 Height levels or taller than intervening terrain or Units, cannot claim LOS is Blocked or Partially Blocked by those elements.<\/p> <p><em>For example, a Height 2 Unit can ignore a Height 1 barricade when shooting up at a Unit in a Height 6 building.<\/em><\/p>"}]},{"n":2,"t":"Rounds, Phases and Turns","s":[{"m":"","t":"","p":"","l":2,"h":"<p>A game of Epic Warpath is played over a series of Rounds, which are each conducted in a number of Phases. Within each Phase each player will alternate taking Turns to activate their Units, one at a time, until both players have completed activating all the eligible Units in their army. Once one of the players has completed all their possible activations in a phase, the other player then completes all of theirs.<\/p> <p>The Scenario being played will determine the number of Rounds in a game, together with terrain set-up, troops deployment, victory conditions and so on; see the Scenario Section on page 51.<\/p>"},{"m":"a.","t":"Round sequence","p":"P12","l":1,"h":"<p>Each Round in Epic Warpath is played in the same order through a sequence of phases as follows.<\/p> <ol> <li>Command Phase<\/li> <li>Movement Phase<\/li> <li>Overwatch Phase<\/li> <li>Combat Phase<\/li> <li>End Phase<\/li> <\/ol> <p><strong>Command Phase<\/strong><\/p> <p>In the Command Phase, players perform the following in order.<\/p> <ol> <li>Roll for Command Points<\/li> <li>Assign Action Tokens<\/li> <li>Roll for Initiative<\/li> <li>Reveal Hidden Action Tokens<\/li> <\/ol> <p><strong>Movement Phase<\/strong><\/p> <p>Units that have been assigned Sprint or Advance Action Tokens take it in turn to move in this Phase. Units which will engage the enemy in Assault, swap their Sprint token for a Combat Token, otherwise the token is simply removed once the Sprint is complete. Units with Advance tokens perform any movement and then swap them for Combat Tokens.<\/p> <p><strong>Overwatch Phase<\/strong><\/p> <p>Units with Overwatch Action Tokens take it in turns to shoot at the enemy using any ranged weapons they have. Once a Unit has fired, its token is removed.<\/p> <p><strong>Combat Phase<\/strong><\/p> <p>Units with Combat Tokens take it in turn to either fight in close combat (Assault) with enemy troops, or shoot with ranged weapons. As each Unit completes its action, its token is removed.<\/p> <p><strong>End Phase<\/strong><\/p> <p>Any special rules which take place in the End Phase are carried out. Players roll for Pin marker removal. Players then check the Scenario conditions to see if someone has achieved victory. If not, the game continues and the next Round starts with the Command Phase.<\/p>"}]},{"n":3,"t":"Command Phase","s":[{"m":"","t":"","p":"","l":2,"h":"<p>In the Command Phase, players perform the following in order.<\/p>"},{"m":"a.","t":"Roll for Command Points","p":"P13","l":1,"h":"<p>Each player rolls three black Command Dice, plus any additional Command Dice generated by Tactician units (see page 50), to generate their own Pool of Command Points.<\/p>"},{"m":"b.","t":"Assign Action Tokens","p":"P13","l":1,"h":"<p>The three possible Action Tokens to place in this phase are:<\/p> <p><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/action_tokens.png\"/><\/p>"},{"m":"c.","t":"Mandatory Tokens","p":"P13","l":1,"h":"<p>First of all, players place the following Tokens, face up next to the relevant units, as described below.<\/p> <ul> <li><strong>Engaged Units<\/strong>: Units that are engaged in Assault with each other from a previous Round must be given Combat Tokens instead of one of the Action Tokens listed above.<\/li> <li><strong>Pinned Units<\/strong>: Unengaged units that start the Round with a Pin marker must be given an Advance Token. Units that are both Pinned and Engaged receive no tokens of any kind.<\/li> <li><strong>Command Units<\/strong>: Unengaged Command Units that are not Pinned must be given both a Sprint and an Overwatch Token.<\/li> <\/ul>"},{"m":"d.","t":"Hidden Tokens","p":"P13","l":1,"h":"<p>Simultaneously, both players select the Action Token they want for each remaining unit they have In Play (and Reserves that will be entering the battle this Round, see page 58) that has not yet received a Token (i.e. that was not included in the Mandatory Tokens listed above). These Action Tokens should be placed face down next to the Unit receiving the Token.<\/p> <p>Note that Units aboard transports are not assigned any Token, but are assumed to have the same Token as their transports (see page 41).<\/p>"},{"m":"e.","t":"Roll for Initiative","p":"P13","l":1,"h":"<p>Unless a Scenario instructs otherwise, both players roll a D8 in the first Command Phase and the winner has the Initiative for the Round. Re-roll ties. In each subsequent Command Phase, players roll for Initiative again to see which one has it for that Round. If a tie is rolled, the player that didn’t have the Initiative in the previous Round wins.<\/p> <p>The player with the Initiative for the Round should take the Initiative Token as a reminder.<\/p> <p><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/initiative_token.png\"/><\/p> <p>For the rest of the Round, the player with the Initiative Token can decide which players goes first in each phase.<\/p> <p>In addition, whenever two rules are triggered at the same time, the player with the Initiative can decide in which order all of these simultaneously triggered rules are resolved (unless the rules state otherwise).<\/p> <p><em>For example, imagine a Unit is assaulting another and it has a rule like a Strategic order which can be triggered ‘when assaulting an enemy’. Similarly, the defender could have a rule that can be triggered ‘when assaulted’. The player with the Initiative decides which player must trigger their rule first. <\/em><\/p>"},{"m":"f.","t":"Reveal Hidden Action Tokens","p":"P14","l":1,"h":"<p>Both players turn over and reveal all the hidden Action Tokens they gave to their Units. If a player has forgotten to place a Token on a Unit, it is now given a Combat Token. Note that this is the last chance for a unit to receive Action Tokens. If you forget to do so and you start the Movement phase, then any forgotten Units will have no action for this Round.<\/p>"},{"m":"g.","t":"Command Points & Orders","p":"P14","l":1,"h":"<p>Soldiers will work best if properly led and organised which involves solid leadership and good orders. To simulate this, we use Command Points and Orders to represent your ability to get the most from your army.<\/p> <p><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/command_example.png\"/><\/p> <p><em>In this example, sam has rolled three black command dice plus an orange one for a command unit with the tactician (orange) keyword. After re-rolling one die to try for a better result, the fInal total is 5 command points to spend in the coming round.<\/em><\/p>"},{"m":"h.","t":"Generating the Command Pool","p":"P14","l":1,"h":"<p>At the start of each Round both players create their Command Dice Pool by taking three BLACK Command Dice. Additional dice of the appropriate colour (BLACK, ORANGE or GREEN as shown on a Unit’s profile) are added to the roll for any of their Units In Play with the Tactician Keyword.<\/p> <p><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/command_pool.png\"/><\/p> <p>Note that the Tactician Keyword may be on some Units that are not Command Units, and these Units will contribute their Command Dice as normal but may not themselves issue orders (see below). A player’s Command Dice may be reduced as the game goes on if they are careless with their Commanders!<\/p> <p>Each player rolls all of their Command Dice, and may immediately re-roll one Command Die for each Command Unit they have In Play. After this is done, add up the Power Swords shown on the dice. This is the total number of Command Points each player has available for the Round about to be played (so a die showing two Power Swords means two Command Points for example).<\/p> <p>Keep aside the Command Dice you rolled and use them as counters to keep track of how many Command Points you have available that Round.<\/p> <p>During a Round, Command Points are spent in a number of ways to increase the utility of an army. Players must either spend all their available Command Points for the Round or lose them. They cannot be saved for future Rounds. As you spend your Command Points, rotate the Command Dice down to the appropriate number to reflect how many Command Points you have spent and that you have left for the Round.<\/p>"},{"m":"i.","t":"Tactical Orders","p":"P15","l":1,"h":"<p>The following Tactical Orders are available to both players during a Round by spending Command Points from their pool. These orders can be used on any friendly unit that is In Play, as it is assumed that they are issued by squad commanders or vehicle squadrons’ commanders, which are imbedded in their unit.<\/p> <table> <tbody> <tr> <th>Command Point Cost<\/th> <th>Order<\/th> <th>Timing<\/th> <th>Effect<\/th> <\/tr> <tr> <td>1<\/td> <td>Keep Going! (Extra Activation)<\/td> <td>After activating a Unit in a Phase and completing its action<\/td> <td>Activate another Unit before returning play to your opponent to have their turn. A player may only interrupt the normal turn sequence like this once before their opponent must take another turn. This order may not be used with the first player’s first Activation in a Phase (i.e. the player going first in a Phase may not Activate two Units until their opponent has Activated at least one).<\/td> <\/tr> <tr> <td>1<\/td> <td>Fight on! (Re-roll)<\/td> <td>After rolling to hit or to damage a target<\/td> <td> <p>Re-roll up to two dice in a Unit’s roll that failed to hit or damage a target with a Shooting or Assault attack. Remember though that you cannot re-roll any dice that have already been re-rolled for other reasons. You can only do this once per roll against a specific target (with all the involved weapons).<\/p> <p>For example, you roll eight dice and roll five misses. You can spend a Command point to re-roll two misses, but you cannot then decide that you are going to re-roll two more misses. You could however, then choose to spend another Command Point to re-roll up to two dice that then failed to damage.<\/p> <p>When engaging multiple targets (in multiple assaults or when a unit is allowed to split fire by a special rule, or a Blast Template covers different targets…) you could for example roll three dice against target A, and spend a Command point to re-roll two misses. Then you roll five dice to hit against target B, and you could also spend another Command point to re-roll two misses.<\/p> <\/td> <\/tr> <tr> <td>1+<\/td> <td>Courage! (Clear Pin marker)<\/td> <td>In the End Phase (Roll for Pin markers removal step) before any dice are rolled.<\/td> <td>Each Command point spent removes one Pin marker from one<br/>friendly Unit.<\/td> <\/tr> <\/tbody> <\/table>"},{"m":"j.","t":"Strategic Orders","p":"P15","l":1,"h":"<p>Each faction has Strategic Orders that are unique to their armies. So, for example, the Enforcers have access to different Strategic Orders than the Plague.<\/p> <p>Like Tactical Orders, Strategic Orders are special effects that are paid for using Command Points. All Strategic Orders must be declared before any relevant dice are rolled.<\/p> <p>Unlike a Tactical Order, a Strategic Order comes from more senior commanders, so unless specified otherwise, it can be used only on friendly Units that are within the Command Radius (in inches) of a friendly Command Unit (as normal, at least one Base needs to be within range). Strategic Orders can be used on the Command Unit itself. Units that are out of the Command Radius of any friendly Command Units, cannot have any Strategic Orders played on them.<\/p> <p>If a Command Unit is occupying a building or being transported by a vehicle (as explained in the relevant sections of these rules), measure the Command Radius from the building itself or any of the transport vehicles carrying the Command Unit. Likewise, to issue an order to a Unit inside a transport or a building, the Command Unit must be in range of the transports or the building.<\/p> <p>Only one Strategic Order may be used each activation. The Strategic Order may be used before or after, but not during, an action – and each order will specify when it can be used. Most Strategic Orders will affect a single Unit and are resolved immediately, or will affect that Unit’s next action.<\/p> <p><em>For Example: An Enforcer player wants to use the Go, Go, Go! Strategic Order on one of their units with a Sprint Action Token, that is within the 16” Command Radius of an Enforcer Captain. To use this Strategic Order, the player pays the cost of 2 Command Points when the target unit activates. When the Unit has completed its movement, and if it is not engaged in base contact with the enemy, its Sprint Action Token is

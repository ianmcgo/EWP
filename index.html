replaced with a Combat Token. <\/em><\/p>"},{"m":"k.","t":"Simultaneous Rules","p":"P16","l":1,"h":"<p>Sometimes two or more strategic orders, or indeed any other rules, may be triggered at the same time (e.g. when a unit moves within a certain range). If it matters in which order these rules are going to be resolved, then the player with the Initiative Token decides the order in which they are resolved (unless the rules state otherwise)<\/p>"}]},{"n":4,"t":"Movement Phase","s":[{"m":"","t":"","p":"","l":2,"h":"<p>In the Movement Phase, only Units that have Advance or Sprint Action Tokens may activate and move. Units that have Overwatch Action Tokens are preparing to offer covering, aimed or snap-fire in support of their comrades later (or if they know they may be assaulted so they can fire as a reaction). The player with the Initiative chooses to go first or second. Players then take it in alternating turns to “activate” and move their Units one at a time. Players cannot elect to pass their turn. Once a player runs out of Units to move, the other player finishes moving their remaining Units.<\/p>"},{"m":"a.","t":"Coherency","p":"P17","l":1,"h":"<p>Soldiers in Epic Warpath have been trained to act as part of a team following the directions of their Unit and squad leaders. They must move and fight together. Each Base in a Unit must be within 1” of at least one other Base in the Unit, in an uninterrupted chain or group, and within 6” of all the other Bases in the Unit. This is called Coherency.<\/p> <p>Removal of Bases from a Unit (e.g. due to casualties) should be performed to maintain Unit Coherency whenever possible. If any Base from a Unit finds itself outside of Coherency, the first time the Unit moves it must return within Coherency.<\/p> <p><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/coherency.png\"/><\/p> <p><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/coherency_not.png\"/><\/p>"},{"m":"b.","t":"Moving Units","p":"P18","l":1,"h":"<p>To move a Unit, simply measure the distance from the edge of the Bases and move them up to the maximum the Unit can move for the action being performed. This move can be in a straight line, or curved to avoid other models or terrain, and end up facing in any direction. Do make sure that the final positions of all the Bases in the Unit keeps it in Coherency and that no part of any base has moved more than the maximum distance allowed.<\/p> <p>When a Unit with an Advance action moves, it may move up to the first of its Speed stat values. So, a Unit with a Speed of 4/8, could move up to 4”.<\/p> <p>When a Unit with a Sprint action moves, it may move up to the value of its second Speed stat value. So, a Unit with a Speed of 4/8, could move up to 8”. Only Units with Sprint actions are permitted to engage enemy Bases in an Assault by moving in to base-to-base contact (see below).<\/p> <p>A player may elect not to move a Unit at all when it activates.<\/p> <p><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/moving_units.png\"/><\/p>"},{"m":"c.","t":"Interpenetration of Units","p":"P18","l":1,"h":"<p>No Units’ Bases may come within 1” of any enemy Unit unless they are engaging that Unit in an Assault (see below) by moving into base-to-base contact. Such Units are also then permitted to be within 1” of other enemy Units that happen to be in close proximity, while they are engaged. Units can come within 1” of friendly Units so long as they end their move clear of them (see below).<\/p> <p>A Unit may move through another, unengaged (not in base-to-base contact with the enemy), friendly Unit as long as its Bases end their moves at least 1” away.<\/p> <p>Some very large vehicles can even just turn on their centre point and rotate through Friendly models, so long as they finish any turning clear of other Bases.<\/p> <p>In general, friendly Units should, as much as possible, be kept apart, and should never be in base contact with other friendly Units (except where the rules specify otherwise). If you cannot keep friendly Units at least 1” apart, a smaller distance is acceptable, but make sure it is clear to your opponent which Bases belong to which Unit.<\/p>"},{"m":"d.","t":"Moving Units off of the Table","p":"P19","l":1,"h":"<p>No Unit may move off the table under normal circumstances and must immediately stop at the edge of the table if forced to do so. If permitted to leave the table by Scenario-specific rules then all Bases must be able to reach the table edge during its movement to do so. If a Unit leaves the table, simply remove all the Bases from the Unit and place them off the table, making it clear they have not been destroyed. They are, however, no longer In Play.<\/p>"},{"m":"e.","t":"Assaults - Engaging the enemy","p":"P19","l":1,"h":"<p>A Unit with a Sprint token may move into base-to-base contact with a single enemy Unit, to engage them in an Assault. Simply move each assaulting Base into contact with at least one base in the target unit, contacting unengaged Bases first, so that as many enemy Bases as possible (normal movement rules permitting) are engaged, while still keeping the Assaulting Unit in coherency. Note that Units with the APC keyword cannot move to engage and Assault Units that have an Action Token (see page 46).<\/p> <p>While engaged in a multiple combat involving several Units, the 1” rule for keeping Units separate does not apply to the Units involved.<\/p> <p><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/assault_move_1.png\"/><\/p> <p><em>In this example, the Peacekeepers (PK) have a Sprint Action Token and want to move to Assault the Zombies. Each PK Base can move up to 8” when Sprinting, so only three are able to reach and make base contact with as many of the Zombies as they can. The other Bases in the Unit will move as far as they can to try and support the attack while remaining in Coherency.<\/em><\/p> <p><em><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/assault_move_2.png\"/><\/em><\/p> <p>After engaging the enemy as described above, Assaulting Units swap their Action Token(s) for a Combat Token.<\/p> <p><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/combat_token.png\"/><\/p> <p>However, if any part of the moving Unit’s movement (even a single Base) was in or through Difficult terrain, or into or from a Building, they are Hindered and their Combat Token is swapped for a Combat (-1) token instead.<\/p> <p><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/combat_-1_token.png\"/><\/p> <p>Any Unit that is Assaulted and therefore engaged in base-to-base contact by the enemy, swaps any Sprint or Advance tokens it still has for a Combat Token (losing its chance to move!).<\/p>"},{"m":"f.","t":"Vehicles and Walkers","p":"P20","l":1,"h":"<p>If a Vehicle/Walker Unit is assaulted by anything other than another Super-heavy/Vehicle/Walker while they still have an Advance or Sprint Token, they retain their Advance/Sprint Token. When activated, they can move out of base contact with the unit(s) that engaged them. If they can’t (or choose not to) move out of base contact when activated, they swap their Token for a Combat Token.<\/p>"},{"m":"g.","t":"Super-heavy Units","p":"P20","l":1,"h":"<p>If a Super-heavy Unit is assaulted by anything other than another Super-heavy Unit while they still have an Advance or Sprint Token, they retain their Advance/Sprint Token. When activated, they can move out of base contact with the unit(s) that engaged them. If they can’t (or choose not to) move out of base contact when activated, they swap their Token for a Combat Token.<\/p>"},{"m":"h.","t":"Assaulting a Unit on Overwatch","p":"P20","l":1,"h":"<p>If a Unit assaults an enemy Unit that has an Overwatch Token, move the assaulting Bases in as normal, then immediately resolve the Overwatch fire against the assaulting Unit (see page 22), and finally remove the Overwatch Token from the shooting Unit (do not give it a Combat Token). The Unit will still fight the Assault in the Combat Phase, but will not have the chance to trigger the assault when it wants to.<\/p> <p>Note however, that weapons with the Blast keyword and weapons with a minimum range (like some artillery) cannot be used to shoot at an engaging enemy in this way. If the Unit being assaulted has no other weapons, swap its Overwatch token for a Combat Token instead and it does not fire (but will have the chance to trigger the assault later itself when it wants). If a Command Unit is Assaulted, it loses any Tokens it has, but immediately resolves any Overwatch Action it still had against the Assaulting Unit as above.<\/p>"},{"m":"i.","t":"End of activation","p":"P21","l":1,"h":"<p>After a Unit activates, removing or swapping tokens as described below helps keep track of which Units each player has activated, and also acts as reminders for future phases and actions.<\/p> <p>After a Unit is activated:<\/p> <ul> <li>If it has an Advance Token, swap it for a Combat Token.<\/li> <li>If it has a Sprint Token, but didn’t engage the enemy in base-to-base contact, simply remove its Token.<\/li> <li>• If it has a Sprint Token and engaged the enemy in an Assault (base-to-base contact) then swap the Sprint Token for a Combat Token, or a Combat (-1) Token if Hindered, as described above.<\/li> <\/ul> <p>Using a Combat (-1) Token is simply a helpful reminder that the Unit was Hindered when making its Sprint into the enemy. Both types of Token are Combat Tokens.<\/p> <p><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/moving_advance_token.png\"/><\/p> <p><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/moving_advance_token_2.png\"/><\/p>"},{"m":"j.","t":"Command Units","p":"P21","l":1,"h":"<p>If Command Units move and don’t engage the enemy in base-to-base contact, they discard their Sprint Token, but keep their Overwatch Token. If Command Units assault an enemy unit, they swap both of their Tokens for a Combat Token. If they are assaulted, they lose any Tokens they have, but immediately resolve any Overwatch Action they had against the Assaulting Unit as normal.<\/p>"}]},{"n":5,"t":"Overwatch Phase","s":[{"m":"","t":"","p":"","l":2,"h":"<p>In the Overwatch Phase, only Units that have Overwatch Tokens may activate, shooting any ranged weapons they have. The player with the Initiative chooses to go first or second. Players then take it in alternating turns to “activate” and fire with their Units one at a time. Players cannot elect to pass their turn. Once a player runs out of Units to fire with, the other player finishes firing with their remaining Overwatch Units. When a player activates a Unit with an Overwatch token, instead of firing, they may choose to swap the Overwatch Token for a Combat Token to use later and not fire in this phase. A Unit can only fire weapons it has with a Range presented as a number. Weapons with a range of “A” are used in Assaults.<\/p> <p><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/weapon_profile.png\"/><\/p> <p><em>In this example, the Missile Launchers have Range of 20” and roll one Attack Dice per Base in the firing Unit when rolling to hit. The weapons also have the Armour Penetration (1) and Vicious Keywords. This Unit’s Assault weaponry gives 1 Attack Dice per Base, with no additional Keywords.<\/em><\/p>"},{"m":"a.","t":"How to Resolve Shooting","p":"P22","l":1,"h":"<p>Summary of Steps<\/p> <ol> <li>Nominate a target<\/li> <li>Check Range and LOS <ol> <li>In Cover?<\/li> <\/ol> <\/li> <li>Determine Number of Dice to Roll<\/li> <li>Roll to Hit<\/li> <li>Roll to Damage<\/li> <li>Roll to Save<\/li> <li>Remove Casualties<\/li> <\/ol>"},{"m":"b.","t":"1. Nominate a target","p":"P22","l":1,"h":"<p>When a Unit fires, it can select a single enemy Unit to shoot at (Units cannot normally split their fire against multiple targets). The target must be valid however, so players need to check for LOS and Range as follows below. If a target cannot be seen and/or is out of range, a different target must be selected.<\/p>"},{"m":"c.","t":"2. Check LOS and Range","p":"P22","l":1,"h":"<p>The Unit firing its weapons must be able to see its target, and the target must be in range of its weapons. Check LOS for each Base in the firing Unit to Bases in the target Unit. A Base must have partial or Clear LOS to at least one enemy Base to be able to shoot. Next, check the range from Bases that have LOS to the enemy Bases. The range of each weapon a Unit has is listed in its profile. For example, a weapon with a Range of 18”, can shoot at targets up to 18” away, but no further.<\/p> <p>Sometimes, things like artillery weapons may have a minimum range. Targets closer than this minimum range cannot then be shot at. For example a weapon listed with a range of 6-40”, cannot shoot at targets that are closer than 6”, or further away than 40”.<\/p> <p>If a Unit has more than one weapon option they may fire with all eligible weapons (meaning the target must be in range of that weapon!) against the same enemy unit. Any weapons with a maximum range less than the measured distance are not eligible and cannot fire. Some weapons have two (or more) firing modes on their profile, indicated by a two-line profile each with a * as shown below. Every time the unit fires these weapons, the player chooses which mode to use before resolving the shooting.<\/p> <p><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/weapon_profile_2.png\"/><\/p> <p><em>In this example, when firing the Heavy Weapons, the Unit can choose either the TAC Autocannons, or the TAC Missile Launchers.<\/em><\/p> <p>When a Unit fires, check each of its Bases to see which ones are eligible to fire. Some may be out of range or have Blocked LOS to the enemy. Only those Bases with weapons in Range, and that can see at least one enemy Base, may shoot.<\/p> <p><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/los_1.png\"/><\/p> <p><em>Enemy Base X cannot be seen by any of the shooting Unit. Base B cannot see any enemy Bases in the Target Unit.<\/em><\/p> <p><em><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/los_2.png\"/><\/em><\/p> <p><em>Enemy Bases Z are out of the firing Unit’s 12” weapons. Base C is out of Range to any of the enemy Bases.<\/em><\/p>"},{"m":"d.","t":"Attacking Command Units","p":"P23","l":1,"h":"<p>Unless it is a Super-heavy Unit, a Command Unit can only be selected as a target for Shooting (including being intentionally covered by a Blast Template, see page 27) if it is the closest viable target within range and LOS of the shooting Unit.<\/p>"},{"m":"e.","t":"2a. In Cover?","p":"P24","l":1,"h":"<p>Often, the enemy target will get the benefit of being In Cover.<\/p> <p>When is a target In Cover?<\/p> <ul> <li>Bases wholly within some terrain types will be In Cover (see page 36).<\/li> <li>Bases partially obscured by terrain or other Units will be In Cover (see page 11).<\/li> <li>Some special rules or Keywords may mean a Base is In Cover.<\/li> <\/ul> <p>If the majority of Bases in the target Unit (even if they are out of range) are In Cover, or out of sight, from the majority of the eligible shooting Bases the whole target Unit is In Cover. Otherwise, there are no additional penalties to shooting.<\/p> <p>If it’s not entirely clear whether the target is In Cover, the shooting player rolls a die. On a 5+ the target is not In Cover, on 4 or less it is.<\/p> <p><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/cover.png\"/><\/p> <p><em>Here, the majority of the target Unit B are partially obscured or cannot be seen by the majority of shooting Unit A. Therefore, target Unit B is In Cover. Only two Bases in Unit B can be seen at all and so are eligible to be hit and take damage.<\/em><\/p>"},{"m":"f.","t":"3. Determine Number of Dice to Roll","p":"P24","l":1,"h":"<p>Take a number of D8s equal to the number of eligible firing Bases multiplied by the Attack Dice value of the ranged weapons being used. If a Base has multiple ranged weapons, all those in range can be fired. If there are Weapons with different AP values, or Keywords, then dice should be rolled separately for those weapons, or alternatively, use different coloured dice so that both players know which weapons have resulted in a hit.<\/p>"},{"m":"g.","t":"4. Roll to Hit","p":"P25","l":1,"h":"<p>Roll the dice and apply any relevant modifiers to the results. Any dice that then equal or exceed the Shoot value of the firing Unit, will each result in a hit. Modifiers are cumulative unless specified otherwise.<\/p> <p>If, due to modifiers, a player would need to score more than 8 in order to hit, roll anyway, and natural rolls of 8 (regardless of modifiers) are always a successful hit.<\/p> <p>Natural rolls of 1 always miss.<\/p> <p>Standard Shooting Modifiers<\/p> <table> <tbody> <tr> <td>-1<\/td> <td>Target is In Cover<\/td> <\/tr> <tr> <td>-2<\/td> <td>Target has the Fly Keyword. (-1 for Super-heavy target).<\/td> <\/tr> <tr> <td>-1<\/td> <td>Target has the Stealthy Keyword<\/td> <\/tr> <tr> <td>-1<\/td> <td>Shooting Unit has a Pin marker<\/td> <\/tr> <\/tbody> <\/table>"},{"m":"h.","t":"5. Roll to Damage","p":"P25","l":1,"h":"<p>For each hit take a die and roll again. If, due to modifiers or a high Armour value, it is impossible to Achieve the target number, these dice cannot be rolled. In such cases where a target has a high Armour stat, the firing Weapon will need a Keyword like Armour Penetration, to increase its chances of defeating the target’s armour.<\/p> <p>For each die that equals or exceeds the Armour value of the target Unit one Base is removed (see below). The AP (Armour Piercing) of weapons that hit will be added to the rolls to damage, improving the chance to damage.<\/p> <p>Only a single point of damage can be allocated to a Base to destroy it. If more damage is caused than there are eligible Bases to remove, excess damage is wasted. Natural rolls of 1 always fail to damage. If any other modifiers are applicable, they are cumulative, unless specified otherwise.<\/p>"},{"m":"i.","t":"6. Roll to Save","p":"P26","l":1,"h":"<p>Some Units have a Save (n+) value on their profile. This represents supernatural foresight, plain luck, uncanny reflexes, shielding technology, or any other way to evade damage. When a Unit would take damage, roll a D8 for each point of damage potentially suffered. On a score or n or more, that point of damage is cancelled. Finally, allocate any unsaved points of damage as normal onto the Unit’s Bases.<\/p> <p><em>For example, a unit of four Bases with Save (7+) is attacked and would suffer three points of damage. Three save dice are rolled, and one dice rolls 7 or more. Two points of damage are still unsaved, so the unit removes two Bases.<\/em><\/p>"},{"m":"j.","t":"7. Remove Casualties","p":"P26","l":1,"h":"<p>When Bases take damage and are removed, they are considered destroyed. They are removed from the table and are no longer In Play. The player using the Unit suffering casualties chooses which Bases are removed, but only from those that were eligible targets. Bases that were out of LOS from any shooting Bases, or beyond the range of all the firing weapons, cannot normally be removed and so excess damage may be wasted.<\/p> <p>If a Unit loses half or more than its current number of Bases from a single shooting attack, it will receive a Pin marker (see page 34).<\/p> <p><em>e.g. A Unit that currently has five Bases will receive a Pin marker if a shooting attack causes three or more to be removed as casualties.<\/em><\/p>"},{"m":"k.","t":"Shooting and Assaults","p":"P26","l":1,"h":"<p>Units with Overwatch Tokens that were engaged by the enemy in base-to-base contact that Round will have used them to fire at the assaulting enemy in the Movement Phase. Otherwise, Units engaged in an Assault cannot fire any ranged weapons. They are far too busy dealing with the immediate enemy at close quarters.<\/p> <p>Units cannot fire at any enemy Units engaged in Assault either, nor intentionally cover them with a Blast Template. There is too great a risk of inflicting casualties on their own side.<\/p> <p>On the other hand, because of the imposing size of the target, Units are allowed to shoot at enemy Super-heavy Units even when they are engaged in combat. When doing so, non-Blast weapons suffer an additional -1 to hit. Blast weapons can be fired so that they intentionally cover enemy Super-heavy Units, but in this case, they will only hit Super-heavy targets (friend and enemy) – it is assumed they are fired to explode high above any smaller units engaging the Superheavy target.<\/p>"},{"m":"l.","t":"Blast Weapons","p":"P27","l":1,"h":"<p>Some Weapons spread their effects into a wide area, or have shells or other ammunition that explodes. Such weapons have the Blast Keyword and use the 60mm round Blast Templates to show the weapon’s area of effect.<\/p> <p><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/blast_template.png\"/><\/p> <p>Blast weapons can be fired directly at a target point of the table within range and LOS. If the weapon also has the Indirect keyword, they can alternatively be fired at any target point within range, regardless of whether the shooting Unit can see it or not.<\/p> <p>Note that a Unit must have an Overwatch Action Token, and fire in the Overwatch Phase, to fire Indirectly. If only some Bases in the firing unit can see the target point directly, then you must choose whether to fire with the entire unit Indirectly (if they can), or fire directly with the Bases that can see the original target point (before any scatter), while the other Bases hold their fire.<\/p>"},{"m":"i.","t":"Firing Blast Weapons","p":"P27","l":2,"h":"<p><strong>Summary of Steps<\/strong><\/p> <p>Whether a Unit is firing Directly or Indirectly, the steps are the same:<\/p> <ol> <li>Place First Template<\/li> <li>Roll Potential Scatter (Indirect Fire Only)<\/li> <li>Place Additional Templates<\/li> <li>Roll to Hit<\/li> <li>Roll to Damage<\/li> <li>Roll to Save<\/li> <li>Remove Casualties<\/li> <\/ol>"},{"m":"ii.","t":"1. Place First Template","p":"P27","l":2,"h":"<p><strong>Direct Fire<\/strong>: Place a Blast Template, centred on a point on the table one of the firing Unit’s Bases has LOS and range to. In other words, the centre of the Blast Template must be within range and LOS.<\/p> <p><strong>Indirect Fire (Overwatch Phase only)<\/strong>: Place a Blast Template, centred on a point on the table one of the firing Unit’s Bases has range to (it can be out of LOS). In other words, the centre of the Blast Template must be within range.<\/p>"},{"m":"iii.","t":"2. Roll Potential Scatter (Indirect Fire only)","p":"P27","l":2,"h":"<p>If the Unit is firing using Indirect Fire, now roll the Targeting Die (see page 29). If an ‘On Target’ result is rolled, the template lands where intended. If a number is rolled, move the template the distance in inches shown on the die in the direction of the marked point of the die) – the template has “scattered” to here instead. This is then where the first template actually lands (and if it touches the edge of the table, it is removed, together with any other templates that were part of this attack!).<\/p>"},{"m":"iv.","t":"3. Place Additional Templates","p":"P27","l":2,"h":"<p>You now add an additional Blast Template for each additional Base in the Unit that is firing. Usually this is just one per Base, but some Weapons may each fire multiple templates. This is indicated on their profile, for example ‘Blast (2)’. The procedure for placing additional templates is as follows, representing the wider, more indiscriminate area of firing Blast weapons.<\/p> <p>Roll the Targeting Die for each additional template. If an ‘ON TARGET’ is rolled, place the template anywhere you wish touching edge-to-edge with the first template. Otherwise, ignore the number and simply place the template edge-to-edge with the first template in the direction indicated by the marked die point and relative to the centre of the initial template (as shown in the diagram below). Any template that ends up touching the edge of the table is removed instead. Once all templates are placed, they form the entire area affected by the blast (the “area of effect”). Note that additional templates may end up overlapping each other.<\/p>"},{"m":"v.","t":"4. Roll to Hit","p":"P28","l":2,"h":"<p>Now determine how many dice you are going to roll against each Unit covered by the templates in the area of effect by counting the number of Bases in each Unit covered fully or partially by at least one template. Thus, if three Bases in a Unit are covered by templates, three dice are rolled for that Unit. Note that regardless of how many templates are over a particular Base, you only roll to try and hit it once. Now roll to hit against each Unit in turn.<\/p> <p><strong>Direct Fire<\/strong>: Use the SH value of the firing Unit, and all normal modifiers apply (e.g. if target is In Cover).<\/p> <p><strong>Indirect Fire<\/strong>: Use a shoot value of 5+ and normal modifiers apply, except the normal -1 for being In Cover which can be ignored unless the target Bases are inside a building.<\/p> <p>All rolls to hit Bases under a Blast Template have the Sustained Attack keyword (Exploding 8! mechanic).<\/p> <p><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/bblast_example.png\"/><\/p> <p><em>Three Bases have been covered by the Blast Template. The firing weapon has one Attack Die and so two dice are rolled to hit the first Unit and one die against the other.<\/em><\/p>"},{"m":"vi.","t":"5. Roll to Damage","p":"P28","l":2,"h":"<p>For each hit scored, roll to damage as normal. Note that only Bases touched by the Blast Template(s) can be hit and take damage. Such Bases may be out of LOS as an exception to the normal casualty removal rule. Note also that if a template scatters onto a Unit, the Unit is considered to have been targeted (is a target of the attack) for any rule purposes.<\/p>"},{"m":"vii.","t":"6. Roll to Save","p":"P28","l":2,"h":"<p>When a Unit would take damage, roll a D8 for each point of damage potentially suffered. On a score of n or more, that point of damage is cancelled.<\/p>"},{"m":"viii.","t":"7. Remove Casualties","p":"P28","l":2,"h":"<p>Remove any Bases from the Unit that suffer damage as described on page 26.<\/p>"},{"m":"ix.","t":"Using the Targeting Die","p":"P29","l":2,"h":"<p>The Targeting Die has two result types. Their meaning varies slightly whether they are used for placing the initial template (in Indirect Fire,) or the additional templates, as follows.<\/p> <p><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/targeting_die_1.png\"/><\/p> <p><em>When placing the first template (Indirect Fire only)<\/em><\/p> <p><em><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/targeting_die_2.png\"/><\/em><\/p> <p><em>When placing the additional templates<\/em><\/p> <p>Note that the Targeting Die is used with other rules too, and the results will have similar effects (being accurate or showing a direction and distance).<\/p> <p><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/targeting_1.png\"/><\/p> <p><em>In this example of Indirect Fire, the Targeting Die has rolled a 3 Arrow result, so the first Template is moved 3” in the direction indicated.<\/em><\/p> <p><em><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/targeting_2.png\"/><\/em><\/p> <p><em>In this example, the Targeting Die has been rolled twice more to show where to place the other templates [2] and [3] in the barrage being fired, touching the first template [1] in the directions indicated. If an ‘On Target’ result is rolled, the player firing the templates chooses where on the edge to place the template.<\/em><\/p>"}]},{"n":6,"t":"Combat Phase","s":[{"m":"","t":"","p":"","l":2,"h":"<p>In the Combat Phase, only Units that have Combat Tokens may activate, making close-combat attacks or shooting any ranged weapons they have. It doesn’t matter which order players resolve their Units’ actions, so the Combat Phase will be a mix of Units firing and others fighting in close combat. If a unit does not currently have a Combat Token, it cannot be activated in this phase. Note that such a Unit will still fight in an Assault if engaged, but will not have the opportunity to activate and trigger that Assault itself. The player with the Initiative chooses to go first or second. Players then take it in alternating turns to activate their Units one at a time. Otherwise, players cannot elect to pass their turn. Once a player runs out of Units to activate, the other player finishes Shooting or Assaulting with their remaining Units.<\/p>"},{"m":"a.","t":"Shooting","p":"P30","l":1,"h":"<p>When an unengaged Unit with a Combat Token activates, it may shoot with any ranged weapons it has. Shooting follows all the rules already outlined previously in the Overwatch Section.<\/p> <p>Once a Unit has fired its weapons and the effects are resolved, remove the Combat Token from the shooting Unit. When a player activates a Unit with a Combat Token that is not engaged with the enemy, instead of firing, they may choose to simply do nothing (there may be no valid targets) – simply remove the token as that Unit’s activation<\/p>"},{"m":"b.","t":"Assault","p":"P30","l":1,"h":"<p>Units that are in base-to-base contact with each other are said to be engaged in an Assault and must fight each other in close combat. When a player activates an engaged Unit with a Combat Token, both that Unit, and the enemy they are in contact with, fight simultaneously. Both players should follow the process below, finally removing any casualties once they are determined for both sides. Units that are engaged but that do not have a Combat Token themselves will still fight in the assault when it is triggered by any other Unit involved.<\/p> <p>All engaged Units (with or without Combat Tokens) must have fought by the end of the Round. Players cannot choose not to fight.<\/p> <p>Note that while all Bases involved are assumed to fight simultaneously, it is natural and practical for players to take it in turns to roll for their Units’ attacks. The player that triggered the Assault by spending their Combat Token should roll first, including any re-rolls they want to make.<\/p> <p>Summary of Steps<\/p> <ol> <li>All Units involved attack simultaneously. <ol> <li>Allocate attacks.<\/li> <li>Roll to Hit.<\/li> <li>Roll to Damage.<\/li> <li>Roll to Save<\/li> <\/ol> <\/li> <li>Remove casualties.<\/li> <li>Determine Winner. Loser takes Nerve tests.<\/li> <li>Tidy Up <ol> <li>Separate from Vehicles and Super-heavies.<\/li> <li>Units still in contact - Bases Pile-in<\/li> <li>OR<\/li> <li>No Units in contact - Units consolidate. Winner can Pile-in.<\/li> <li>Remove all Combat Tokens.<\/li> <\/ol> <\/li> <\/ol>"},{"m":"i.","t":"1.a Allocate Attacks","p":"P31","l":2,"h":"<p>Not all Bases in the engaged Units may be close enough to fight. Only the following Bases are eligible for attacking in an Assault:<\/p> <ul> <li>Bases that are in base contact with enemy Bases<\/li> <li>Bases that are within 1” of Bases belonging to the same unit which are in base contact with enemy Bases. These Bases are said to be ‘in support’.<\/li> <\/ul> <p><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/allocate_attacks.png\"/><\/p> <p><em>In this example, six Bases of Zombies and five Bases of Peacekeepers are in base contact, or within 1” of those that are to be able to support. All these Bases will roll dice to attack. The Bases marked with a red X are too far away to attack this turn (but could still die later!).<\/em><\/p> <p><strong>Determine Number of Dice to Roll<\/strong><\/p> <p>Take a number of D8s equal to the number of eligible attacking Bases multiplied by the dice value of the Assault (Range “A”) weapons being used. If there are weapons with different AP values, or Keywords, then dice should be rolled separately for those weapons, or alternatively, use different coloured dice so that both players know which weapons have resulted in a hit.<\/p>"},{"m":"ii.","t":"1.b. Roll to Hit","p":"P31","l":2,"h":"<p>Roll the dice and apply any relevant modifiers to the results. Any dice that then equal or exceed the Assault value of the fighting Unit, will each result in a hit. Modifiers are cumulative, unless specified otherwise.<\/p> <p>If, due to modifiers, a player would need to score more than 8 in order to hit, roll anyway, and natural rolls of 8 always hit.<\/p> <p>Natural rolls of 1 always miss.<\/p> <p><strong>Standard Assault Modifiers<\/strong><\/p> <table> <tbody> <tr> <td>-1<\/td> <td>Unit has a Combat (-1) token<\/td> <\/tr> <tr> <td>-1<\/td> <td>Unit has a Pin marker<\/td> <\/tr> <tr> <td>-1<\/td> <td>Unit arrived from Reserve this Round<\/td> <\/tr> <tr> <td>-1<\/td> <td>Unit disembarked from transports this Round into Assault (see page 42)<\/td> <\/tr> <tr> <td>+1<\/td> <td>Infantry and Heavy Infantry vs APCs (see page 46)<\/td> <\/tr> <\/tbody> <\/table>"},{"m":"iii.","t":"1.c. Roll to Damage","p":"P31","l":2,"h":"<p>For each hit, take a die and roll again. If, due to modifiers or a high Armour value, it is impossible to Achieve the target number, these dice cannot be rolled. In such cases where a target has a high Armour stat, the attacking Base will need a Keyword like Armour Penetration, to bring the value down.<\/p> <p>For each die that equals or exceeds the Armour value of the target Unit one Base is removed (see below). The AP (Armour Piercing) of weapons/Bases that hit will modify the rolls to damage by an amount equal to the AP of the attacking weapon, improving the chance to damage.<\/p> <p>Natural rolls of 1 always fail to damage.<\/p> <p>If any other modifiers are applicable, they are cumulative, unless specified otherwise.<\/p>"},{"m":"iv.","t":"1.d. Roll to Save","p":"P31","l":2,"h":"<p>When a Unit would take damage, roll a D8 for each point of damage potentially suffered. On a score of n or more, that point of damage is cancelled.<\/p>"},{"m":"v.","t":"2. Remove Casualties","p":"P32","l":2,"h":"<p>When Bases take damage and are removed, they are considered destroyed. They are removed from the table and are no longer In Play. Starting with the player that has the Initiative, both players alternately choose which Bases are removed from their own Units including Bases that were not eligible to attack.<\/p>"},{"m":"vi.","t":"3. Determine Winner and take Nerve tests","p":"P32","l":2,"h":"<p>Total up all the Bases removed by both sides (across all units) during the Assault. Exclude any lost Resilience Tokens from this count. If one side caused less than the other, they are the Loser. The other side is the Winner. Otherwise it is a draw. Note that if one side is completely wiped out in combat, they are the Loser, regardless of the number of casualties they caused!<\/p> <p>All Units that were involved and on the losing side are given a Pin marker. The Loser, if they have any Units with Bases remaining, must now take a number of Nerve tests equal to the difference their side lost the combat by. For every failed Nerve test, the Loser must immediately remove a Base from any of their Units involved in the fight (no need to roll for damage, no Saves, no Resilience, etc.).<\/p>"},{"m":"vii.","t":"4. Tidy up","p":"P32","l":2,"h":"<p>Firstly, if any Bases are still in base-contact with any Vehicles or Super-heavy Bases, separate them by 1”, with non-Vehicle and non-Super-heavy Bases moving first (unless they are also in contact with another non-Vehicle or non-Super-heavy base, in which case they do not move at all). If both sides have Vehicle or Super-heavy units in the combat, the side with initiative retreats theirs first. If neither Base can move enough to create a 1” gap, they stay engaged. This means in most situations, vehicles and Super-heavy Units will end the Round unengaged.<\/p> <p>Now, if any Units still have Bases that remain in contact with each other, starting with the player with the Initiative, players move (Pile-in) any Bases from the engaged Units that are not currently in base contact with the enemy Unit, into base contact. This follows the normal movement rules, even if this would take them further than their normal Speed. A Pile-in move like this cannot be used to engage Vehicle or Super-heavy Units which previously separated from the Assault. Once Pilein moves have been completed, the Assault will then continue next Round.<\/p> <p>Or, if a Unit no longer has any Bases in contact with the enemy, that Unit may now make a “consolidation” move up to 3”, following the normal movement rules. If this applies to both players, the Winning player (or the one with the Initiative if there was no Winner) may choose to go first or second. If the Winner goes first, they may choose instead to move their Units back into basecontact with the Loser’s Units (see Pile-in above), to continue the Assault next turn. Otherwise, Units should be separated as per the normal minimum distances (i.e. 1” for both Friendly Units and Enemy Units). A consolidation move therefore cannot be used to move to engage a new enemy Unit. Finally, remove any Combat Tokens from all the Units involved in the fight.<\/p>"},{"m":"viii.","t":"Ongoing Assaults","p":"P32","l":2,"h":"<p>Units that are still engaged will continue to fight in the next Combat Phase. Instead of an Action Token, they will each receive a Combat Token at the start of the next Round.<\/p>"},{"m":"ix.","t":"Multiple Combats","p":"P33","l":2,"h":"<p>Some Assaults will involve more than two Units. In such cases, the rules remain the same – all participants from all Units that are in base contact with each other will fight simultaneously.<\/p> <p>Any Base that is in base contact with multiple enemy Units may choose which to allocate all its attack dice to.<\/p> <p>If a base is in contact with just one of the enemy units, it must direct its attacks against that unit. Bases that are in support can always choose to allocate their attacks against ANY enemy unit their unit is engaged with, regardless of their position. Make it clear to your opponent, which attacks are being allocated where.<\/p> <p><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/multiple_combats.png\"/><\/p> <p><em>The Assault Enforcer Unit (AE) is engaged with the Zombie Unit (ZM). Base E must allocate its attacks to the Zombies as it is only in base-contact with them. The supporting Base F must also allocate its attacks to the Zombies, as its Unit is not engaged with any others, even though it is a multiple combat. The Peacekeeper Unit (PK) is engaged with both the Zombies and the Ghouls (GH). Base B must allocate its attacks to the Zombies as it is not in base-contact with any other Units. Base A may choose which of the two enemy units it is engaged with to allocate its attacks. The supporting bases C and D can also allocate their attacks to either of the enemy units that their unit is engaged with (the Ghouls or the Zombies).<\/em><\/p>"}]},{"n":7,"t":"Pinning","s":[{"m":"a.","t":"Pinning and Pin Markers","p":"P34","l":1,"h":"<p>Some weapons or rules will place a Pin marker on a Unit. A Unit can have a maximum of one Pin marker on it.<\/p> <p><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/pin_marker.png\"/><\/p> <p>While a Unit has a Pin marker, it suffers an additional -1 to-hit modifier both for Shooting and for Assault. In addition, if a Unit starts a Round with a Pin marker, it must be given an Advance Token. Also, while a Unit with US 2 or more has a Pin marker, its US counts as 1. A Unit will gain a Pin marker in the following circumstances:<\/p> <ul> <li>A Unit loses half or more of its current number of Bases from a single shooting attack.<\/li> <li>A Unit loses an Assault.<\/li> <li>A Unit is hit by any weapons with the Pinning Keyword, even if no casualties are suffered.<\/li> <li>Bases in a Unit survive being in a destroyed transport vehicle.<\/li> <li>Remember that Pin markers can be removed during the End Phase.<\/li> <\/ul>"}]},{"n":8,"t":"End Phase","s":[{"m":"","t":"","p":"","l":2,"h":"<p>Once all Combat Tokens have been spent in the Combat phase, no unit should have any Action or Combat Token left. It is time to move to the End Phase, during which you need to work your way through the following steps.<\/p>"},{"m":"a.","t":"Trigger ‘End phase’ special rules","p":"P34","l":1,"h":"<p>Any special rules with effects that take place in the End Phase are carried out now.<\/p>"},{"m":"b.","t":"Roll for Pin markers removal","p":"P34","l":1,"h":"<p>Players take a Nerve test for each of their Units with a Pin marker. If the test is passed, the Pin marker is removed. Command Units, and Units within Command radius of a friendly Command Unit, each roll two dice for these tests and choose the highest.<\/p>"},{"m":"c.","t":"Check victory conditions","p":"P34","l":1,"h":"<p>Players will add any Victory Points to their running total at this point in the End Phase. Players then check the Scenario conditions to see if someone has achieved victory. If not, turn over any Dynamic Objective markers on the table to their other side (so active becomes inactive, and vice versa). The game then continues and the next Round starts with the Command Phase.<\/p>"},{"m":"d.","t":"Remove other markers/tokens","p":"P34","l":1,"h":"<p>At this point, players must remove any tokens/markers that show that a unit is under the effects of a rule that ‘lasts until the end of the Round’. Unless differently specified in a special rule, the only markers/tokens left on the table should be any Pin markers that Units failed to clear.<\/p>"}]},{"n":9,"t":"Terrain","s":[{"m":"","t":"","p":"","l":2,"h":"<p>The battlefields of the future are littered with opportunities to use terrain to stay alive. Terrain can also hinder movement and provide safe blocking features, sheltering your troops from enemy fire. Not all terrain affects infantry and vehicles in the same way. What may be merely difficult for one Unit to move through, may be impassable for another.<\/p>"},{"m":"a.","t":"Terrain and Line of Sight","p":"P36","l":1,"h":""},{"m":"i.","t":"Units inside Terrain","p":"P36","l":2,"h":"<p>Units inside terrain features such as ruins, or craters, can see and be seen, LOS is not affected.<\/p>"},{"m":"ii.","t":"Woods","p":"P36","l":2,"h":"<p>Because of the dense foliage, LOS to and from Bases in a wood is Blocked if it goes through more than 2” of wood. If LOS goes though 2” or less of wood, the target is partially obscured and therefore is automatically in cover. It follows that the ideal position for a base in a wood is to be wholly inside the wood and in contact with the edge of the wood. That means that the base will be able to shoot out of the wood without conferring cover to its targets, as long as LOS is measured from the point where the base touches the wood (see diagram).<\/p> <p><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/woods.png\"/><\/p> <p><em>Three of the Bases from the Unit of Ghouls are on the edge of the wood and so can see, and draw LOS clear of the wood from those points. All the Bases of the HMGs Unit are entirely within the wood and cannot do this, therefore all of their targets will benefit from cover, and some may not be have LOS at all if there is more than 2” of wood in the way.<\/em><\/p>"},{"m":"b.","t":"Terrain Height","p":"P36","l":1,"h":"<p>Some suggested Terrain Heights are as follows. For comparison, keep in mind that a man-sized unit is Height 2, while tanks and most other vehicles are Height 3.<\/p> <table> <tbody> <tr> <td>Type<\/td> <td>Height<\/td> <\/tr> <tr> <td>Broken ground / crater<\/td> <td>0<\/td> <\/tr> <tr> <td>Hill<\/td> <td>3<\/td> <\/tr> <tr> <td>Marsh/River<\/td> <td>0<\/td> <\/tr> <tr> <td>Wood<\/td> <td>4<\/td> <\/tr> <tr> <td>Low height building<\/td> <td>4<\/td> <\/tr> <tr> <td>Medium height building<\/td> <td>6<\/td> <\/tr> <tr> <td>Tall building<\/td> <td>8<\/td> <\/tr> <tr> <td>Wall/hedge/fence/ barricade<\/td> <td>1<\/td> <\/tr> <\/tbody> <\/table> <p>Terrain can block LOS to any Bases behind it in the same way as a Unit. For example, a Height 3 or higher hill will block LOS between two Bases of Height 3 or less. Some terrain pieces such as rivers will be flat (Height 0) and so never block LOS.<\/p> <p>If a Unit is positioned on (not in) terrain (e.g. a hill), then add the height of the terrain to the height of the Unit when determining LOS (e.g. on a hill). While a Unit is occupying a building then it has the Height of that building.<\/p> <p><em>Example: a Unit of Height 2 will determine LOS using a Height of 5 when standing on a Height 3 hill. The same Unit occupying a Medium height building will have a Height of 6.<\/em><\/p>"},{"m":"c.","t":"Terrain and Movement","p":"P37","l":1,"h":""},{"m":"i.","t":"Open Terrain","p":"P37","l":2,"h":"<p>The normal battlefield may have small undulations or debris across it but it does not impact on a Unit’s movement. Unless specified otherwise, all battlefield areas are Open terrain by default.<\/p>"},{"m":"ii.","t":"Difficult Terrain","p":"P37","l":2,"h":"<p>If a terrain feature is Difficult for a Unit to move through, its movement is restricted. Even if Sprinting, a Unit can only move up to the first of its Speed values (Advance Speed), if any part of the move starts, ends or goes through the Difficult Terrain.<\/p>"},{"m":"iii.","t":"Impassable Terrain","p":"P37","l":2,"h":"<p>If a terrain feature is Impassable for a Unit, it cannot be moved into or through.<\/p>"},{"m":"iv.","t":"Typical Terrain Features","p":"P37","l":2,"h":"<p>How different terrain elements, typically found on most Epic Warpath tables, affect the different Unit Types is detailed below.<\/p> <p><strong>Broken Ground/Rubble/Craters: Height 0<br/><\/strong>Non-vehicle and non-Super-heavy Bases wholly inside this feature are always In Cover.<br/>Infantry/Heavy Infantry/Walkers/Super-heavy: Open<br/>Bikes/Vehicles: Difficult<\/p> <p><strong>Roads: Height 0<br/><\/strong>Vehicle and Bike Units making their entire Move along a road, can add up to 3” extra to an Advance move and up to 6” extra to a Sprint move.<br/>All Units: Open<\/p> <p><strong>Ruins: Height 4<br/><\/strong>Non-Super-heavy Bases wholly inside this feature are always In Cover.<br/>Infantry/Heavy Infantry/Walkers: Open<br/>Bikes/Vehicles/Super-heavy: Difficult<\/p> <p><strong>Marsh/River: Height 0<br/><\/strong>Infantry/Heavy Infantry/Walkers/ Super-heavy: Difficult<br/>Bikes/Vehicles: Impassable<\/p> <p><strong>Low Wall/Hedge/Barricade: Height 1<br/><\/strong>Infantry/Heavy Infantry/Super-heavy: Open<br/>Bikes/Walkers/Vehicles: Difficult<br/>Bases in contact with this terrain may ignore it when drawing LOS to targets.<\/p> <p><strong>High Wall/ Barricade: Height 2<br/><\/strong>Super-heavy: Open<br/>Infantry/Heavy Infantry/ Walkers: Difficult<br/>Bikes/Vehicles: Impassable<\/p> <p><strong>Hill: Height 3<br/><\/strong>All Unit types treat hills as Open.<\/p> <p><strong>Woods: Height 4<br/><\/strong>Bases wholly inside this feature are always In Cover.<br/>Infantry/Heavy Infantry: Open<br/>Bikes/Walkers/Vehicles/Super-heavy: Difficult<br/>LOS is blocked if it goes through over 2” of wood, and if LOS goes though 2” or less of wood, the target is automatically in cover.<\/p> <p><strong>Intact Building: Height 4 or more<br/><\/strong>Bases wholly inside this feature are always In Cover.<br/>Infantry/Heavy Infantry/Walkers: Open<br/>Bikes/Vehicles/Super-heavy: Impassable<br/>Low level buildings (e.g. a warehouse or small office building) should be Height 4. Taller buildings should be Height 6 or more.<\/p>"}]},{"n":10,"t":"Buildings","s":[{"m":"a.","t":"Entering Buildings","p":"P38","l":1,"h":"<p>Only Units and Bases of type Infantry, Heavy Infantry and Walker may enter buildings (any transport Vehicles must remain outside!). A building may only contain a single unit at a time, and it may only contain a certain number of Bases. This is the building’s Capacity and it is normally equal to three Bases for each 2” square parts of building (see diagrams below). It is best if you agree with your opponent at the start of the game what the capacity of each building on the table is going to be.<\/p> <p><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/building_1.png\"/><\/p> <p><em> This building has roughly two 2”x2” parts and so has Capacity (6).<\/em><\/p> <p><em><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/building_2.png\"/><\/em><\/p> <p><em>This building has roughly three 2”x2” parts, so has Capacity (9).<\/em><\/p> <p>In order to enter a building, all Bases in the Unit must have enough movement to reach the building. If not all the Bases in a Unit have the movement to reach the building (or the building does not have enough Capacity for the Unit), the whole Unit must remain outside.<\/p> <p>If all the Bases reach the building, then the Unit is placed on the building roof where possible, with any Bases that don’t fit being put off the table to one side. The unit is now occupying the building. From that point on, all ranges and Line of Sight for the unit are measured to/from the building itself, as if the footprint of the building was the footprint of the occupying Unit. All Bases inside the building are assumed to be both visible and able to see out of the building.<\/p>"},{"m":"b.","t":"Leaving Buildings","p":"P38","l":1,"h":"<p>To leave a building in later Rounds, a Unit must be given a Sprint or Advance action. A Unit cannot enter and leave the same building in the same Round, unless it is to move to an adjacent section in a large building (see page 40).<\/p>"},{"m":"c.","t":"Buildings and Shooting","p":"P38","l":1,"h":"<p>While occupying buildings, Units have the Height of the building. They are In Cover and have +1 Armour when shot at. For example, a Unit with an Armour value of 5+, would have it increased to 6+ while in a building.<\/p> <p>If the unit inside a building is hit by a weapon with the Demolisher Keyword, there is chance the building might also collapse. Before resolving the hits on the unit in the building, roll a single die to damage the building itself. Buildings have an AR of 9+. If a building is destroyed, replace it with a Ruins terrain element in the same footprint (of a Height equal to half the Height of the building). Any Bases that were occupying the building are immediately destroyed (with no chance to use Saves or Resilience tokens or anything else). If the building is not destroyed, then proceed with resolving the hits against the target unit. Units with Demolisher weapons can also deliberately target unoccupied buildings with their Shooting attacks. If they score at least one hit on the building, roll a single die to damage the building as described above.<\/p>"},{"m":"d.","t":"Buildings and Blast weapons","p":"P39","l":1,"h":"<p>If any Blast Template from a shooting attack has its centre point on the building, the shell has hit the building and all Bases in the building are considered to be covered by the template. If a Blast Template is not centred on the building but touches the building, then just one of the Bases in the building is considered to be covered by the template for each template touching the building (up to a maximum of the number of Bases in the building). In either case, Bases outside buildings that are under templates can still be hit as normal.<\/p> <p><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/buildings_and_blasts.png\"/><\/p> <p><em>In this example, the building has been touched by two of the Blast Templates, so two Bases are considered covered by the area of effect (or a single Base if the Unit consisted of a single Base).<\/em><\/p>"},{"m":"e.","t":"Buildings and Assault","p":"P39","l":1,"h":"<p>A Unit cannot move into an enemy-occupied building. It must Assault from outside the building instead. If a Unit Assaults a Unit in a building, the attack is always Hindered. Assaulting Bases are moved into base-to-base contact with the building itself to count for the following combat and are then considered Engaged with the Unit inside.<\/p> <p>Bikes may Assault buildings but cannot enter them, and suffer an additional -1 to hit modifier in the Assault, as well as being Hindered. Vehicles cannot Assault Units in buildings.<\/p> <p>All Bases in the building, and all Bases in contact with it (plus assaulting Bases in support position of those in base contact with the building) fight in the ensuing Assault. Bases may allocate their attacks to any enemy Units involved. Declare how all units allocate attacks before resolving any unit’s attacks. If the occupying Unit loses, any Nerve tests it must then take have a +2 modifier.<\/p> <p>If, after any Nerve tests are taken, the attackers wipe out all occupying defenders, any surviving attackers may move into the building as a consolidation move (if the building is not Impassable to them and if they can all fit!). If they don’t fit in the building, they can make a normal consolidation move outside the building instead. Otherwise, the occupying unit remains in place and the attacking Unit(s) remain at the base of the building. Super-Heavy Units will separate as normal.<\/p> <p>For both ongoing and multiple assaults, attacks allocated against the Unit occupying the building will still be Hindered. Use a Combat (-1) token as a reminder, but the -1 for being Hindered will not actually apply if any attacks are allocated to other Units outside the building (unless the Unit has been Hindered generally for some other reason!).<\/p> <p>A Unit with Assault Demolisher weapons can deliberately target any building (occupied or not) it is in base contact with, in an Assault. The Unit must allocate all its Assault attacks to the building, but has a +1 modifier to hit it. If the Unit scores at least one hit on the building with a weapon with the Demolisher keyword, roll a single die to damage the building as described in the shooting section above. Any Bases subsequently destroyed inside the building will count towards determining the Winner/Loser of the Assault.<\/p>"},{"m":"f.","t":"Large Buildings","p":"P40","l":1,"h":"<p>Sometime, you may wish to split larger buildings into connected sections, each with its own Capacity. Treat each section as its own building for the purposes of moving, LOS and shooting. If a unit moves from one section to another adjacent one, it can do so with an Advance or Sprint action. If the section is occupied, it must fight a Hindered Assault as normal against the enemy Unit in the adjacent section, but remains in its own section if it fails to destroy the enemy Unit.<\/p> <p>A Unit can shoot at an enemy Unit in an adjacent section, following the normal rules for firing at units in buildings. A particularly tall building could potentially be split into sections. This requires some discussion between the players however, but a Unit occupying a section would still have the Height of that section.<\/p> <p><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/buildings_big_1.png\"/><\/p> <p><em>In this example, the building has roughly five 2”x2” parts, and one area of the building model is much taller. The players decide the split the building into two sections.<\/em><\/p> <p><em><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/buildings_big_2.png\"/><\/em><\/p> <p><em>The shorter Height 4 (blue) area is declared a section with Capacity (9) while the taller Height 6 (red) area is declared a section with Capacity (6).<\/em><\/p>"}]},{"n":11,"t":"Transport Vehicles","s":[{"m":"a.","t":"Capacity","p":"P41","l":1,"h":"<p>Some Vehicles may transport other Friendly Units. Such Units will have a Capacity(n) listed for them, where (n) is the number of Bases each Vehicle in the Unit can carry. Unless specified otherwise, only friendly Infantry or Heavy Infantry Bases can be carried in Units with a Capacity(n).<\/p> <p>A Unit of transport vehicles can normally only carry a single friendly Unit (no mixed Units being transported). Likewise, a Unit cannot be embarked within more than one transport Unit. The transport vehicle Unit and the transported Unit are assigned a single Action Token. If you need to measure the range to a Unit that is being transported, measure the range to the closest of their transports.<\/p>"},{"m":"b.","t":"Entering and Leaving Transport Vehicles","p":"P41","l":1,"h":"<p>Entering and Leaving Transport Vehicles Units cannot both enter and exit transport vehicles in the same Round.<\/p>"},{"m":"i.","t":"Entering a Transport","p":"P41","l":2,"h":"<p>When a unit moves to enter a transport vehicles unit, simply measure to the base of any of the vehicles. If not all the Bases in a Unit can reach a vehicle the whole Unit must remain outside. If all the Bases reach a vehicle, then the unit is removed from the table and set aside. It is assumed they are inside the vehicles. After troops have entered transport vehicles, the vehicles are free to activate and move as normal.<\/p> <p>Units in a vehicle cannot shoot or be shot at, and they cannot be Assaulted directly. Of course, the vehicles themselves can still be shot at or Assaulted as normal.<\/p>"},{"m":"ii.","t":"Shooting at loaded Transports","p":"P41","l":2,"h":"<p>If a unit of loaded transports takes damage from ranged attacks and loses vehicles, the transported unit takes a number of hits equal to the number of destroyed transports multiplied by their Capacity. Roll to damage the transported unit as normal, with no AP modifier or any other rule or modifier – just a straight roll against their Armour.<\/p> <p>If after resolving these hits the transport Unit no longer has enough total Capacity to carry the remaining Bases in the transported unit, you have two choices.<\/p> <p>The first option is to remove enough Bases from the transported unit to ensure the Unit still fits into the remaining transports (the removed Bases count as destroyed unfortunately, but you can imagine they are retreating back to base!).<\/p> <p>The second option is for the Unit to immediately make an emergency disembarkation - place all remaining transported Bases in contact with the surviving transports, or as much as possible within the footprint of the transport vehicles if the transport unit has been wiped out. If some of the transported Bases cannot be placed as described above because of physical constrains like impassable terrain or enemy units (which they must be able to be at least 1” away from), these Bases are destroyed – they were trapped in the burning wrecks of their transports. Finally, place a Pin marker on the disembarked unit and discard any Token they (and their transports) had.<\/p> <p>For example, a Unit of four transports (Capacity 2) are transporting a unit of Infantry made of seven Bases. The transports are shot at and lose two vehicles. The transported Unit takes four hits (i.e. two destroyed vehicles with Capacity 2 each). The enemy rolls to damage and destroys two transported Bases. The unit has now five Bases in a transport unit with total Capacity of 4. The player can decide to either remove one more Base and carry on, or the remaining five bases must leave the transports immediately, as described above.<\/p>"},{"m":"iii.","t":"Assaulting loaded Transports","p":"P41","l":2,"h":"<p>If a transport Unit is assaulted and engaged by an enemy Unit and the Unit inside can still activate (even if it has an Overwatch Action Token, although it will not get to shoot), when it does so, it has two choices. It can either remain inside the vehicles, or it can counter-assault the enemy Unit(s) that have assaulted the vehicles. If the Unit decides to counter-assault, then as many of its Bases as possible are placed directly into base contact anywhere with the enemy Bases that assaulted the vehicles, or into support position if there is no space for base contact. Give the Unit a -1 Combat Token for disembarking from the vehicle into Assault (it can no longer activate in the Movement Phase). If there is not enough room for all of the embarked Bases to get out in this way, the Unit must remain onboard, unactivated.<\/p> <p>If the transported Unit has already activated or has remained onboard, and the loaded transports then take damage in an assault, first resolve the assault completely, including consolidation moves. Then roll for the damage on transported Units caused by their transports being destroyed (both by enemy attacks and by failed Nerve tests!). Finally, if the transported unit no longer fits in the remaining transports, it must make an emergency disembarkation, or lose the surplus Bases, as described above.<\/p> <p><em>For example, a unit of four transports (Capacity 2) are transporting a unit of Infantry made of seven Bases. The transports are assaulted and lose two vehicles to enemy attack. They lose the combat and then lose another transport to a failed Nerve test. The transported unit takes six hits (i.e. three destroyed vehicles with Capacity 2 each). The enemy rolls to damage and destroys three transported Bases. The unit has now four Bases in a transport unit with total Capacity of 2. The player can remove two further Bases, or the remaining four Bases must immediately make an emergency disembarkation from the remaining transport, as described above. <\/em><\/p>"},{"m":"iv.","t":"Leaving a Transport","p":"P42","l":2,"h":"<p>If a Unit activates and leaves its transport before the vehicles move, the vehicles are free to move in their own activation as they wish. Simply leave the Action Token with the vehicle Unit to spend later.<\/p> <p>If the transport vehicles activate and move before the troops inside activate, the vehicle receives a Combat Token as normal. The transported unit may immediately activate for free once the vehicles’ action is complete, in order to disembark as below. Alternatively, the transported unit may choose to remain inside the vehicles and wait to activate and disembark later, in which case leave the Action Token next to the vehicles, together with their Combat Token. This shows that the Combat Token applies to the vehicles, while the Action Token applies to the transported unit.<\/p> <p>When disembarking, if the transport vehicles moved using an Advance action, the troops inside may subsequently leave and Advance as normal. If the transport vehicles moved using a Sprint action, the troops inside may not disembark if the vehicles moved more than their Advance Speed value. Otherwise, they may disembark and make their Sprint move, but only as far as their own Advance Speed value. They are still permitted to engage enemy Units in an Assault, but will have a Combat (-1) token for doing so. If an assaulting unit disembarking from a transport would be Hindered by terrain or other effects too, then they receive a second Combat (-1) token and will suffer a total of -2 modifier on their rolls to hit. Double Hindrance!<\/p> <p>To leave a transport, in either case, simply measure the move of the Bases from the vehicle they are leaving (up to a maximum of n Bases per vehicle), ending the move in Coherency, as normal. If the Unit of vehicles had a Pin marker, place a Pin marker on the disembarked Unit too. In either case, place Combat Tokens on both the vehicle and troops Units if appropriate.<\/p> <p>If a transport Unit assaults an enemy Unit that has an Overwatch action, resolve the Overwatch fire after any transported Unit disembarks for free. Assuming the transported Unit also assaults the Unit with Overwatch, the Overwatch fire may be resolved against either attacking Unit (vehicles or troops), otherwise it is resolved as normal.<\/p>"},{"m":"v.","t":"Pinning and Transports","p":"P43","l":2,"h":"<p>If a Unit of Transport Vehicles receives a Pin marker, any Unit inside will also receive a Pin marker. If a Unit with a Pin marker boards a Transport Vehicle Unit, it may immediately make a free Nerve test to remove the Pin marker, just like in the End Phase (so proximity to a Command Unit will help too). If they fail, they keep the Pin marker until they can next try to shake it off.<\/p>"},{"m":"vi.","t":"Command Transports","p":"P43","l":2,"h":"<p>Sometimes, Command Units are transported inside a Vehicle. While the Command Unit is embarked, the transport Unit is also considered a Command Unit, for the purposes of receiving Action Tokens and being targeted. As soon as a Command Unit leaves a transport, the transport Unit reverts to its normal non Command status (although keeps any Action Token it still has to use this Round).<\/p>"},{"m":"vii.","t":"Command Units that are Transports","p":"P43","l":2,"h":"<p>Sometimes, a Command Unit will have a Capacity and can therefore transport other, non-Command Units. As a Command Unit, it will receive both a Overwatch and a Sprint token when action tokens are assigned. Any non-Command Units transported inside, may each select either a Sprint or Advance action token, rather than getting the same as the transport as normal.<\/p>"}]},{"n":12,"t":"Fliers","s":[{"m":"a.","t":"The Fly Keyword","p":"P44","l":1,"h":"<p>Units with the Fly Keyword are mounted on round flying bases. They operate above the battlefield and suffer less restriction of movement than their counterparts on the ground. They have a larger Coherency than usual and must remain with 3” of Bases in the same Unit, instead of the normal 1”.<\/p> <p>In the Command Phase, Fliers can only be given Sprint or Advance tokens and they cannot engage enemy Units in Assault (nor can they be Assaulted). Fliers have a Front Arc and rear Arc, which are defined by drawing a line directly through the middle of the flying base. These Arcs are used for their Movement and Shooting rules, as described below.<\/p> <p>Remember that Fliers do not block LOS.<\/p> <p><em>In front of the centre line is considered the Flier’s Front Arc<\/em><\/p> <p><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/flier_arc.png\"/><\/p> <p><em>Behind the centre line is considered the Flier’s Rear Arc<\/em><\/p>"},{"m":"b.","t":"Flier Movement","p":"P44","l":1,"h":"<p>A Flier must end its move at least the Advance value of its Speed stat from where it started each Round, and wholly within the Flier’s Front Arc (relative to its starting position and direction), otherwise it is immediately destroyed. In other words, Fliers can’t suddenly fly backwards!<\/p> <p>After completing its move, a Flier may be pivoted to face in any direction – so plan your next move carefully! Also, if a unit of Fliers consists of more than one Base, make sure the Bases are facing approximately the same direction, otherwise it may be impossible for all of them to end their next move in Coherency! If this was to happen, you will have to choose which Bases complete their move and which are destroyed. <\/p> <p>Fliers may move over any other Bases (friend or foe) or terrain without penalty. They may only finish their move over terrain the model itself can safely stand on without falling over. They must also still respect Unit Coherency and proximity rules. Conversely, enemy Units on the ground that are less than Fliers’ Height, may move under them, so long as then end their move 1” or more away from them.<\/p> <p>While moving over, or stopping above terrain, Fliers have a Height relative to the terrain’s Height plus their own.<\/p>"},{"m":"c.","t":"Shooting at Fliers","p":"P44","l":1,"h":"<p>Fliers are fast, difficult targets to hit. As such, all shooting at Fliers is resolved with a -2 to-hit modifier. This is reduced to -1 if the target is a Super-heavy Unit.<\/p> <p>Weapons with a range of 15” or less used by non-Fliers cannot shoot at them. Also, as an exception to the normal rule, when non-Fliers are shooting at Fliers, even rolls of natural 8s do not hit if the number required is more than 8 (and therefore the Exploding 8! mechanic would also not apply in this instance).<\/p> <p>Fliers cannot be hit by Blast weapons firing Indirect. They can be hit by Blast weapons firing directly, but if the firing player wants to do that, they must declare that the weapon is firing an “air burst” barrage, which can only hit Fliers and not ground units.<\/p>"},{"m":"d.","t":"Flier Weaponry","p":"P44","l":1,"h":"<p>Normally, Fliers can only fire their weapons against Bases that are wholly in their Front Arc.<\/p>"},{"m":"e.","t":"Objectives and Fliers","p":"P44","l":1,"h":"<p>Fliers cannot claim Objectives unless they are Hovering (see below).<\/p>"},{"m":"f.","t":"Units transported by Fliers","p":"P45","l":1,"h":"<p>Some Fliers will have a Capacity and can transport troops. Units must start the game aboard the Flier and no Unit may enter a Flier during the game. Only Units with the Anti-Grav Keyword, or the Droptroop Keyword may be transported and exit from a flier unless it has the Hover Deployment Keyword (see below), and follow the normal rules to do so. Transported Units onboard a Unit of Fliers that loses Capacity (e.g. due to casualties) automatically lose Bases down to the remaining Capacity of the flying Unit – there is no chance to disembark.<\/p>"},{"m":"g.","t":"Hover Deployment","p":"P45","l":1,"h":"<p>If a Unit of Fliers has the Hover Deployment Keyword, it may act as a transport for any troops, not just those with the Anti-Grav or Drop-troop Keywords.<\/p> <p>In a Round when the transported troops wish to disembark, the flying Transport Unit must declare it is Hovering at the end of its movement and cannot end its movement in Impassable Terrain. Any Base attempting to Hover in Impassable terrain, or disembark in Impassable terrain, is destroyed. the Anti-Grav or Drop-troop Keywords.<\/p> <p>Place a Status Marker on the Unit – Hovering will last until the end of the Round. While Hovering the flying Unit has a Height of 3, cannot have any Combat Tokens, loses the Fly keyword and can claim Objectives. While it is Hovering, all the normal rules for troops leaving transports (and for transports being destroyed) apply. Units may Hover at others times, even if not disembarking troops. Note that units cannot enter Hovering Units.<\/p> <p>A Unit that was Hovering in a previous Round, may choose to not Move and continue to Hover. To do this, it receives an Overwatch token and another Status Marker when Mandatory Action tokens are placed and another Hover is declared.<\/p>"}]},{"n":13,"t":"Keywords","s":[{"m":"a.","t":"Keywords List","p":"P46","l":1,"h":""}]},{"n":14,"t":"Scenarios","s":[{"m":"a.","t":"Scenario Types","p":"P51","l":1,"h":"<p>In Epic Warpath, armies will clash over land, strategic objectives, or just to crush the enemy. This can be as part of a brief encounter, or as a key battle in a larger engagement or story. Each game played will therefore have a specific Scenario that the players are trying to achieve as they battle for victory.<\/p> <p>There are two types of Scenarios you can choose from:<\/p> <ul> <li><strong>Battle Scenarios<\/strong> for more balanced and competitive play. These are covered in this section of the book.<\/li> <li><strong>Narrative Scenarios<\/strong> for more story-driven games. These are not included in this book, and will instead be published in expansions, articles and other support material for Epic Warpath – keep your eyes peeled!<\/li> <\/ul>"},{"m":"b.","t":"Battle Scenarios","p":"P51","l":1,"h":"<p>You have your models and you found an opponent, so now you want to play a Battle Scenario game! There are a few easy steps to go through to set one up.<\/p> <ol> <li>Decide on the Game Size<\/li> <li>Choose your Armies<\/li> <li>Place Terrain<\/li> <li>Agree Game Length<\/li> <li>Determine the Scenario Parameters <ol> <li>Place Objectives<\/li> <\/ol> <\/li> <li>Recon Roll and Deployment<\/li> <li>Begin the Game!<\/li> <\/ol>"},{"m":"i.","t":"1. Decide on the Game Size","p":"P51","l":2,"h":"<p>You can play Epic Warpath with just a few units per player, without worrying about the two sides being equally matched. This is great for learning the game, but after you’ve become familiar with the rules and have amassed a larger collection of models, you will want to play games where the armies facing one another across the battlefield are balanced, so that both players have an equal chance of winning the game (at least to start with!).<\/p> <p>In order to achieve this, both players must pick an army before the game by spending a number of ‘points’.<\/p> <p>For smaller games, players will each have around 1,000-1,500 points to spend. This is great for a table size of 4’x 4’. For games at 2,000-3,000 points or more, you should use a larger 6’x4’ table. For larger games still, you’ll need a bigger table to play on!<\/p>"},{"m":"ii.","t":"2. Choose Your Armies","p":"P51","l":2,"h":"<p>Each player now picks units from their chosen list in the Army Lists section (see page 61) to build their army. Each Unit costs a certain amount of points, as shown in its entry. More powerful or specialist Units will cost more points. Players keep adding their Unit costs until they have reached the total agreed for the game. You can, of course, spend less than the agreed total, but you cannot spend even a single point more. However, an army is still considered to be the size of the maximum total the players agreed on (e.g. 1995 points is still considered to be a ‘2,000 point army).<\/p> <p>For more information on how to choose Units and build an army, see the Army Lists section.<\/p>"},{"m":"iii.","t":"3. Place Terrain","p":"P52","l":2,"h":"<p>Battlefields are rarely totally flat, featureless wastelands. They will invariably be small hills, vegetation, and buildings or ruins scattered across the land. Unless the Scenario specifies terrain placement you should follow the advice below for giving a dramatic and tactically exciting landscape to fight over.<\/p> <p>As a rough guide to get started, select two pieces or areas of terrain (up to 6” x 6” in area) for each 24” square area of the table. You should place between half and up to the same number of linear obstacles (or a similar equivalent) on the table in the same manner. Place all terrain in a mutually acceptable manner.<\/p> <p><em>For example, when playing on a 4’ x 4’ table, you would place a total of eight pieces of terrain roughly 6”x6” each, and then between four and eight smaller linear obstacles or other similar items. <\/em><\/p> <p>Of course, if you and your opponent agree, you can have as much or as little terrain as you want! Tournaments and events may well have set terrain at each table. It’s a good idea to avoid having buildings, or building sections, straddling the edge of deployment zones. This may mean nudging a building once the zones are determined. Of course, this is up to the players - the terrain may be specific to telling a story in a narrative game - but a tournament organiser may wish to stipulate this.<\/p>"},{"m":"iv.","t":"4. Agree Game Length","p":"P52","l":2,"h":"<p>Battle Scenarios normally last 5 Rounds. At the end of Round 5, roll a die. If the score is 4 or less, the game ends immediately. On a 5+, play Round 6 and then the game ends. At game end, check final scoring and victory conditions to determine the winner.<\/p> <p>Of course, players can agree to play fewer or more Rounds, or instead to end the game at a certain time of the day or other condition (e.g.: ‘let’s play until 5pm, at which point we finish the Round and then stop’, or ‘first to 25VPs is the winner’).<\/p>"},{"m":"v.","t":"5. Determine the Scenario Parameters","p":"P52","l":2,"h":"<p>Each Battle Scenario is defined by the following four Parameters, which detail a number of elements that will affect how the game is set-up and played:<\/p> <ol> <li>Deployment Zones<\/li> <li>Objectives<\/li> <li>Scoring<\/li> <li>Reserves Ratio<\/li> <\/ol> <p>After setting up the terrain, roll a die on each of the four Scenario Parameters charts in the following pages and follow the instructions.<\/p> <p>You are, of course, free to create your own scenarios, with pre-determined objectives, scoring and deployments. You might be recreating a famous battle, or playing a set game in a narrative campaign you have written. However, the Scenario Parameters below present an exciting alternative, randomly creating the battle conditions the players will be fighting over, meaning no two games will ever be quite alike! Roll once on each table, in order, to define the game you will play, or, if you have the Epic Warpath scenario cards, draw one randomly from each set in order<\/p>"},{"m":"c.","t":"Scenario Parameters","p":"P53","l":1,"h":""},{"m":"i.","t":"1. Deployment Zones","p":"P53","l":2,"h":"<p>This Scenario Parameter includes a map of the battlefield showing where each player can deploy their units on the board. It is a good idea to mark the selected Deployment Zones with dice.<\/p> <table> <tbody> <tr> <th>D8 Roll<\/th> <th>Deployment Zones Chart<\/th> <\/tr> <tr> <td>1-2<\/td> <td>Both players deploy along the longest table edges, at least 15” from the centre line between the players<\/td> <\/tr> <tr> <td>3-4<\/td> <td>Both players deploy along the shortest table edges, at least 15” from the centre line between the players<\/td> <\/tr> <tr> <td>5-6<\/td> <td>Randomly determine two opposite corners. Each deployment zone is a triangle drawn from the midpoint + 6” of one table edge, to the mid-point +6” along the adjoining edge.<\/td> <\/tr> <tr> <td>7-8<\/td> <td>All four corners are used. Deployment zones rectangles 24” away from any other Deployment Zone. Each player gets one pair of opposite corners and must alternate deploying Units into each (so there are roughly equal numbers of Units in both of a player’ zones).<\/td> <\/tr> <\/tbody> <\/table> <p><img alt=\"Rules diagram\" loading=\"lazy\" src=\"https://companion.manticgames.com/uploads/ewp/rules/deployments.png\"/><\/p>"},{"m":"ii.","t":"2. Objectives","p":"P54","l":2,"h":"<p>This Scenario Parameter instructs players on how to place Objectives, which players must then claim to score points in order to win the game. This may be at the end of the game, but is more often calculated at the end of each Round, as explained in Scoring below. Objectives can be pieces of vital Intel, hardware, ammunition or even food. You should use the Objective markers provided, but these can also be used alongside a suitably modelled decorative objective. In any case, objectives do not block LOS or affect movement.<\/p> <table> <tbody> <tr> <td>D8 Roll<\/td> <td>Objectives Chart<\/td> <\/tr> <tr> <td>1-2<\/td> <td>Use five Dyn
